[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    unit: Unit tests that test individual components in isolation
    integration: Integration tests that test multiple components working together
    slow: Tests that take longer than 1 second to run
    model: Tests that involve machine learning models
    s3: Tests that interact with S3 storage
    rabbitmq: Tests that interact with RabbitMQ
    api: Tests that test API endpoints

# Coverage configuration
addopts = 
    --cov=document_service 
    --cov-report=term-missing 
    --cov-report=xml:coverage.xml 
    --cov-report=html:coverage_html 
    --cov-fail-under=80

# Coverage thresholds
cov-report =
    term-missing
    xml:coverage.xml
    html:coverage_html

# Fail if coverage is below these thresholds
cov-fail-under-line = 80
cov-fail-under-branch = 75
cov-fail-under-function = 80
cov-fail-under-statement = 80

# Log configuration
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Environment variable defaults for testing
env =
    PYTHONPATH=.
    ENVIRONMENT=test
    LOG_LEVEL=INFO
    RABBITMQ_HOST=localhost
    RABBITMQ_PORT=5672
    RABBITMQ_USER=guest
    RABBITMQ_PASSWORD=guest
    RABBITMQ_EXCHANGE=mca.documents.test
    S3_ENDPOINT=http://localhost:4566
    S3_BUCKET=mca-documents-test
    S3_ACCESS_KEY=test
    S3_SECRET_KEY=test
    MODEL_PATH=tests/test_data/models
    API_PORT=8080
    API_HOST=0.0.0.0

# Disable warnings during test execution
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Configure test timeout to prevent hanging tests
timeout = 300

# Configure parallel test execution
xvs_num_processes = auto

# Configure test randomization to detect test interdependencies
randomize = True