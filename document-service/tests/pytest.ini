[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    unit: Unit tests that test individual components in isolation
    integration: Integration tests that test interactions between components
    slow: Tests that take longer than 1 second to run
    performance: Tests that measure performance metrics
    model: Tests for machine learning models
    api: Tests for API endpoints
    service: Tests for service layer components
    utils: Tests for utility functions
    types: Tests for type definitions
    e2e: End-to-end tests that test the entire system

# Test execution
testpaths = tests
norecursedirs = .git .tox .eggs __pycache__ dist build
addopts = --strict-markers --cov=src --cov-report=term --cov-report=xml:coverage.xml --cov-report=html:coverage_html

# Coverage thresholds
cov-fail-under = 80

# Coverage configuration
[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError

[coverage:run]
omit =
    tests/*
    setup.py

# Coverage thresholds by category
[coverage:paths]
sources =
    src/

# Threshold configuration
[coverage:html]
directory = coverage_html

# Logging configuration
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Environment variables for testing
env =
    PYTHONPATH=.
    ENVIRONMENT=test
    LOG_LEVEL=INFO
    S3_ENDPOINT=http://localhost:9000
    S3_BUCKET=test-documents
    S3_ACCESS_KEY=test-access-key
    S3_SECRET_KEY=test-secret-key
    RABBITMQ_HOST=localhost
    RABBITMQ_PORT=5672
    RABBITMQ_USER=guest
    RABBITMQ_PASSWORD=guest
    RABBITMQ_EXCHANGE=mca.documents
    RABBITMQ_QUEUE=document-processing
    MODEL_PATH=tests/test_data/models
    CLASSIFICATION_THRESHOLD=0.85

# Plugin configuration
xvfb_width = 1280
xvfb_height = 720
xvfb_colordepth = 24