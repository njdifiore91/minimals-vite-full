[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers for test categorization
markers =
    unit: Unit tests for isolated components
    integration: Integration tests for component interactions
    performance: Performance tests for measuring system capabilities
    slow: Tests that take longer than average to run
    gpu: Tests that require GPU acceleration
    s3: Tests that interact with S3 storage
    rabbitmq: Tests that interact with RabbitMQ
    tensorflow: Tests that use TensorFlow models
    api: Tests for API endpoints
    confidence: Tests for confidence scoring functionality
    document_type: Tests for document type classification

# Coverage configuration
addopts = 
    --cov=src 
    --cov-report=term-missing 
    --cov-report=html:coverage/html 
    --cov-report=xml:coverage/coverage.xml 
    --cov-fail-under=80 
    --no-cov-on-fail
    --strict-markers

# Coverage thresholds - aligned with section 6.6.4.1
cov-fail-under-line = 80
cov-fail-under-branch = 75
cov-fail-under-function = 80
cov-fail-under-statement = 80

# Logging configuration
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Environment variable defaults for testing
env =
    ENVIRONMENT=test
    LOG_LEVEL=INFO
    RABBITMQ_HOST=localhost
    RABBITMQ_PORT=5672
    RABBITMQ_USER=guest
    RABBITMQ_PASSWORD=guest
    RABBITMQ_EXCHANGE=mca.documents
    RABBITMQ_QUEUE=document-processing
    S3_ENDPOINT=http://localhost:9000
    S3_ACCESS_KEY=minioadmin
    S3_SECRET_KEY=minioadmin
    S3_BUCKET=mca-documents-test
    S3_REGION=us-east-1
    TENSORFLOW_DEVICE=/CPU:0
    OCR_CONFIDENCE_THRESHOLD=0.85
    OCR_BATCH_SIZE=10
    OCR_MAX_RETRIES=3
    OCR_RETRY_DELAY=1
    ENABLE_GPU=false
    DATA_EXTRACTION_ACCURACY_TARGET=0.99
    PROCESSING_TIME_LIMIT_SECONDS=300

# Test parallelization configuration
xdist_numprocesses = auto

# Disable warnings from third-party libraries
filterwarnings =
    ignore::DeprecationWarning:tensorflow.*:
    ignore::DeprecationWarning:numpy.*:
    ignore::UserWarning:matplotlib.*:
    ignore::FutureWarning:.*:

# Test session configuration
minversion = 6.0
required_plugins = pytest-cov pytest-env pytest-mock pytest-asyncio pytest-xdist

# Timeout for tests (in seconds)
timeout = 300

# Show extra test summary info
verbose = 2

# Test selection options
keywordexpr =

# Run tests in specific order
xdist_group_by = module

# Rerun failed tests to identify flaky tests
reruns = 2
reruns_delay = 1

# JUnit XML report for CI integration
junitxml = test-results/junit.xml