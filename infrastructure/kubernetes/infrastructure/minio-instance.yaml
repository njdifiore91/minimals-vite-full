# MinIO instance configuration for MCA Application Processing System
# This file defines the MinIO Tenant Custom Resource that creates an S3-compatible
# storage instance with the required buckets, encryption, and access controls.
# 
# This configuration implements the following requirements from the technical specification:
# - S3-compatible storage with AES-256 encryption for document storage
# - Buckets: 'mca-documents-production' and 'mca-documents-staging'
# - Bucket versioning and lifecycle policies for document retention
# - Access controls for secure document access
# - High availability configuration with proper scaling based on environment

apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: mca-minio
  # Create in dedicated namespace for storage resources
  namespace: mca-storage
  labels:
    app: mca-application
    component: storage
    # This will be replaced by the actual environment value during deployment
    environment: $(ENVIRONMENT)
spec:
  # High availability configuration with 4 pods for production, 2 for staging
  # This implements the requirement for scalable, secure storage with proper redundancy
  pools:
    - name: pool-0
      # Scale based on environment - 4 servers for production, 2 for staging
      # This is configured via environment variables during deployment
      servers: $(SERVERS)
      # Each server has 4 volumes for erasure coding and data protection
      volumesPerServer: 4
      volumeClaimTemplate:
        metadata:
          name: data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              # 500GB per volume, resulting in 8TB raw storage for production (4 servers × 4 volumes × 500GB)
              # and 4TB raw storage for staging (2 servers × 4 volumes × 500GB)
              storage: 500Gi
          # Use the storage class defined in storage-classes.yaml
          storageClassName: minio-storage
      # Configure resources based on environment
      resources:
        requests:
          cpu: 1
          memory: 4Gi
        limits:
          cpu: 2
          memory: 8Gi
      # Security context for MinIO pods
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
  
  # Enable automatic certificate management for TLS
  # This implements the security requirement for encrypted connections
  requestAutoCert: true
  certConfig:
    commonName: mca-minio.dollarfunding.com
    organizationName: Dollar Funding
    dnsNames:
      - mca-minio.dollarfunding.com
      # Environment-specific DNS name
      - mca-minio.$(ENVIRONMENT).dollarfunding.com
  
  # Enable console for management
  console:
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi
  
  # Configure MinIO with required settings
  configuration:
    name: mca-minio-config
  
  # Enable encryption for all data with AES-256
  # This implements the requirement for AES-256 encryption for document storage
  # as specified in section 3.5.2 of the technical specification
  encryption:
    enabled: true
    config:
      name: mca-minio-encryption
      secretKey: MINIO_KMS_SECRET_KEY
  
  # Configure buckets with versioning and lifecycle policies
  # This implements the requirement for document storage buckets with versioning
  # and lifecycle policies as specified in section 3.5.2 of the technical specification
  buckets:
    - name: mca-documents-production
      objectLock: false
      # Enable versioning for document history tracking and compliance
      versioning: true
      region: us-east-1
      purge: false
      # Only create in production environment
      condition:
        expression: "$(ENVIRONMENT) == 'production'"
      # Lifecycle rules for document retention and storage optimization
      lifecycle:
        - id: transition-to-ia
          status: Enabled
          # Transition objects to Standard-IA after 30 days
          transition:
            days: 30
            storageClass: STANDARD_IA
        - id: expire-old-versions
          status: Enabled
          # Keep non-current versions for 7 years (2555 days) for compliance
          noncurrentVersionExpiration:
            noncurrentDays: 2555
    - name: mca-documents-staging
      objectLock: false
      # Enable versioning for document history tracking
      versioning: true
      region: us-east-1
      purge: false
      # Only create in staging environment
      condition:
        expression: "$(ENVIRONMENT) == 'staging'"
      # Lifecycle rules for document retention and storage optimization
      lifecycle:
        - id: transition-to-ia
          status: Enabled
          # Transition objects to Standard-IA after 30 days
          transition:
            days: 30
            storageClass: STANDARD_IA
        - id: expire-old-versions
          status: Enabled
          # Keep non-current versions for 90 days in staging
          noncurrentVersionExpiration:
            noncurrentDays: 90
  
  # Configure users for access control
  # This implements the requirement for secure document access with proper authentication
  # and authorization as specified in section 0.1.3 of the technical specification
  users:
    # Admin user for console management
    - name: mca-admin
      secretName: mca-minio-admin-credentials
      policy: consoleAdmin
    # Application user for document access
    - name: mca-app
      secretName: mca-minio-app-credentials
      policy: readwrite
    # Read-only user for reporting and auditing
    - name: mca-readonly
      secretName: mca-minio-readonly-credentials
      policy: readonly
  
  # Define custom policies for access control
  # This implements the requirement for secure document access with proper authorization
  policies:
    # Read-write policy for application access
    - name: readwrite
      statements:
        - effect: Allow
          resources:
            - 'arn:aws:s3:::mca-documents-*/*'
          actions:
            - 's3:GetObject'
            - 's3:PutObject'
            - 's3:ListBucket'
            - 's3:GetBucketLocation'
    # Read-only policy for reporting and auditing
    - name: readonly
      statements:
        - effect: Allow
          resources:
            - 'arn:aws:s3:::mca-documents-*/*'
          actions:
            - 's3:GetObject'
            - 's3:ListBucket'
            - 's3:GetBucketLocation'
  
  # Configure environment variables for MinIO
  # These settings implement various requirements from the technical specification
  env:
    # Console access URL
    - name: MINIO_BROWSER_REDIRECT_URL
      value: https://mca-minio.$(ENVIRONMENT).dollarfunding.com
    
    # Storage class configuration with erasure coding for data protection
    # EC:4 means data is split into 4 parts with parity for redundancy
    - name: MINIO_STORAGE_CLASS_STANDARD
      value: EC:4
    
    # Enable compression for document storage efficiency
    # This reduces storage costs and improves performance
    - name: MINIO_COMPRESSION_ENABLE
      value: "on"
    - name: MINIO_COMPRESSION_EXTENSIONS
      value: ".pdf,.docx,.xlsx,.csv,.txt"
    - name: MINIO_COMPRESSION_MIME_TYPES
      value: "application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,text/plain"
    
    # Enable server-side encryption with AES-256
    # This implements the requirement for AES-256 encryption for document storage
    # as specified in section 3.5.2 of the technical specification
    - name: MINIO_KMS_AUTO_ENCRYPTION
      value: "on"
    - name: MINIO_KMS_KES_ENDPOINT
      value: "https://kes.mca-storage:7373"
    - name: MINIO_KMS_KES_KEY_FILE
      value: "/etc/minio/kes/key"
    - name: MINIO_KMS_KES_CERT_FILE
      value: "/etc/minio/kes/cert"
    - name: MINIO_KMS_KES_CA_PATH
      value: "/etc/minio/kes/ca.crt"
    - name: MINIO_KMS_KES_KEY_NAME
      value: "minio-key"
      
    # Enable audit logging for compliance
    - name: MINIO_AUDIT_WEBHOOK_ENABLE
      value: "on"
    - name: MINIO_AUDIT_WEBHOOK_ENDPOINT
      value: "http://audit-service.mca-monitoring:8080/audit"
  
  # Configure pod security
  podManagementPolicy: Parallel
  priorityClassName: high-priority
  
  # Configure service settings
  # This implements the requirement for secure access to the storage service
  serviceMetadata:
    minioServiceLabels:
      app: mca-minio
      component: storage
    minioServiceAnnotations:
      # Configure load balancer for HTTPS
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: https
      service.beta.kubernetes.io/aws-load-balancer-ssl-cert: $(SSL_CERT_ARN)
      service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
      # Enable internal load balancer for security
      service.beta.kubernetes.io/aws-load-balancer-internal: "true"
      # Add monitoring annotations
      prometheus.io/scrape: "true"
      prometheus.io/port: "9000"
      prometheus.io/path: "/minio/v2/metrics/cluster"
  
  # Configure network settings
  serviceName: mca-minio-service
  exposeServices:
    minio: true
    console: true
  
  # Configure liveness and readiness probes
  # This implements the requirement for high availability and reliability
  # with proper health monitoring as specified in section 0.2.6 of the technical specification
  liveness:
    initialDelaySeconds: 120
    periodSeconds: 60
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  
  # Configure update strategy
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  
  # Configure image pull policy
  imagePullPolicy: IfNotPresent
  
  # Configure image pull secrets if using private registry
  imagePullSecrets:
    - name: mca-registry-credentials