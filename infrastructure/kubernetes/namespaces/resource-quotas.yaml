# Note: These resource quotas are designed to ensure that the MCA Application Processing System
# can meet its performance requirements while preventing resource exhaustion. The quotas are
# structured to provide sufficient resources for each environment and service tier, with
# special attention to the OCR Service which requires GPU resources for TensorFlow processing.
#
# The quotas follow a tiered approach:
# - Development: Minimal viable resources for development work
# - Staging: Production-like with reduced scale (approximately 50% of production)
# - Production: Full scale with redundancy for high availability and performance
#
# Service-specific quotas ensure that critical services like OCR processing, database operations,
# message queuing, and caching have guaranteed resources to maintain system performance and uptime.
#
# These quotas should be reviewed and adjusted periodically based on actual usage patterns and
# performance metrics to ensure optimal resource allocation.