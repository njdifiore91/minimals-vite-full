    requests.nvidia.com/gpu: "2"
    limits.nvidia.com/gpu: "2"
    # Storage Resources
    requests.storage: "250Gi"
    persistentvolumeclaims: "30"
    # Object Count Limits
    pods: "100"
    services: "30"
    services.loadbalancers: "5"
    services.nodeports: "10"
    configmaps: "75"
    secrets: "75"
    replicationcontrollers: "30"
