# Resource Quotas for MCA Application Processing System
# This file defines ResourceQuota objects for each namespace to enforce resource limits
# and prevent resource contention. It sets CPU, memory, and storage limits for each
# environment (development, staging, production), ensuring fair resource allocation
# and preventing any single component from consuming excessive resources.
#
# Key considerations:
# - OCR Service requires GPU-enabled nodes with at least 8GB VRAM for TensorFlow processing
# - System must process applications in under 5 minutes end-to-end
# - System must support 99.9% uptime in production
# - Resource allocation follows the multi-environment strategy:
#   * Development: Minimal viable resources
#   * Staging: Production-like with reduced scale (approximately 50% of production)
#   * Production: Full scale with redundancy for high availability
#
# These quotas are designed to ensure that each environment has sufficient resources
# to meet its performance requirements while preventing resource exhaustion.

---
# Development Environment Resource Quota
# Minimal viable resources for development work
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mca-development-quota
  namespace: mca-development
  annotations:
    description: "Development resource quota for MCA Application Processing System"
    monitoring.mca.dollarfunding.com/alert-on-threshold: "90%"
    monitoring.mca.dollarfunding.com/quota-monitoring: "enabled"
spec:
  hard:
    # Compute Resources
    requests.cpu: "8"
    limits.cpu: "16"
    requests.memory: "16Gi"
    limits.memory: "32Gi"
    # GPU Resources for OCR Service
    requests.nvidia.com/gpu: "1"
    limits.nvidia.com/gpu: "1"
    # Storage Resources
    requests.storage: "100Gi"
    persistentvolumeclaims: "20"
    # Object Count Limits
    pods: "50"
    services: "20"
    services.loadbalancers: "3"
    services.nodeports: "5"
    configmaps: "50"
    secrets: "50"
    replicationcontrollers: "20"
    deployments.apps: "20"
    statefulsets.apps: "10"
    jobs.batch: "30"
    cronjobs.batch: "10"
    horizontalpodautoscalers.autoscaling: "10"

---
# Service-Specific Resource Quotas for Development
# These quotas ensure that critical services have guaranteed resources

# OCR Service Resource Quota - Development
# Ensures GPU resources are available for OCR processing
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ocr-service-quota-development
  namespace: mca-development
  labels:
    service: ocr-service
    tier: processing
  annotations:
    description: "Resource quota for OCR Service in development"
    monitoring.mca.dollarfunding.com/alert-on-threshold: "90%"
spec:
  hard:
    # Guaranteed resources for OCR Service
    requests.cpu: "2"
    limits.cpu: "4"
    requests.memory: "4Gi"
    limits.memory: "8Gi"
    # GPU resources for TensorFlow processing
    requests.nvidia.com/gpu: "1"
    limits.nvidia.com/gpu: "1"
    # Storage for model files and temporary processing
    requests.storage: "25Gi"
    persistentvolumeclaims: "3"
    # Pod limits
    pods: "5"

# Database Services Resource Quota - Development
# Ensures PostgreSQL has sufficient resources for data processing
apiVersion: v1
kind: ResourceQuota
metadata:
  name: database-services-quota-development
  namespace: mca-development
  labels:
    service: database
    tier: data
  annotations:
    description: "Resource quota for database services in development"
    monitoring.mca.dollarfunding.com/alert-on-threshold: "90%"
spec:
  hard:
    # Guaranteed resources for database services
    requests.cpu: "2"
    limits.cpu: "4"
    requests.memory: "4Gi"
    limits.memory: "8Gi"
    # Storage for database files
    requests.storage: "50Gi"
    persistentvolumeclaims: "5"
    # Pod limits
    pods: "3"

# Message Queue Resource Quota - Development
# Ensures RabbitMQ has sufficient resources for message processing
apiVersion: v1
kind: ResourceQuota
metadata:
  name: message-queue-quota-development
  namespace: mca-development
  labels:
    service: rabbitmq
    tier: messaging
  annotations:
    description: "Resource quota for message queue services in development"
    monitoring.mca.dollarfunding.com/alert-on-threshold: "90%"
spec:
  hard:
    # Guaranteed resources for message queue services
    requests.cpu: "1"
    limits.cpu: "2"
    requests.memory: "2Gi"
    limits.memory: "4Gi"
    # Storage for message persistence
    requests.storage: "10Gi"
    persistentvolumeclaims: "2"
    # Pod limits
    pods: "3"

