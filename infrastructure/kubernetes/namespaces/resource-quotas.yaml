---
# Production Environment Resource Quota
# Full scale with redundancy for high availability and performance
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mca-production-quota
  namespace: mca-production
  annotations:
    description: "Production resource quota for MCA Application Processing System"
    monitoring.mca.dollarfunding.com/alert-on-threshold: "80%"
    monitoring.mca.dollarfunding.com/quota-monitoring: "enabled"
spec:
  hard:
    # Compute Resources
    requests.cpu: "32"
    limits.cpu: "64"
    requests.memory: "64Gi"
    limits.memory: "128Gi"
    # GPU Resources for OCR Service
    # Minimum 4 GPUs with at least 8GB VRAM each for high-performance OCR processing
    requests.nvidia.com/gpu: "4"
    limits.nvidia.com/gpu: "4"
    # Storage Resources
    requests.storage: "500Gi"
    persistentvolumeclaims: "50"
    # Object Count Limits
    pods: "200"
    services: "50"
    services.loadbalancers: "10"
    services.nodeports: "15"
    configmaps: "100"
    secrets: "100"
    replicationcontrollers: "50"
    deployments.apps: "50"
    statefulsets.apps: "25"
    jobs.batch: "100"
    cronjobs.batch: "25"
    horizontalpodautoscalers.autoscaling: "25"

