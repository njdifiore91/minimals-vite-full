# RBAC Configuration for MCA Application Processing System
# This file defines Role-Based Access Control policies across all namespaces
# Implements security requirements from Technical Specification section 3.8

---
# ServiceAccounts for each microservice
# These accounts provide identity for processes running in pods
# Follows principle of least privilege as specified in section 3.8.4

# Email Service ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: email-service
  namespace: mca-processing
  labels:
    app.kubernetes.io/part-of: mca-processing
    app.kubernetes.io/component: email-service
    app.kubernetes.io/managed-by: terraform
  annotations:
    description: "Service account for Email Service that monitors submissions inbox using IMAP protocol"
---
# Document Service ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: document-service
  namespace: mca-processing
  labels:
    app.kubernetes.io/part-of: mca-processing
    app.kubernetes.io/component: document-service
    app.kubernetes.io/managed-by: terraform
  annotations:
    description: "Service account for Document Service that classifies incoming documents with AI"
---
# OCR Service ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ocr-service
  namespace: mca-processing
  labels:
    app.kubernetes.io/part-of: mca-processing
    app.kubernetes.io/component: ocr-service
    app.kubernetes.io/managed-by: terraform
  annotations:
    description: "Service account for OCR Service that extracts data from documents using TensorFlow"
---
# Data Service ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-service
  namespace: mca-processing
  labels:
    app.kubernetes.io/part-of: mca-processing
    app.kubernetes.io/component: data-service
    app.kubernetes.io/managed-by: terraform
  annotations:
    description: "Service account for Data Service that manages application data and business logic"
---
# Notification Service ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: mca-processing
  labels:
    app.kubernetes.io/part-of: mca-processing
    app.kubernetes.io/component: notification-service
    app.kubernetes.io/managed-by: terraform
  annotations:
    description: "Service account for Notification Service that handles alerts and webhooks"
---
# API Gateway ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: mca-processing
  labels:
    app.kubernetes.io/part-of: mca-processing
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/managed-by: terraform
  annotations:
    description: "Service account for Kong API Gateway that provides unified API access with security controls"

---
# Roles for user types as specified in section 0.1.3 (Authentication/Authorization Considerations)
# Implements two specific roles: Operations Staff and System Admin

# Operations Staff Role - Read all, write application data
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operations-staff-role
  namespace: mca-processing
  labels:
    app.kubernetes.io/part-of: mca-processing
    app.kubernetes.io/managed-by: terraform
  annotations:
    description: "Role for Operations Staff with permissions to read all and write application data"
rules:
# Read access to all resources
- apiGroups: [""] # Core API group
  resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
# Write access to application data resources
- apiGroups: [""] # Core API group
  resources: ["configmaps"]
  resourceNames: ["application-data", "document-metadata"]
  verbs: ["update", "patch"]
# Access to logs
- apiGroups: [""] # Core API group
  resources: ["pods/log"]
  verbs: ["get", "list"]
# Access to application-specific custom resources
- apiGroups: ["mca.dollarfunding.com"]
  resources: ["applications", "documents"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]

---
# System Admin Role - Full access to all endpoints and webhook configuration
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: system-admin-role
  namespace: mca-processing
  labels:
    app.kubernetes.io/part-of: mca-processing
    app.kubernetes.io/managed-by: terraform
  annotations:
    description: "Role for System Admin with full access to all endpoints and webhook configuration"
rules:
# Full access to all resources in the namespace
- apiGroups: [""] # Core API group
  resources: ["*"]
  verbs: ["*"]
# Full access to all custom resources
- apiGroups: ["mca.dollarfunding.com"]
  resources: ["*"]
  verbs: ["*"]
# Full access to webhook configuration
- apiGroups: ["mca.dollarfunding.com"]
  resources: ["webhooks", "webhookconfigurations"]
  verbs: ["*"]
# Access to Kong API Gateway configuration
- apiGroups: ["configuration.konghq.com"]
  resources: ["kongplugins", "kongconsumers", "kongingresses"]
  verbs: ["*"]

---
# RoleBindings to connect roles to service accounts
# Implements the principle of least privilege as specified in section 3.8.4

# Email Service RoleBinding - Limited to email monitoring and message queue access
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: email-service-binding
  namespace: mca-processing
  labels:
    app.kubernetes.io/part-of: mca-processing
    app.kubernetes.io/managed-by: terraform
subjects:
- kind: ServiceAccount
  name: email-service
  namespace: mca-processing
roleRef:
  kind: Role
  name: email-service-role
  apiGroup: rbac.authorization.k8s.io

---
# Email Service Role - Limited permissions for email processing
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: email-service-role
  namespace: mca-processing
  labels:
    app.kubernetes.io/part-of: mca-processing
    app.kubernetes.io/managed-by: terraform
rules:
# Access to its own configuration
- apiGroups: [""] # Core API group
  resources: ["configmaps"]
  resourceNames: ["email-service-config"]
  verbs: ["get", "list", "watch"]
# Access to RabbitMQ credentials
- apiGroups: [""] # Core API group
  resources: ["secrets"]
  resourceNames: ["rabbitmq-credentials"]
  verbs: ["get"]
# Access to email credentials
- apiGroups: [""] # Core API group
  resources: ["secrets"]
  resourceNames: ["email-credentials"]
  verbs: ["get"]

