---
# ClusterRole for JWT authentication validation
# This allows the API Gateway to validate JWTs against the public keys
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jwt-validator
  labels:
    app.kubernetes.io/part-of: mca-processing
    app.kubernetes.io/managed-by: terraform
rules:
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]

---
# ClusterRoleBinding for JWT authentication validation
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jwt-validator-binding
  labels:
    app.kubernetes.io/part-of: mca-processing
    app.kubernetes.io/managed-by: terraform
subjects:
- kind: ServiceAccount
  name: api-gateway
  namespace: mca-processing
roleRef:
