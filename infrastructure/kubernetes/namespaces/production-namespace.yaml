# Production Namespace Definition for MCA Application Processing System
# This namespace hosts all production microservices with strict resource controls and security settings
# It ensures complete isolation from development and staging workloads
# and implements production-grade configurations for high availability and security

apiVersion: v1
kind: Namespace
metadata:
  name: mca-production
  labels:
    name: mca-production
    environment: production
    app.kubernetes.io/part-of: mca-application-system
    app.kubernetes.io/managed-by: terraform
    app.kubernetes.io/created-by: operations-team
    # Service discovery labels
    service-tier: production
    network-zone: secure
    data-classification: sensitive
    # Infrastructure labels
    infrastructure.mca.dollarfunding.com/high-availability: "true"
    infrastructure.mca.dollarfunding.com/gpu-enabled: "true"
    infrastructure.mca.dollarfunding.com/priority-class: "production-critical"
  annotations:
    # Environment information
    environment.mca.dollarfunding.com/type: "production"
    environment.mca.dollarfunding.com/tier: "customer-facing"
    
    # Resource management
    scheduler.alpha.kubernetes.io/node-selector: "environment=production,workload=application"
    
    # Monitoring and observability
    monitoring.mca.dollarfunding.com/datadog-enabled: "true"
    monitoring.mca.dollarfunding.com/prometheus-scrape: "true"
    monitoring.mca.dollarfunding.com/log-collection: "true"
    monitoring.mca.dollarfunding.com/sla-tier: "tier-1"
    monitoring.mca.dollarfunding.com/uptime-target: "99.9"
    monitoring.mca.dollarfunding.com/alert-priority: "p1"
    monitoring.mca.dollarfunding.com/metrics-retention: "90d"
    monitoring.mca.dollarfunding.com/performance-metrics: "application-processing-time,ocr-accuracy,queue-depth,api-response-time"
    monitoring.mca.dollarfunding.com/log-level: "INFO"
    
    # Security and compliance
    security.mca.dollarfunding.com/network-policy-enforced: "true"
    security.mca.dollarfunding.com/pod-security-enforced: "true"
    security.mca.dollarfunding.com/data-classification: "sensitive"
    security.mca.dollarfunding.com/pii-handling: "true"
    security.mca.dollarfunding.com/encryption-at-rest: "aes-256"
    security.mca.dollarfunding.com/field-level-encryption: "enabled"
    security.mca.dollarfunding.com/tls-version: "1.3"
    security.mca.dollarfunding.com/jwt-auth-required: "true"
    security.mca.dollarfunding.com/rate-limiting: "enabled"
    security.mca.dollarfunding.com/security-scan-schedule: "daily"
    
    # Cost allocation
    cost.mca.dollarfunding.com/business-unit: "funding-operations"
    cost.mca.dollarfunding.com/cost-center: "mca-application-processing"
    
    # Documentation
    documentation.mca.dollarfunding.com/runbook: "https://docs.dollarfunding.com/mca/runbooks/production"
    documentation.mca.dollarfunding.com/owner: "operations-team@dollarfunding.com"
    
    # Backup and disaster recovery
    backup.mca.dollarfunding.com/schedule: "daily"
    backup.mca.dollarfunding.com/retention: "90d"
    backup.mca.dollarfunding.com/disaster-recovery-tier: "tier-1"
    
    # Deployment information
    deployment.mca.dollarfunding.com/strategy: "blue-green"
    deployment.mca.dollarfunding.com/approval-required: "true"
    deployment.mca.dollarfunding.com/maintenance-window: "sunday-01:00-05:00-UTC"
    deployment.mca.dollarfunding.com/rollback-enabled: "true"
    deployment.mca.dollarfunding.com/canary-deployment: "enabled"
    deployment.mca.dollarfunding.com/feature-flags: "enabled"
    deployment.mca.dollarfunding.com/min-replicas: "2"
    deployment.mca.dollarfunding.com/max-unavailable: "25%"
    
    # Compliance
    compliance.mca.dollarfunding.com/data-retention: "7-years"
    compliance.mca.dollarfunding.com/audit-logging: "enabled"
    compliance.mca.dollarfunding.com/last-review: "2025-05-01"
    compliance.mca.dollarfunding.com/data-archival: "enabled"
    compliance.mca.dollarfunding.com/access-control: "rbac-enforced"