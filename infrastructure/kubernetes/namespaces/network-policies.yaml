# RabbitMQ Network Policy
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: rabbitmq-network-policy
    namespace: ${ENVIRONMENT}
    labels:
      app.kubernetes.io/component: messaging
      app.kubernetes.io/part-of: mca-application-system
  spec:
    podSelector:
      matchLabels:
        app.kubernetes.io/name: rabbitmq
    policyTypes:
    - Ingress
    - Egress
    ingress:
    # Allow ingress from all microservices that need to publish messages
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: email-service
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: document-service
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: ocr-service
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: data-service
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: notification-service
      ports:
      - protocol: TCP
        port: 5672  # RabbitMQ AMQP port
      - protocol: TCP
        port: 15672  # RabbitMQ management port
    egress:
    # Allow egress to all microservices that consume messages
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: document-service
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: ocr-service
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: data-service
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: notification-service
      ports:
      - protocol: TCP
        port: 8000  # Document and OCR Service port
      - protocol: TCP
        port: 8080  # Data Service port
      - protocol: TCP
        port: 3000  # Notification Service port
    # Allow DNS resolution
    - to:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53

# Default Deny All Network Policy
# This policy ensures that any traffic not explicitly allowed by other policies is denied
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: default-deny-all
    namespace: ${ENVIRONMENT}
    labels:
      app.kubernetes.io/component: security
      app.kubernetes.io/part-of: mca-application-system
  spec:
    podSelector: {}  # Selects all pods in the namespace
    policyTypes:
    - Ingress
    - Egress
    # No ingress or egress rules means all traffic is denied by default