{{- /*
HorizontalPodAutoscaler template for Email Service.

This template defines a Kubernetes HorizontalPodAutoscaler (HPA) for the Email Service
with specific configurations tailored to its workload characteristics. The Email Service
monitors email inboxes using IMAP protocol and processes incoming emails with attachments,
requiring specific scaling configurations to handle varying loads.

Key features:
- CPU and memory-based scaling metrics tailored for Email Service workloads
- Environment-specific replica configurations
- Optimized scaling behavior for email processing workloads
- Custom metrics for monitoring email processing queue depth (when available)

This HPA ensures the Email Service can scale appropriately to maintain the 99.9% system
uptime requirement while efficiently processing emails within the 5-minute SLA.
*/ -}}

{{- if .Values.autoscaling.enabled | default true }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.autoscaling.labels }}
    {{- include "common.tplvalues.render" (dict "value" .Values.autoscaling.labels "context" $) | nindent 4 }}
    {{- end }}
    app.kubernetes.io/component: email-service
  annotations:
    {{- if .Values.autoscaling.annotations }}
    {{- include "common.tplvalues.render" (dict "value" .Values.autoscaling.annotations "context" $) | nindent 4 }}
    {{- end }}
    {{- if .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
    {{- end }}
    kubernetes.io/description: "HPA for Email Service - IMAP polling and document processing"
    email-service.dollarfunding.com/scaling-policy: "email-processing-optimized"
    email-service.dollarfunding.com/workload-type: "polling-based"
    {{- if eq .Release.Namespace "production" }}
    monitoring.dollarfunding.com/priority: "high"
    {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ .Values.autoscaling.scaleTargetRef.kind | default "Deployment" }}
    name: {{ .Values.autoscaling.scaleTargetRef.name | default (include "common.names.fullname" .) }}
  # Environment-specific replica configurations
  # Production: 3-10 replicas for high availability and load handling
  # Staging: 2-5 replicas for testing with moderate load
  # Development: 1-3 replicas for basic functionality
  minReplicas: {{ if eq .Release.Namespace "production" }}3{{ else if eq .Release.Namespace "staging" }}2{{ else }}1{{ end }}
  maxReplicas: {{ if eq .Release.Namespace "production" }}10{{ else if eq .Release.Namespace "staging" }}5{{ else }}3{{ end }}
  metrics:
    # CPU utilization metric - primary scaling metric for Email Service
    # Target is set to 70% to allow headroom for processing spikes
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage | default 70 }}
    # Memory utilization metric - important for email attachment processing
    # Email attachments can be memory-intensive to process
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage | default 80 }}
    {{- if .Values.autoscaling.customMetrics }}
    # Custom metrics - service-specific metrics for email processing
    {{- include "common.tplvalues.render" (dict "value" .Values.autoscaling.customMetrics "context" $) | nindent 4 }}
    {{- end }}
    {{- if .Values.autoscaling.enableQueueMetric }}
    # RabbitMQ queue metric - scales based on message backlog
    - type: Pods
      pods:
        metric:
          name: rabbitmq_queue_messages
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.queueMetricThreshold | default 50 }}
    {{- end }}
  # Scaling behavior optimized for email processing workloads
  # - Quick scale up to handle email processing spikes
  # - Conservative scale down to prevent thrashing
  behavior:
    scaleDown:
      # Longer stabilization window for scale down to prevent thrashing
      # Email processing can be bursty, so we want to avoid scaling down too quickly
      stabilizationWindowSeconds: {{ .Values.autoscaling.scaleDownStabilizationWindowSeconds | default 300 }}
      policies:
      # Scale down conservatively - 10% of current replicas per minute
      - type: Percent
        value: {{ .Values.autoscaling.scaleDownPercentage | default 10 }}
        periodSeconds: 60
      # Never scale down by more than 1 pod at a time for email service
      # This ensures we maintain capacity for processing incoming emails
      - type: Pods
        value: {{ .Values.autoscaling.scaleDownPods | default 1 }}
        periodSeconds: 60
      # Use the policy that scales down the least
      selectPolicy: Min
    scaleUp:
      # Short stabilization window for scaling up to ensure quick response to load
      # This helps maintain the 5-minute processing SLA mentioned in section 0.2.6
      stabilizationWindowSeconds: {{ .Values.autoscaling.scaleUpStabilizationWindowSeconds | default 60 }}
      policies:
      # Scale up by at most 100% of current replicas per minute
      # This allows for rapid scaling when email volume increases
      - type: Percent
        value: {{ .Values.autoscaling.scaleUpPercentage | default 100 }}
        periodSeconds: 60
      # But never scale up by more than 2 pods per minute for email service
      # This prevents over-provisioning while still allowing quick scaling
      - type: Pods
        value: {{ .Values.autoscaling.scaleUpPods | default 2 }}
        periodSeconds: 60
      # Use the policy that scales up the most
      selectPolicy: Max
{{- end }}