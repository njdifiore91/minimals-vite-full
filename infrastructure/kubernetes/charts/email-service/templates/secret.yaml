{{- /*
Email Service Secret template for MCA Application Processing System.

This template creates Kubernetes Secrets for the Email Service, extending the common
secret template with Email Service specific sensitive configuration data. It includes
IMAP credentials for connecting to submissions@dollarfunding.com, RabbitMQ authentication
credentials for message publishing, and S3 access keys for document storage.

Features:
- IMAP credentials for monitoring submissions inbox
- RabbitMQ authentication for message publishing
- S3 access keys for document storage
- Proper data encoding and security measures
- Environment-specific configuration

Usage:
```yaml
# values.yaml
emailService:
  secrets:
    imap:
      username: "submissions@dollarfunding.com"
      password: "your-secure-password"
    rabbitmq:
      username: "email-service"
      password: "your-rabbitmq-password"
    s3:
      accessKey: "your-s3-access-key"
      secretKey: "your-s3-secret-key"
```
*/ -}}

{{- $fullName := include "email-service.fullname" . -}}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "email-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: email-service
  annotations:
    # Add version tracking for secret rotation
    secret.kubernetes.io/version: {{ .Values.emailService.secrets.version | default "1.0.0" | quote }}
    # Add timestamp for auditing
    secret.kubernetes.io/created-at: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
    # Add encryption annotation for sensitive data (AES-256 as specified in section 0.2.6)
    encryption.kubernetes.io/encryption-provider: aes-gcm
    security.dollarfunding.com/encryption-standard: "AES-256"
    # Add environment indicator
    {{- if .Values.global }}
    {{- if .Values.global.environment }}
    environment.dollarfunding.com/name: {{ .Values.global.environment }}
    {{- end }}
    {{- end }}
type: Opaque
data:
  # IMAP credentials for connecting to submissions@dollarfunding.com as specified in section 0.1.2
  IMAP_HOST: {{ .Values.emailService.secrets.imap.host | default "imap.dollarfunding.com" | b64enc | quote }}
  IMAP_PORT: {{ .Values.emailService.secrets.imap.port | default "993" | b64enc | quote }}
  IMAP_USERNAME: {{ .Values.emailService.secrets.imap.username | default "submissions@dollarfunding.com" | b64enc | quote }}
  IMAP_PASSWORD: {{ .Values.emailService.secrets.imap.password | b64enc | quote }}
  IMAP_USE_SSL: {{ .Values.emailService.secrets.imap.useSsl | default "true" | b64enc | quote }}
  IMAP_FOLDER: {{ .Values.emailService.secrets.imap.folder | default "INBOX" | b64enc | quote }}
  IMAP_POLL_INTERVAL: {{ .Values.emailService.secrets.imap.pollInterval | default "60" | b64enc | quote }}
  
  # RabbitMQ authentication for message publishing as specified in section 0.1.4
  RABBITMQ_HOST: {{ .Values.rabbitmq.host | default (printf "%s-rabbitmq" .Release.Name) | b64enc | quote }}
  RABBITMQ_PORT: {{ .Values.rabbitmq.port | default "5672" | b64enc | quote }}
  RABBITMQ_USERNAME: {{ .Values.emailService.secrets.rabbitmq.username | default "email-service" | b64enc | quote }}
  RABBITMQ_PASSWORD: {{ .Values.emailService.secrets.rabbitmq.password | b64enc | quote }}
  RABBITMQ_VHOST: {{ .Values.rabbitmq.vhost | default "/" | b64enc | quote }}
  
  # Exchange and queue configuration as specified in section 0.1.4
  RABBITMQ_EXCHANGE: {{ .Values.rabbitmq.exchange | default "mca.documents" | b64enc | quote }}
  RABBITMQ_QUEUE_DOCUMENT_PROCESSING: {{ .Values.rabbitmq.queues.documentProcessing | default "document-processing" | b64enc | quote }}
  
  # S3 access keys for document storage as specified in section 0.2.5
  S3_ENDPOINT: {{ .Values.s3.endpoint | default "s3.amazonaws.com" | b64enc | quote }}
  S3_REGION: {{ .Values.s3.region | default "us-east-1" | b64enc | quote }}
  S3_ACCESS_KEY: {{ .Values.emailService.secrets.s3.accessKey | b64enc | quote }}
  S3_SECRET_KEY: {{ .Values.emailService.secrets.s3.secretKey | b64enc | quote }}
  
  # Bucket names based on environment as specified in section 0.2.5
  {{- if .Values.global }}
  {{- if eq .Values.global.environment "production" }}
  S3_BUCKET_NAME: {{ .Values.s3.bucketName | default "mca-documents-production" | b64enc | quote }}
  {{- else if eq .Values.global.environment "staging" }}
  S3_BUCKET_NAME: {{ .Values.s3.bucketName | default "mca-documents-staging" | b64enc | quote }}
  {{- else }}
  S3_BUCKET_NAME: {{ .Values.s3.bucketName | default "mca-documents-development" | b64enc | quote }}
  {{- end }}
  {{- else }}
  S3_BUCKET_NAME: {{ .Values.s3.bucketName | default "mca-documents" | b64enc | quote }}
  {{- end }}
  
  # Encryption settings as specified in section 0.2.5
  S3_USE_SSL: {{ .Values.s3.useSsl | default "true" | b64enc | quote }}
  S3_ENCRYPTION: {{ .Values.s3.encryption | default "AES256" | b64enc | quote }}
  
  # Email attachment handling configuration
  ATTACHMENT_MAX_SIZE_MB: {{ .Values.emailService.attachmentMaxSizeMb | default "25" | b64enc | quote }}
  ALLOWED_ATTACHMENT_TYPES: {{ .Values.emailService.allowedAttachmentTypes | default "pdf,jpg,jpeg,png,tiff,doc,docx,xls,xlsx" | b64enc | quote }}
  
  # Error handling and retry configuration
  MAX_RETRY_ATTEMPTS: {{ .Values.emailService.maxRetryAttempts | default "3" | b64enc | quote }}
  RETRY_DELAY_MS: {{ .Values.emailService.retryDelayMs | default "5000" | b64enc | quote }}

{{- /* Include common secrets if enabled */ -}}
{{- if .Values.includeCommonSecrets }}
{{- include "common.secrets" . }}
{{- end }}