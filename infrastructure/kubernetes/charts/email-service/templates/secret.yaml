{{- /*
Email Service Secret template for MCA Application Processing System.

This template creates Kubernetes Secrets for the Email Service, extending the common
secret template with Email Service specific sensitive configuration data, including
IMAP credentials, RabbitMQ authentication, and S3 access keys.

Features:
- Secure storage of IMAP credentials for submissions@dollarfunding.com mailbox
- RabbitMQ authentication for message publishing
- S3 access keys for document storage
- Proper data encoding and security measures
- Environment-specific configurations

Usage:
```yaml
# values.yaml
secrets:
  - name: email-service-secrets
    type: Opaque
    serviceType: email-service
    annotations:
      version: "1.0.0"
    data:
      IMAP_USERNAME: "submissions@dollarfunding.com"
      IMAP_PASSWORD: "your-secure-password"
      RABBITMQ_USERNAME: "rabbitmq-user"
      RABBITMQ_PASSWORD: "rabbitmq-password"
      S3_ACCESS_KEY: "your-s3-access-key"
      S3_SECRET_KEY: "your-s3-secret-key"
```
*/ -}}

{{- $emailServiceSecrets := list -}}

{{- /* Email Service IMAP Credentials */ -}}
{{- $imapSecrets := dict -}}
{{- $_ := set $imapSecrets "name" (printf "%s-imap-credentials" (include "common.name" .)) -}}
{{- $_ := set $imapSecrets "type" "Opaque" -}}
{{- $_ := set $imapSecrets "serviceType" "email-service" -}}
{{- $_ := set $imapSecrets "annotations" (dict "version" "1.0.0") -}}
{{- $_ := set $imapSecrets "data" (dict 
  "IMAP_HOST" .Values.imap.host 
  "IMAP_PORT" (toString .Values.imap.port) 
  "IMAP_USERNAME" .Values.imap.user 
  "IMAP_PASSWORD" .Values.imap.password 
  "IMAP_TLS" (toString .Values.imap.tls) 
  "IMAP_TIMEOUT" (toString .Values.imap.timeout) 
) -}}
{{- $emailServiceSecrets = append $emailServiceSecrets $imapSecrets -}}

{{- /* Email Service RabbitMQ Credentials */ -}}
{{- $rabbitmqSecrets := dict -}}
{{- $_ := set $rabbitmqSecrets "name" (printf "%s-rabbitmq-credentials" (include "common.name" .)) -}}
{{- $_ := set $rabbitmqSecrets "type" "Opaque" -}}
{{- $_ := set $rabbitmqSecrets "serviceType" "email-service" -}}
{{- $_ := set $rabbitmqSecrets "annotations" (dict "version" "1.0.0") -}}
{{- $_ := set $rabbitmqSecrets "data" (dict 
  "RABBITMQ_HOST" .Values.rabbitmq.host 
  "RABBITMQ_PORT" (toString .Values.rabbitmq.port) 
  "RABBITMQ_USERNAME" .Values.rabbitmq.user 
  "RABBITMQ_PASSWORD" .Values.rabbitmq.password 
  "RABBITMQ_VHOST" .Values.rabbitmq.vhost 
  "RABBITMQ_EXCHANGE" .Values.rabbitmq.exchange 
  "RABBITMQ_EXCHANGE_TYPE" .Values.rabbitmq.exchangeType 
  "RABBITMQ_QUEUE" .Values.rabbitmq.queue 
) -}}
{{- $emailServiceSecrets = append $emailServiceSecrets $rabbitmqSecrets -}}

{{- /* Email Service S3 Credentials */ -}}
{{- $s3Secrets := dict -}}
{{- $_ := set $s3Secrets "name" (printf "%s-s3-credentials" (include "common.name" .)) -}}
{{- $_ := set $s3Secrets "type" "Opaque" -}}
{{- $_ := set $s3Secrets "serviceType" "email-service" -}}
{{- $_ := set $s3Secrets "annotations" (dict "version" "1.0.0") -}}

{{- /* Set default S3 bucket name based on environment */ -}}
{{- $s3BucketName := "mca-documents" -}}
{{- if .Values.global -}}
  {{- if .Values.global.environment -}}
    {{- if eq .Values.global.environment "production" -}}
      {{- $s3BucketName = "mca-documents-production" -}}
    {{- else if eq .Values.global.environment "staging" -}}
      {{- $s3BucketName = "mca-documents-staging" -}}
    {{- else -}}
      {{- $s3BucketName = "mca-documents-development" -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{- $_ := set $s3Secrets "data" (dict 
  "S3_ENDPOINT" (.Values.s3.endpoint | default "s3.amazonaws.com") 
  "S3_REGION" (.Values.s3.region | default "us-east-1") 
  "S3_ACCESS_KEY" (.Values.s3.accessKey | default "") 
  "S3_SECRET_KEY" (.Values.s3.secretKey | default "") 
  "S3_BUCKET_NAME" (.Values.s3.bucketName | default $s3BucketName) 
  "S3_USE_SSL" (.Values.s3.useSsl | default "true") 
  "S3_ENCRYPTION" (.Values.s3.encryption | default "AES256") 
) -}}
{{- $emailServiceSecrets = append $emailServiceSecrets $s3Secrets -}}

{{- /* Set the secrets list in Values for use by the common secret template */ -}}
{{- $_ := set .Values "secrets" $emailServiceSecrets -}}

{{- /* Include the common secret template */ -}}
{{- include "common.secret" . -}}