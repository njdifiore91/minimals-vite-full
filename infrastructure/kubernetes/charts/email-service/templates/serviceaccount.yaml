{{- /*
ServiceAccount template for Email Service.

This template extends the common serviceaccount template with Email Service specific
configurations, including annotations for cloud provider IAM integration. It ensures
that the Email Service has the proper identity and permissions within the cluster
for accessing required resources like IMAP email servers and RabbitMQ.

The Email Service requires specific IAM roles for:
- IMAP email monitoring with TLS encryption
- RabbitMQ message publishing
- Logging and monitoring permissions

Parameters:
  - .Values.serviceAccount.create: Whether to create a service account (default: true)
  - .Values.serviceAccount.name: Name of the service account (default: release name)
  - .Values.serviceAccount.annotations: Map of annotations to add to the service account
  - .Values.serviceAccount.emailServiceAnnotations: Email Service specific annotations
  - .Values.serviceAccount.automountServiceAccountToken: Whether to auto-mount the token (default: true)
  - .Values.serviceAccount.imagePullSecrets: List of image pull secrets to add
  - .Values.global.provider: Cloud provider (aws, azure, gcp)
  - .Values.global.awsAccountId: AWS account ID for IAM role ARN
  - .Values.global.gcpProjectId: GCP project ID for service account email
*/ -}}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "common.serviceAccountName" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: email-service
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.serviceAccount.emailServiceAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if eq (.Values.global.provider | default "") "aws" }}
    # Email Service specific IAM role for IMAP and RabbitMQ access
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.iamRole | default (printf "arn:aws:iam::%s:role/%s-email-service" .Values.global.awsAccountId .Release.Namespace) }}
    {{- end }}
    {{- if eq (.Values.global.provider | default "") "azure" }}
    # Email Service specific client ID for Azure identity
    azure.workload.identity/client-id: {{ .Values.serviceAccount.clientId | default (printf "%s-email-service" .Release.Namespace) }}
    {{- end }}
    {{- if eq (.Values.global.provider | default "") "gcp" }}
    # Email Service specific service account for GCP
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount | default (printf "%s-email-service@%s.iam.gserviceaccount.com" .Release.Namespace .Values.global.gcpProjectId) }}
    {{- end }}
    # Add security annotation for Email Service
    security.kubernetes.io/purpose: "email-monitoring"
{{- if hasKey .Values.serviceAccount "automountServiceAccountToken" }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- else }}
# Default to true for Email Service as it needs to communicate with the Kubernetes API
automountServiceAccountToken: true
{{- end }}
{{- with .Values.serviceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}