{{- /*
serviceaccount.yaml for Email Service

This template extends the common serviceaccount.yaml template with Email Service specific configurations.
It provides identity for the Email Service pods and enables proper RBAC (Role-Based Access Control).

Features:
- Email Service specific IAM role annotations for accessing required resources (IMAP, RabbitMQ, S3)
- Consistent labeling using Helm helper functions
- Configurable automount of API token based on service needs

This implements the authentication/authorization considerations specified in section 0.1.3
and security architecture requirements for proper service identities.

Security Considerations:
- IAM roles with least-privilege permissions are applied to service accounts (section 3.8.2)
- Email Service Security with IMAPS connections (section 3.8.3)
- Service-to-service communications enforce strict security measures (section 3.8.3)
- JWT authentication with RS256 algorithm is used for authentication (section 0.1.3)

Usage:
- Set serviceAccount.create=true to create a service account (default: true)
- Set serviceAccount.name to override the default name
- Set serviceAccount.annotations to add custom annotations
- Set serviceAccount.iamRole to specify a custom IAM role ARN/name
- Set serviceAccount.imagePullSecrets to add image pull secrets
- Set serviceAccount.automountServiceAccountToken to control token mounting (default: true)
*/}}

{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "common.serviceAccountName" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: "email-service"
    {{- if .Values.serviceAccount.role }}
    # Add role label for RBAC binding based on section 0.1.3 roles
    app.kubernetes.io/role: {{ .Values.serviceAccount.role | quote }}
    {{- end }}
  annotations:
    # Add security annotations for all environments
    kubernetes.io/enforce-mountable-secrets: "true"
    
    {{- /* Add environment-specific annotations */}}
    {{- if eq .Values.global.environment "production" }}
    # Production-specific security annotations
    security.dollarfunding.com/environment: "production"
    security.dollarfunding.com/reviewed: "true"
    # JWT authentication parameters as specified in section 0.1.3
    security.dollarfunding.com/jwt-algorithm: "RS256"
    security.dollarfunding.com/token-expiry: "3600"
    security.dollarfunding.com/refresh-token-expiry: "604800"
    {{- else if eq .Values.global.environment "staging" }}
    # Staging-specific security annotations
    security.dollarfunding.com/environment: "staging"
    # JWT authentication parameters as specified in section 0.1.3
    security.dollarfunding.com/jwt-algorithm: "RS256"
    security.dollarfunding.com/token-expiry: "3600"
    security.dollarfunding.com/refresh-token-expiry: "604800"
    {{- else }}
    # Development-specific security annotations
    security.dollarfunding.com/environment: "development"
    # JWT authentication parameters as specified in section 0.1.3 (with longer expiry for development)
    security.dollarfunding.com/jwt-algorithm: "RS256"
    security.dollarfunding.com/token-expiry: "86400"
    security.dollarfunding.com/refresh-token-expiry: "604800"
    {{- end }}
    
    {{- /* Add Email Service specific annotations */}}
    # Email Service specific annotations for IMAP access
    email-service.dollarfunding.com/imap-enabled: "true"
    email-service.dollarfunding.com/imap-secure: "true"  # IMAPS (IMAP over TLS/SSL) mandatory as per section 3.8.3
    
    {{- /* Add cloud provider-specific IAM role annotations with least-privilege permissions */}}
    {{- /* as specified in section 3.8.2 (AWS Credentials Management) */}}
    {{- if .Values.global.cloudProvider }}
    {{- if eq .Values.global.cloudProvider "aws" }}
    # AWS IAM role annotation for EKS with Email Service specific permissions
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.iamRole | default (printf "arn:aws:iam::%s:role/email-service-%s-%s" .Values.global.awsAccountId .Release.Name .Release.Namespace) | quote }}
    # AWS SES permissions for email processing
    email-service.dollarfunding.com/ses-enabled: "true"
    # AWS S3 permissions for document storage
    email-service.dollarfunding.com/s3-enabled: "true"
    {{- else if eq .Values.global.cloudProvider "gcp" }}
    # GCP service account annotation for GKE with Email Service specific permissions
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.iamRole | default (printf "email-service-%s-%s@%s.iam.gserviceaccount.com" .Release.Name .Release.Namespace .Values.global.gcpProjectId) | quote }}
    # GCP Storage permissions for document storage
    email-service.dollarfunding.com/gcs-enabled: "true"
    {{- else if eq .Values.global.cloudProvider "azure" }}
    # Azure workload identity annotation for AKS with Email Service specific permissions
    azure.workload.identity/client-id: {{ .Values.serviceAccount.iamRole | default (printf "email-service-%s-%s" .Release.Name .Release.Namespace) | quote }}
    # Azure Blob Storage permissions for document storage
    email-service.dollarfunding.com/blob-storage-enabled: "true"
    {{- end }}
    {{- end }}
    
    # RabbitMQ permissions for message publishing
    email-service.dollarfunding.com/rabbitmq-enabled: "true"
    email-service.dollarfunding.com/rabbitmq-exchanges: "mca.documents"
    email-service.dollarfunding.com/rabbitmq-queues: "document-processing"
    
    {{- /* Add user-provided annotations last to allow overriding */}}
    {{- if .Values.serviceAccount.annotations }}
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
    {{- end }}
{{- if .Values.serviceAccount.imagePullSecrets }}
spec:
  # Image pull secrets for private container registries
  imagePullSecrets:
  {{- range .Values.serviceAccount.imagePullSecrets }}
    - name: {{ . }}
  {{- end }}
  # Control whether the service account token is automatically mounted
  # This should be true for Email Service as it needs to authenticate with the Kubernetes API
  # and other services using Kubernetes service account tokens
  automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken | default true }}
{{- else }}
spec:
  # Control whether the service account token is automatically mounted
  automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken | default true }}
{{- end }}
{{- end }}