{{- /*
ConfigMap template for Email Service

This template creates a Kubernetes ConfigMap for the Email Service, extending the common
configmap template with Email Service specific configuration. It includes IMAP server settings,
RabbitMQ connection details, S3 storage configuration, and application parameters.
*/}}

{{- template "common.configmap" . -}}

{{- define "email-service.config" -}}
config:
  data:
    # Application settings
    NODE_ENV: {{ .Values.global.environment | default .Values.environment | default "development" | quote }}
    APP_NAME: "mca-email-service"
    APP_PORT: {{ .Values.service.port | default 3000 | quote }}
    LOG_LEVEL: {{ .Values.logLevel | default "info" | quote }}
    POLLING_INTERVAL_MS: {{ .Values.pollingInterval | default 300000 | quote }}

    # IMAP server settings
    IMAP_HOST: {{ .Values.imap.host | quote }}
    IMAP_PORT: {{ .Values.imap.port | default 993 | quote }}
    IMAP_TLS_ENABLED: {{ .Values.imap.tlsEnabled | default true | quote }}
    IMAP_REJECT_UNAUTHORIZED: {{ .Values.imap.rejectUnauthorized | default true | quote }}
    IMAP_MAILBOX: {{ .Values.imap.mailbox | default "INBOX" | quote }}
    IMAP_SEARCH_FILTER: {{ .Values.imap.searchFilter | default "UNSEEN" | quote }}
    IMAP_MAX_CONNECTIONS: {{ .Values.imap.maxConnections | default 5 | quote }}
    IMAP_CONNECTION_TIMEOUT_MS: {{ .Values.imap.connectionTimeout | default 30000 | quote }}

    # RabbitMQ connection settings
    RABBITMQ_HOST: {{ .Values.rabbitmq.host | quote }}
    RABBITMQ_PORT: {{ .Values.rabbitmq.port | default 5672 | quote }}
    RABBITMQ_VHOST: {{ .Values.rabbitmq.vhost | default "/" | quote }}
    RABBITMQ_EXCHANGE: {{ .Values.rabbitmq.exchange | default "mca.documents" | quote }}
    RABBITMQ_EXCHANGE_TYPE: {{ .Values.rabbitmq.exchangeType | default "fanout" | quote }}
    RABBITMQ_ROUTING_KEY: {{ .Values.rabbitmq.routingKey | default "document.new" | quote }}
    RABBITMQ_CONNECTION_TIMEOUT_MS: {{ .Values.rabbitmq.connectionTimeout | default 30000 | quote }}
    RABBITMQ_HEARTBEAT_INTERVAL_SECONDS: {{ .Values.rabbitmq.heartbeatInterval | default 60 | quote }}
    RABBITMQ_RETRY_ATTEMPTS: {{ .Values.rabbitmq.retryAttempts | default 5 | quote }}
    RABBITMQ_RETRY_DELAY_MS: {{ .Values.rabbitmq.retryDelay | default 5000 | quote }}

    # S3 storage settings
    S3_ENDPOINT: {{ .Values.s3.endpoint | quote }}
    S3_REGION: {{ .Values.s3.region | default "us-east-1" | quote }}
    S3_BUCKET: {{ .Values.s3.bucket | quote }}
    S3_FORCE_PATH_STYLE: {{ .Values.s3.forcePathStyle | default false | quote }}
    S3_ENCRYPTION_ENABLED: {{ .Values.s3.encryptionEnabled | default true | quote }}
    S3_ENCRYPTION_TYPE: {{ .Values.s3.encryptionType | default "AES256" | quote }}

  # JSON configuration for document type validation
  json:
    "document-types.json":
      supportedTypes:
        - application/pdf
        - image/tiff
        - image/png
        - image/jpeg
      maxFileSizeMB: {{ .Values.documentValidation.maxFileSizeMB | default 25 }}
      virusScanEnabled: {{ .Values.documentValidation.virusScanEnabled | default true }}

  # YAML configuration for email filtering rules
  yaml:
    "email-filters.yaml":
      allowedSenders:
        domains:
          {{- range .Values.emailFilters.allowedDomains | default (list "dollarfunding.com") }}
          - {{ . }}
          {{- end }}
        addresses:
          {{- range .Values.emailFilters.allowedAddresses | default list }}
          - {{ . }}
          {{- end }}
      subjectPatterns:
        {{- range .Values.emailFilters.subjectPatterns | default (list "MCA Application") }}
        - {{ . }}
        {{- end }}
      processingRules:
        markAsRead: {{ .Values.emailFilters.markAsRead | default true }}
        moveProcessed: {{ .Values.emailFilters.moveProcessed | default true }}
        processedFolder: {{ .Values.emailFilters.processedFolder | default "Processed" }}

  # Environment variables for Node.js application
  env:
    NODE_ENV: {{ .Values.global.environment | default .Values.environment | default "development" }}
    NODE_OPTIONS: "--max-old-space-size={{ .Values.resources.limits.memory | default "512Mi" | trimSuffix "Mi" }}"
{{- end -}}

{{- define "email-service.configmap.env" -}}
{{- template "common.configmap.env" . -}}
{{- end -}}

{{- /* Set .Values.config to use email-service.config template */ -}}
{{- $_ := set .Values "config" (include "email-service.config" . | fromYaml) -}}