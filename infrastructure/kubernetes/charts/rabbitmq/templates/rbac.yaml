---
# ServiceAccount for RabbitMQ pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rabbitmq.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
  annotations:
    # Security scanning annotation to indicate this resource has been reviewed
    security.kubernetes.io/reviewed-by: "infrastructure-team"
    # Indicate that this ServiceAccount requires minimal permissions
    security.kubernetes.io/privileged: "false"
---
# Role with permissions for RabbitMQ pod discovery and clustering
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rabbitmq.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
  annotations:
    # Security scanning annotation to indicate this resource has been reviewed
    security.kubernetes.io/reviewed-by: "infrastructure-team"
    # Document the purpose of this role for security audits
    security.kubernetes.io/purpose: "RabbitMQ pod discovery for clustering"
rules:
  # Permissions required for RabbitMQ pod discovery and clustering
  - apiGroups: [""] # "" indicates the core API group
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  # Additional permissions for pod discovery if needed
  - apiGroups: [""] 
    resources: ["pods"]
    verbs: ["get", "list"]
---
# RoleBinding to bind the Role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rabbitmq.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
  annotations:
    # Security scanning annotation to indicate this resource has been reviewed
    security.kubernetes.io/reviewed-by: "infrastructure-team"
subjects:
  - kind: ServiceAccount
    name: {{ include "rabbitmq.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rabbitmq.fullname" . }}