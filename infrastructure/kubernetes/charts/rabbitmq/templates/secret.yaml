{{- /*
RabbitMQ Secret Template for MCA Application Processing System

This template creates a Kubernetes Secret containing sensitive RabbitMQ credentials:
- Administrator username and password
- Erlang cookie for cluster node authentication
- TLS certificates and private keys (if enabled)

The Secret is mounted into RabbitMQ pods to secure the message broker.
*/}}

{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  # Administrator username
  rabbitmq-username: {{ .Values.auth.username | b64enc | quote }}
  
  # Administrator password (auto-generated if not provided)
  rabbitmq-password: {{ include "rabbitmq.password" . | b64enc | quote }}
  
  # Erlang cookie for cluster node authentication (auto-generated if not provided)
  rabbitmq-erlang-cookie: {{ include "rabbitmq.erlangCookie" . | b64enc | quote }}
  
  {{- if and .Values.tls.enabled (not .Values.tls.existingSecret) }}
  # TLS certificates and private keys
  {{ .Values.tls.certFilename }}: {{ .Values.tls.cert | default "" | b64enc | quote }}
  {{ .Values.tls.keyFilename }}: {{ .Values.tls.key | default "" | b64enc | quote }}
  {{ .Values.tls.caFilename }}: {{ .Values.tls.ca | default "" | b64enc | quote }}
  {{- if .Values.tls.chainFilename }}
  {{ .Values.tls.chainFilename }}: {{ .Values.tls.chain | default "" | b64enc | quote }}
  {{- end }}
  {{- if .Values.tls.password }}
  tls-password: {{ .Values.tls.password | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}

{{- /*
Helper templates for generating secure passwords and cookies if not provided
*/}}

{{- define "rabbitmq.password" -}}
{{- if .Values.auth.password -}}
{{- .Values.auth.password -}}
{{- else -}}
{{- randAlphaNum 24 -}}
{{- end -}}
{{- end -}}

{{- define "rabbitmq.erlangCookie" -}}
{{- if .Values.auth.erlangCookie -}}
{{- .Values.auth.erlangCookie -}}
{{- else -}}
{{- randAlphaNum 32 -}}
{{- end -}}
{{- end -}}