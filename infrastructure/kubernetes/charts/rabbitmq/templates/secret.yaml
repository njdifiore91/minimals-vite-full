apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rabbitmq.fullname" . }}-credentials
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
    app.kubernetes.io/part-of: mca-system
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
    "helm.sh/resource-policy": "keep"
    "checksum/config": {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    # Security annotations
    security.kubernetes.io/critical-secret: "true"
    security.kubernetes.io/last-rotation-timestamp: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
type: Opaque
data:
  # Administrator credentials for RabbitMQ management UI and API
  # Required for secure authentication to the management interface and API
  rabbitmq-username: {{ .Values.auth.username | default "admin" | b64enc | quote }}
  rabbitmq-password: {{ .Values.auth.password | default (randAlphaNum 16) | b64enc | quote }}
  
  # Erlang cookie for cluster node authentication
  # This must be the same across all nodes in the cluster for secure inter-node communication
  # A minimum length of 32 characters is recommended for security
  erlang-cookie: {{ .Values.auth.erlangCookie | default (randAlphaNum 32) | b64enc | quote }}
  
  # TLS certificates and private keys for secure connections
  # These are used for both AMQP (port 5672) and management UI (port 15672) connections
  # TLS 1.3 is required as specified in the technical requirements
  tls.crt: {{ .Values.tls.cert | default "" | b64enc | quote }}
  tls.key: {{ .Values.tls.key | default "" | b64enc | quote }}
  ca.crt: {{ .Values.tls.ca | default "" | b64enc | quote }}
  
  # Client certificate for certificate-based authentication (optional)
  # Used for mutual TLS authentication between services and RabbitMQ
  # Required for the amqplib 0.10.3 integration with TLS enforcement
  client.crt: {{ .Values.tls.clientCert | default "" | b64enc | quote }}
  client.key: {{ .Values.tls.clientKey | default "" | b64enc | quote }}