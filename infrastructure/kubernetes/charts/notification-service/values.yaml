# Default values for notification-service Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Image configuration for the Notification Service
image:
  repository: dollarfunding/notification-service
  tag: latest
  pullPolicy: IfNotPresent

# Number of replicas to deploy
replicaCount: 2

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

# Service configuration
service:
  type: ClusterIP
  port: 3000
  annotations: {}

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext: {}

# Container security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

# Horizontal Pod Autoscaler configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Environment variables for the Notification Service
env:
  # General application settings
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  SERVICE_NAME: "notification-service"
  PORT: "3000"
  
  # RabbitMQ connection settings
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: "notification-service"
  RABBITMQ_VHOST: "/"
  RABBITMQ_EXCHANGE: "mca.documents"
  RABBITMQ_QUEUE: "notification"
  RABBITMQ_USE_TLS: "true"
  
  # Redis connection settings
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_USE_TLS: "true"
  REDIS_DATA_TTL: "900" # 15 minutes in seconds
  REDIS_SESSION_TTL: "86400" # 24 hours in seconds
  
  # Webhook delivery settings
  WEBHOOK_MAX_RETRIES: "5"
  WEBHOOK_INITIAL_RETRY_DELAY: "5000" # 5 seconds in milliseconds
  WEBHOOK_MAX_RETRY_DELAY: "3600000" # 1 hour in milliseconds
  WEBHOOK_TIMEOUT: "10000" # 10 seconds in milliseconds
  WEBHOOK_SIGNATURE_ALGORITHM: "sha256"

# Secret environment variables (to be stored in Kubernetes secrets)
secrets:
  RABBITMQ_PASSWORD: ""
  RABBITMQ_CLIENT_CERT: ""
  RABBITMQ_CLIENT_KEY: ""
  RABBITMQ_CA_CERT: ""
  REDIS_PASSWORD: ""
  REDIS_CA_CERT: ""
  WEBHOOK_SIGNATURE_SECRET: ""

# Liveness probe configuration
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe configuration
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Ingress configuration
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/strip-path: "true"
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
    konghq.com/plugins: |
      jwt-auth,rate-limiting,cors
  hosts:
    - host: api.dollarfunding.com
      paths:
        - path: /api/v1/webhooks
          pathType: Prefix
  tls:
    - secretName: api-tls
      hosts:
        - api.dollarfunding.com

# Environment-specific overrides
environments:
  # Development environment settings
  development:
    replicaCount: 1
    resources:
      limits:
        cpu: 300m
        memory: 384Mi
      requests:
        cpu: 100m
        memory: 128Mi
    autoscaling:
      enabled: false
    env:
      NODE_ENV: "development"
      LOG_LEVEL: "debug"
      RABBITMQ_USE_TLS: "false"
      REDIS_USE_TLS: "false"
      WEBHOOK_MAX_RETRIES: "3"
  
  # Staging environment settings
  staging:
    replicaCount: 2
    resources:
      limits:
        cpu: 400m
        memory: 448Mi
      requests:
        cpu: 150m
        memory: 192Mi
    env:
      LOG_LEVEL: "info"
      WEBHOOK_MAX_RETRIES: "4"
  
  # Production environment settings
  production:
    replicaCount: 3
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 256Mi
    autoscaling:
      minReplicas: 3
      maxReplicas: 15
      targetCPUUtilizationPercentage: 75
    env:
      LOG_LEVEL: "info"
      WEBHOOK_MAX_RETRIES: "5"