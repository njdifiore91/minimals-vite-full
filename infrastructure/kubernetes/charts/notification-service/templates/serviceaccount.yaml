{{- /*
ServiceAccount for Notification Service

This template creates a Kubernetes ServiceAccount specifically for the Notification Service,
providing identity for pods and enabling proper RBAC. It includes annotations for cloud provider
IAM integration and configures appropriate permissions for webhook delivery and message queue access.

The service account is used by the Notification Service pods to authenticate with the Kubernetes API
and to access other services like RabbitMQ and external webhook endpoints.

Parameters:
  - .Values.serviceAccount.create: Whether to create a service account (default: true)
  - .Values.serviceAccount.name: Name of the service account (default: "notification-service")
  - .Values.serviceAccount.annotations: Map of annotations to add to the service account
  - .Values.serviceAccount.automountServiceAccountToken: Whether to auto-mount the token (default: true)
  - .Values.global.provider: Cloud provider (aws, azure, gcp)
  - .Values.global.awsAccountId: AWS account ID for IAM role ARN
  - .Values.global.gcpProjectId: GCP project ID for service account email
*/ -}}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default "notification-service" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: webhook-service
    app.kubernetes.io/part-of: mca-application-system
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if eq (.Values.global.provider | default "") "aws" }}
    # AWS IAM role for webhook delivery permissions
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.iamRole | default (printf "arn:aws:iam::%s:role/%s-notification-service" .Values.global.awsAccountId .Release.Namespace) }}
    {{- end }}
    {{- if eq (.Values.global.provider | default "") "azure" }}
    # Azure Workload Identity for webhook delivery permissions
    azure.workload.identity/client-id: {{ .Values.serviceAccount.clientId | default (printf "%s-notification-service" .Release.Namespace) }}
    azure.workload.identity/tenant-id: {{ .Values.global.azureTenantId | default "" }}
    {{- end }}
    {{- if eq (.Values.global.provider | default "") "gcp" }}
    # GCP Service Account for webhook delivery permissions
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount | default (printf "%s-notification-service@%s.iam.gserviceaccount.com" .Release.Namespace .Values.global.gcpProjectId) }}
    {{- end }}
    # Notification service specific annotations
    notification.dollarfunding.com/webhook-enabled: "true"
    notification.dollarfunding.com/retry-enabled: {{ .Values.env.common.WEBHOOK_RETRY_ENABLED | default "true" | quote }}
{{- if hasKey .Values.serviceAccount "automountServiceAccountToken" }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- else }}
automountServiceAccountToken: true
{{- end }}
{{- with .Values.serviceAccount.imagePullSecrets }}
imagePullSecrets:
{{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}