{{- /*
serviceaccount.yaml for notification-service

This template creates a Kubernetes ServiceAccount specifically for the Notification Service.
It provides identity for pods and enables proper RBAC (Role-Based Access Control) for webhook delivery
and message queue access.

Features:
- Notification Service specific service account configuration
- Cloud provider IAM role annotations for webhook delivery permissions
- Specific annotations for RabbitMQ and webhook delivery access
- Consistent labeling using Helm helper functions
- Configurable automount of API token based on service needs

This implements the authentication/authorization considerations specified in section 0.1.3
and security architecture requirements for proper service identities.

Security Considerations:
- IAM roles with least-privilege permissions are applied to service accounts (section 3.8.2)
- Service-to-service communications enforce strict security measures (section 3.8.3)
- HMAC signature verification for webhook payloads (section 3.8.5)
- Webhook retry logic with exponential backoff (section 3.8.5)
- RabbitMQ security with TLS and client certificate authentication (section 3.8.4)

Usage:
- Set serviceAccount.create=true to create a service account (default: true)
- Set serviceAccount.name to override the default name
- Set serviceAccount.annotations to add custom annotations
- Set serviceAccount.iamRole to specify a custom IAM role ARN/name for webhook delivery
- Set serviceAccount.imagePullSecrets to add image pull secrets
- Set serviceAccount.automountServiceAccountToken to control token mounting (default: true)
*/}}

{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "common.serviceAccountName" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification-service
    {{- if .Values.serviceAccount.role }}
    # Add role label for RBAC binding based on section 0.1.3 roles
    # Two specific roles: Operations Staff and System Admin
    app.kubernetes.io/role: {{ .Values.serviceAccount.role | quote }}
    {{- end }}
  annotations:
    # Add security annotations for all environments
    kubernetes.io/enforce-mountable-secrets: "true"
    
    # Notification Service specific annotations
    notification.dollarfunding.com/webhook-enabled: "true"
    notification.dollarfunding.com/webhook-retry-enabled: "true"
    notification.dollarfunding.com/webhook-signature-algorithm: "sha256"
    
    {{- /* Add environment-specific annotations */}}
    {{- if eq .Values.global.environment "production" }}
    # Production-specific security annotations
    security.dollarfunding.com/environment: "production"
    security.dollarfunding.com/reviewed: "true"
    # JWT authentication parameters as specified in section 0.1.3
    security.dollarfunding.com/jwt-algorithm: "RS256"
    security.dollarfunding.com/token-expiry: "3600"
    security.dollarfunding.com/refresh-token-expiry: "604800"
    # Webhook delivery settings for production
    notification.dollarfunding.com/webhook-max-retries: "5"
    notification.dollarfunding.com/webhook-initial-retry-delay: "5000"
    notification.dollarfunding.com/webhook-max-retry-delay: "3600000"
    {{- else if eq .Values.global.environment "staging" }}
    # Staging-specific security annotations
    security.dollarfunding.com/environment: "staging"
    # JWT authentication parameters as specified in section 0.1.3
    security.dollarfunding.com/jwt-algorithm: "RS256"
    security.dollarfunding.com/token-expiry: "3600"
    security.dollarfunding.com/refresh-token-expiry: "604800"
    # Webhook delivery settings for staging
    notification.dollarfunding.com/webhook-max-retries: "4"
    notification.dollarfunding.com/webhook-initial-retry-delay: "5000"
    notification.dollarfunding.com/webhook-max-retry-delay: "3600000"
    {{- else }}
    # Development-specific security annotations
    security.dollarfunding.com/environment: "development"
    # JWT authentication parameters as specified in section 0.1.3 (with longer expiry for development)
    security.dollarfunding.com/jwt-algorithm: "RS256"
    security.dollarfunding.com/token-expiry: "86400"
    security.dollarfunding.com/refresh-token-expiry: "604800"
    # Webhook delivery settings for development
    notification.dollarfunding.com/webhook-max-retries: "3"
    notification.dollarfunding.com/webhook-initial-retry-delay: "5000"
    notification.dollarfunding.com/webhook-max-retry-delay: "60000"
    {{- end }}
    
    {{- /* Add cloud provider-specific IAM role annotations with least-privilege permissions */}}
    {{- /* as specified in section 3.8.2 (AWS Credentials Management) */}}
    {{- if .Values.global.cloudProvider }}
    {{- if eq .Values.global.cloudProvider "aws" }}
    # AWS IAM role annotation for EKS with specific permissions for webhook delivery
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.iamRole | default (printf "arn:aws:iam::%s:role/%s-notification-service" .Values.global.awsAccountId .Release.Namespace) | quote }}
    # AWS specific webhook delivery permissions
    notification.dollarfunding.com/aws-region: {{ .Values.global.awsRegion | default "us-east-1" | quote }}
    {{- else if eq .Values.global.cloudProvider "gcp" }}
    # GCP service account annotation for GKE with specific permissions for webhook delivery
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.iamRole | default (printf "notification-service-%s@%s.iam.gserviceaccount.com" .Release.Namespace .Values.global.gcpProjectId) | quote }}
    # GCP specific webhook delivery permissions
    notification.dollarfunding.com/gcp-project: {{ .Values.global.gcpProjectId | quote }}
    {{- else if eq .Values.global.cloudProvider "azure" }}
    # Azure workload identity annotation for AKS with specific permissions for webhook delivery
    azure.workload.identity/client-id: {{ .Values.serviceAccount.iamRole | default (printf "notification-service-%s" .Release.Namespace) | quote }}
    # Azure specific webhook delivery permissions
    notification.dollarfunding.com/azure-tenant: {{ .Values.global.azureTenantId | quote }}
    {{- end }}
    {{- end }}
    
    # RabbitMQ specific annotations for message queue access
    rabbitmq.dollarfunding.com/vhost: {{ .Values.env.RABBITMQ_VHOST | default "/" | quote }}
    rabbitmq.dollarfunding.com/exchange: {{ .Values.env.RABBITMQ_EXCHANGE | default "mca.documents" | quote }}
    rabbitmq.dollarfunding.com/queue: {{ .Values.env.RABBITMQ_QUEUE | default "notification" | quote }}
    rabbitmq.dollarfunding.com/use-tls: {{ .Values.env.RABBITMQ_USE_TLS | default "true" | quote }}
    
    # Redis specific annotations for caching
    redis.dollarfunding.com/use-tls: {{ .Values.env.REDIS_USE_TLS | default "true" | quote }}
    redis.dollarfunding.com/data-ttl: {{ .Values.env.REDIS_DATA_TTL | default "900" | quote }}
    redis.dollarfunding.com/session-ttl: {{ .Values.env.REDIS_SESSION_TTL | default "86400" | quote }}
    
    {{- /* Add user-provided annotations last to allow overriding */}}
    {{- if .Values.serviceAccount.annotations }}
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
    {{- end }}
{{- if .Values.serviceAccount.imagePullSecrets }}
spec:
  # Image pull secrets for private container registries
  imagePullSecrets:
  {{- range .Values.serviceAccount.imagePullSecrets }}
    - name: {{ . }}
  {{- end }}
  # Control whether the service account token is automatically mounted
  # This should be true for the notification service as it needs to authenticate with
  # the Kubernetes API for service discovery and with other services using JWT tokens
  automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken | default true }}
{{- else }}
spec:
  # Control whether the service account token is automatically mounted
  # This should be true for the notification service as it needs to authenticate with
  # the Kubernetes API for service discovery and with other services using JWT tokens
  automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken | default true }}
{{- end }}
{{- end }}