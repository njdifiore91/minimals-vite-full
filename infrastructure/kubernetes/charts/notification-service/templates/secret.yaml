# Kubernetes Secret for the Notification Service
# This secret contains all sensitive configuration data required by the Notification Service
# including API keys, authentication credentials, and encryption keys.
#
# The secret is created as a Helm pre-install/pre-upgrade hook to ensure
# it exists before the service is deployed.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notification-service.fullname" . }}
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
type: Opaque
data:
  # RabbitMQ authentication credentials
  # Used for connecting to the message queue for consuming notification events
  # and publishing webhook delivery status updates
  # As specified in section 0.1.4 - Service Communication Patterns
  RABBITMQ_USERNAME: {{ .Values.rabbitmq.auth.username | b64enc | quote }}
  RABBITMQ_PASSWORD: {{ .Values.rabbitmq.auth.password | b64enc | quote }}
  RABBITMQ_HOST: {{ .Values.rabbitmq.host | b64enc | quote }}
  RABBITMQ_PORT: {{ .Values.rabbitmq.port | toString | b64enc | quote }}
  RABBITMQ_VHOST: {{ .Values.rabbitmq.vhost | b64enc | quote }}
  
  # Webhook authentication and signing keys
  # Used for securing webhook payloads with HMAC signatures to ensure authenticity and integrity
  # Implements retry mechanism with exponential backoff for failed deliveries
  # As specified in section 4.1.10 - Notification & Webhook Delivery Flow
  WEBHOOK_SIGNING_SECRET: {{ .Values.webhook.signingSecret | b64enc | quote }}
  WEBHOOK_HMAC_ALGORITHM: {{ .Values.webhook.hmacAlgorithm | default "sha256" | b64enc | quote }}
  WEBHOOK_MAX_RETRIES: {{ .Values.webhook.maxRetries | default "5" | toString | b64enc | quote }}
  WEBHOOK_RETRY_DELAY_MS: {{ .Values.webhook.retryDelayMs | default "1000" | toString | b64enc | quote }}
  
  # JWT authentication parameters
  # Used for API security and verifying authentication tokens
  # As specified in section 0.1.3 - Authentication/Authorization Considerations
  # Algorithm: RS256, Token expiry: 60 minutes (3600 seconds)
  JWT_PUBLIC_KEY: {{ .Values.jwt.publicKey | b64enc | quote }}
  JWT_ALGORITHM: {{ .Values.jwt.algorithm | default "RS256" | b64enc | quote }}
  JWT_TOKEN_EXPIRY: {{ .Values.jwt.tokenExpiry | default "3600" | toString | b64enc | quote }}
  
  # Encryption keys for secure payload delivery
  # Used for encrypting sensitive data in webhook payloads
  # Implements AES-256 encryption as specified in section 0.2.6 - Security Considerations
  ENCRYPTION_KEY: {{ .Values.encryption.key | b64enc | quote }}
  ENCRYPTION_IV: {{ .Values.encryption.iv | b64enc | quote }}
  ENCRYPTION_ALGORITHM: {{ .Values.encryption.algorithm | default "aes-256-cbc" | b64enc | quote }}
  
  # External service API keys
  # Used for integrating with third-party notification delivery services
  # As specified in section 4.1.10 - Notification & Webhook Delivery Flow
  # These services include email, SMS, and push notification providers
  
  # Email service credentials (conditional inclusion based on values file)
  {{- if .Values.externalServices.email }}
  EMAIL_API_KEY: {{ .Values.externalServices.email.apiKey | b64enc | quote }}
  EMAIL_API_SECRET: {{ .Values.externalServices.email.apiSecret | b64enc | quote }}
  EMAIL_FROM_ADDRESS: {{ .Values.externalServices.email.fromAddress | b64enc | quote }}
  {{- end }}
  
  # SMS service credentials (conditional inclusion based on values file)
  {{- if .Values.externalServices.sms }}
  SMS_API_KEY: {{ .Values.externalServices.sms.apiKey | b64enc | quote }}
  SMS_API_SECRET: {{ .Values.externalServices.sms.apiSecret | b64enc | quote }}
  SMS_FROM_NUMBER: {{ .Values.externalServices.sms.fromNumber | b64enc | quote }}
  {{- end }}
  
  # Push notification service credentials (conditional inclusion based on values file)
  {{- if .Values.externalServices.push }}
  PUSH_API_KEY: {{ .Values.externalServices.push.apiKey | b64enc | quote }}
  PUSH_PROJECT_ID: {{ .Values.externalServices.push.projectId | b64enc | quote }}
  {{- end }}
  
  # Redis connection for rate limiting and caching
  # Used for storing webhook delivery status, rate limiting, and caching
  # As specified in section 0.2.3 - Redis 7.0 cluster for caching
  # TTL settings: Application data: 15 minutes, User sessions: 24 hours
  REDIS_HOST: {{ .Values.redis.host | b64enc | quote }}
  REDIS_PORT: {{ .Values.redis.port | toString | b64enc | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | b64enc | quote }}
  
  # Application specific settings
  # Environment configuration for the Node.js Notification Service
  # As specified in section 8.5.4 - Config Management with environment variables
  # and section 0.2.5 - Monitoring and Logging Considerations
  NODE_ENV: {{ .Values.app.nodeEnv | default "production" | b64enc | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | default "info" | b64enc | quote }}
  PORT: {{ .Values.app.port | default "3000" | toString | b64enc | quote }}
  
  # Security-related configuration
  # Additional security settings for the Notification Service
  # As specified in section 0.2.6 - Security Considerations
  CORS_ALLOWED_ORIGINS: {{ .Values.security.corsAllowedOrigins | default "*" | b64enc | quote }}
  RATE_LIMIT_WINDOW_MS: {{ .Values.security.rateLimit.windowMs | default "60000" | toString | b64enc | quote }}
  RATE_LIMIT_MAX_REQUESTS: {{ .Values.security.rateLimit.maxRequests | default "100" | toString | b64enc | quote }}
  WEBHOOK_TIMEOUT_MS: {{ .Values.webhook.timeoutMs | default "5000" | toString | b64enc | quote }}