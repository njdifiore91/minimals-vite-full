{{- /*
ServiceAccount template for Document Service.

This template extends the common serviceaccount template with Document Service specific
configurations, including annotations for cloud provider IAM integration. The Document Service
requires access to S3-compatible storage for document storage and RabbitMQ for message processing.

Parameters:
  - .Values.serviceAccount.create: Whether to create a service account (default: true)
  - .Values.serviceAccount.name: Name of the service account (default: release name)
  - .Values.serviceAccount.annotations: Map of annotations to add to the service account
  - .Values.serviceAccount.automountServiceAccountToken: Whether to auto-mount the token (default: true)
  - .Values.serviceAccount.imagePullSecrets: List of image pull secrets to add
  - .Values.global.provider: Cloud provider (aws, azure, gcp)
  - .Values.global.awsAccountId: AWS account ID for IAM role ARN
  - .Values.global.gcpProjectId: GCP project ID for service account email
  - .Values.serviceAccount.s3AccessRole: Role ARN for S3 access (AWS-specific)
  - .Values.serviceAccount.rabbitmqAccessRole: Role ARN for RabbitMQ access (AWS-specific)
*/ -}}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "common.serviceAccountName" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: document-service
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if eq (.Values.global.provider | default "") "aws" }}
    # Main IAM role for the service account
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.iamRole | default (printf "arn:aws:iam::%s:role/%s-%s" .Values.global.awsAccountId .Release.Namespace .Release.Name) }}
    
    # S3 access role for document storage with AES-256 encryption as specified in section 3.8.2
    {{- if .Values.serviceAccount.s3AccessRole }}
    eks.amazonaws.com/s3-access-role: {{ .Values.serviceAccount.s3AccessRole }}
    {{- end }}
    
    # RabbitMQ access role for message processing as specified in section 3.8.4
    {{- if .Values.serviceAccount.rabbitmqAccessRole }}
    eks.amazonaws.com/rabbitmq-access-role: {{ .Values.serviceAccount.rabbitmqAccessRole }}
    {{- end }}
    {{- end }}
    
    {{- if eq (.Values.global.provider | default "") "azure" }}
    # Azure Workload Identity for the service account
    azure.workload.identity/client-id: {{ .Values.serviceAccount.clientId | default (printf "%s-%s" .Release.Namespace .Release.Name) }}
    
    # Azure Storage access for document storage
    {{- if .Values.serviceAccount.storageAccountName }}
    azure.workload.identity/storage-account: {{ .Values.serviceAccount.storageAccountName }}
    {{- end }}
    
    # Azure Service Bus access for message processing
    {{- if .Values.serviceAccount.serviceBusNamespace }}
    azure.workload.identity/servicebus-namespace: {{ .Values.serviceAccount.serviceBusNamespace }}
    {{- end }}
    {{- end }}
    
    {{- if eq (.Values.global.provider | default "") "gcp" }}
    # GCP Service Account for the service account
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount | default (printf "%s-%s@%s.iam.gserviceaccount.com" .Release.Namespace .Release.Name .Values.global.gcpProjectId) }}
    
    # GCS access for document storage
    {{- if .Values.serviceAccount.gcsAccessRole }}
    iam.gke.io/gcs-access-role: {{ .Values.serviceAccount.gcsAccessRole }}
    {{- end }}
    
    # GCP Pub/Sub access for message processing
    {{- if .Values.serviceAccount.pubsubAccessRole }}
    iam.gke.io/pubsub-access-role: {{ .Values.serviceAccount.pubsubAccessRole }}
    {{- end }}
    {{- end }}
    
    # Add Document Service specific annotations
    document-service/document-classification: "enabled"
    document-service/scikit-learn-version: "1.3.0"
    document-service/requires-gpu: "false"
    
    # Security annotations as specified in section 3.8
    security.dollarfunding.com/least-privilege: "true"
    security.dollarfunding.com/tls-required: "true"
    security.dollarfunding.com/s3-encryption: "AES-256"
    security.dollarfunding.com/message-encryption: "enabled"
spec:
  {{- if hasKey .Values.serviceAccount "automountServiceAccountToken" }}
  # Control whether the service account token is automatically mounted
  automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
  {{- end }}
  {{- with .Values.serviceAccount.imagePullSecrets }}
  # Image pull secrets for private container registries
  imagePullSecrets:
  {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}