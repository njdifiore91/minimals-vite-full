{{- /*
ServiceAccount template for Document Service in the MCA Application Processing System.

This template extends the common serviceaccount template with Document Service specific
configurations, including annotations for cloud provider IAM integration. The Document Service
requires permissions to access RabbitMQ for messaging and S3 for document storage.

Security considerations:
- Implements least-privilege permissions for accessing required resources
- Configures proper IAM role integration for secure cloud provider access
- Follows security best practices as specified in section 3.8
*/ -}}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "common.serviceAccountName" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: document-service
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if eq (.Values.global.provider | default "") "aws" }}
    # AWS IAM role for document-service with permissions for S3 and RabbitMQ access
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.iamRole | default (printf "arn:aws:iam::%s:role/%s-document-service" .Values.global.awsAccountId .Release.Namespace) }}
    {{- end }}
    {{- if eq (.Values.global.provider | default "") "azure" }}
    # Azure Workload Identity for document-service
    azure.workload.identity/client-id: {{ .Values.serviceAccount.clientId | default (printf "%s-document-service" .Release.Namespace) }}
    {{- end }}
    {{- if eq (.Values.global.provider | default "") "gcp" }}
    # GCP Service Account for document-service
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount | default (printf "%s-document-service@%s.iam.gserviceaccount.com" .Release.Namespace .Values.global.gcpProjectId) }}
    {{- end }}
    # Document Service requires access to RabbitMQ and S3 storage
    mca.dollarfunding.com/requires-rabbitmq: "true"
    mca.dollarfunding.com/requires-s3: "true"
    # Security annotations
    mca.dollarfunding.com/security-level: "restricted"
    mca.dollarfunding.com/data-classification: "sensitive"
{{- if hasKey .Values.serviceAccount "automountServiceAccountToken" }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- else }}
# Explicitly set automountServiceAccountToken to true as Document Service needs to access the Kubernetes API
automountServiceAccountToken: true
{{- end }}
{{- with .Values.serviceAccount.imagePullSecrets }}
imagePullSecrets:
{{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}