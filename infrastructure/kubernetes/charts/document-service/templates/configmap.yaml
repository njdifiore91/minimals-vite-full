apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: document-service
data:
  # RabbitMQ connection settings
  RABBITMQ_HOST: {{ .Values.rabbitmq.host | quote }}
  RABBITMQ_PORT: {{ .Values.rabbitmq.port | quote }}
  RABBITMQ_EXCHANGE: {{ .Values.rabbitmq.exchange | quote }}
  RABBITMQ_QUEUE: {{ .Values.rabbitmq.queue | quote }}
  RABBITMQ_ROUTING_KEY: {{ .Values.rabbitmq.routingKey | quote }}
  
  # S3 storage configuration
  S3_ENDPOINT: {{ .Values.storage.endpoint | quote }}
  S3_BUCKET: {{ .Values.storage.bucket | quote }}
  S3_REGION: {{ .Values.storage.region | quote }}
  S3_USE_SSL: {{ .Values.storage.useSsl | quote }}
  
  # Document classification model parameters
  MODEL_TYPE: {{ .Values.model.type | quote }}
  MODEL_CONFIDENCE_THRESHOLD: {{ .Values.model.confidenceThreshold | quote }}
  MODEL_PATH: {{ .Values.model.path | quote }}
  
  # Application settings
  LOG_LEVEL: {{ .Values.application.logLevel | quote }}
  PROCESSING_BATCH_SIZE: {{ .Values.application.processingBatchSize | quote }}
  WORKER_THREADS: {{ .Values.application.workerThreads | quote }}
  
  # API configuration
  API_PORT: {{ .Values.api.port | quote }}
  API_PREFIX: {{ .Values.api.prefix | quote }}
  
  # Document classification categories
  DOCUMENT_CATEGORIES: |
    {{- .Values.documentCategories | toYaml | nindent 4 }}
  
  # Python-specific settings
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  
  # Health check configuration
  HEALTH_CHECK_PORT: {{ .Values.healthCheck.port | quote }}
  HEALTH_CHECK_PATH: {{ .Values.healthCheck.path | quote }}