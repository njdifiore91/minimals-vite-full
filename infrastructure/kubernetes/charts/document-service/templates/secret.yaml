{{- /*
Document Service Secret template for MCA Application Processing System.

This template extends the common secret template with Document Service specific
sensitive configuration data, including RabbitMQ authentication and S3 access keys.
It ensures that sensitive configuration is securely stored and accessible to the
Document Service for secure document classification operations.

Features:
- RabbitMQ authentication credentials for message processing
- S3 access keys for secure document storage access
- AES-256 encryption for sensitive data
- Field-level encryption for PII data

Usage:
```yaml
# values.yaml
secrets:
  - name: document-service-secrets
    type: Opaque
    serviceType: document-service
    annotations:
      version: "1.0.0"
    data:
      RABBITMQ_USERNAME: "document-service"
      RABBITMQ_PASSWORD: "strong-password"
      S3_ACCESS_KEY: "your-s3-access-key"
      S3_SECRET_KEY: "your-s3-secret-key"
      ENCRYPTION_KEY: "your-aes-256-encryption-key"
```
*/ -}}

{{- /* Define Document Service specific secrets */ -}}
{{- $secretValues := dict -}}
{{- if not .Values.secrets -}}
  {{- $secretValues = dict "secrets" (list) -}}
{{- else -}}
  {{- $secretValues = dict "secrets" .Values.secrets -}}
{{- end -}}

{{- /* Add Document Service specific secret if not already defined */ -}}
{{- $hasDocumentServiceSecret := false -}}
{{- range .Values.secrets -}}
  {{- if eq .name "document-service-secrets" -}}
    {{- $hasDocumentServiceSecret = true -}}
  {{- end -}}
{{- end -}}

{{- if not $hasDocumentServiceSecret -}}
  {{- $documentServiceSecret := dict 
    "name" "document-service-secrets" 
    "type" "Opaque" 
    "serviceType" "document-service" 
    "annotations" (dict "version" "1.0.0") 
    "data" (dict) -}}
  
  {{- /* Add RabbitMQ credentials */ -}}
  {{- if .Values.rabbitmq -}}
    {{- $_ := set $documentServiceSecret.data "RABBITMQ_HOST" (default (printf "%s-rabbitmq" .Release.Name) .Values.rabbitmq.host) -}}
    {{- $_ := set $documentServiceSecret.data "RABBITMQ_PORT" (default "5672" .Values.rabbitmq.port) -}}
    {{- $_ := set $documentServiceSecret.data "RABBITMQ_USERNAME" (default "document-service" .Values.rabbitmq.username) -}}
    {{- $_ := set $documentServiceSecret.data "RABBITMQ_PASSWORD" (default (randAlphaNum 16) .Values.rabbitmq.password) -}}
    {{- $_ := set $documentServiceSecret.data "RABBITMQ_VHOST" (default "/" .Values.rabbitmq.vhost) -}}
    
    {{- /* Add exchange and queue configuration */ -}}
    {{- $_ := set $documentServiceSecret.data "RABBITMQ_EXCHANGE" (default "mca.documents" .Values.rabbitmq.exchange) -}}
    {{- $_ := set $documentServiceSecret.data "RABBITMQ_QUEUE_DOCUMENT_PROCESSING" (default "document-processing" .Values.rabbitmq.queues.documentProcessing) -}}
    {{- $_ := set $documentServiceSecret.data "RABBITMQ_QUEUE_DATA_EXTRACTION" (default "data-extraction" .Values.rabbitmq.queues.dataExtraction) -}}
  {{- end -}}
  
  {{- /* Add S3 storage credentials */ -}}
  {{- if .Values.s3 -}}
    {{- $_ := set $documentServiceSecret.data "S3_ENDPOINT" (default "s3.amazonaws.com" .Values.s3.endpoint) -}}
    {{- $_ := set $documentServiceSecret.data "S3_REGION" (default "us-east-1" .Values.s3.region) -}}
    {{- $_ := set $documentServiceSecret.data "S3_ACCESS_KEY" (default "" .Values.s3.accessKey) -}}
    {{- $_ := set $documentServiceSecret.data "S3_SECRET_KEY" (default "" .Values.s3.secretKey) -}}
    
    {{- /* Set bucket name based on environment */ -}}
    {{- if .Values.global -}}
      {{- if eq .Values.global.environment "production" -}}
        {{- $_ := set $documentServiceSecret.data "S3_BUCKET_NAME" (default "mca-documents-production" .Values.s3.bucketName) -}}
      {{- else if eq .Values.global.environment "staging" -}}
        {{- $_ := set $documentServiceSecret.data "S3_BUCKET_NAME" (default "mca-documents-staging" .Values.s3.bucketName) -}}
      {{- else -}}
        {{- $_ := set $documentServiceSecret.data "S3_BUCKET_NAME" (default "mca-documents-development" .Values.s3.bucketName) -}}
      {{- end -}}
    {{- else -}}
      {{- $_ := set $documentServiceSecret.data "S3_BUCKET_NAME" (default "mca-documents" .Values.s3.bucketName) -}}
    {{- end -}}
    
    {{- /* Add encryption settings */ -}}
    {{- $_ := set $documentServiceSecret.data "S3_USE_SSL" (default "true" .Values.s3.useSsl) -}}
    {{- $_ := set $documentServiceSecret.data "S3_ENCRYPTION" (default "AES256" .Values.s3.encryption) -}}
  {{- end -}}
  
  {{- /* Add encryption key for field-level encryption */ -}}
  {{- if .Values.encryption -}}
    {{- $_ := set $documentServiceSecret.data "ENCRYPTION_KEY" (default (randAlphaNum 32) .Values.encryption.key) -}}
  {{- else -}}
    {{- $_ := set $documentServiceSecret.data "ENCRYPTION_KEY" (randAlphaNum 32) -}}
  {{- end -}}
  
  {{- /* Add document classification settings */ -}}
  {{- if .Values.classification -}}
    {{- $_ := set $documentServiceSecret.data "MODEL_ENCRYPTION_KEY" (default (randAlphaNum 32) .Values.classification.modelEncryptionKey) -}}
  {{- else -}}
    {{- $_ := set $documentServiceSecret.data "MODEL_ENCRYPTION_KEY" (randAlphaNum 32) -}}
  {{- end -}}
  
  {{- $newSecrets := append $secretValues.secrets $documentServiceSecret -}}
  {{- $_ := set $secretValues "secrets" $newSecrets -}}
{{- end -}}

{{- /* Enable generation of common secrets */ -}}
{{- $_ := set . "Values" (merge .Values $secretValues) -}}
{{- $_ := set .Values "generateRabbitMQSecrets" true -}}
{{- $_ := set .Values "generateS3Secrets" true -}}

{{- /* Include the common secret template */ -}}
{{- include "common.secret" . -}}