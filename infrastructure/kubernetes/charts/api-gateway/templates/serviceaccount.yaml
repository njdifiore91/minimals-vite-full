{{- /*
serviceaccount.yaml

This template creates a Kubernetes ServiceAccount for the Kong API Gateway.
It provides identity for Kong pods to interact with the Kubernetes API and other services.

Features:
- Configurable service account name with defaults based on release name
- Support for cloud provider IAM role annotations (AWS, GCP, Azure)
- Optional image pull secrets for private registries
- Consistent labeling using Helm helper functions
- Configurable automount of API token based on security requirements

This implements the authentication/authorization considerations specified in section 0.1.3
and security architecture requirements for proper service identities.

Security Considerations:
- IAM roles with least-privilege permissions are applied to service account
- JWT authentication with RS256 algorithm is used as specified in section 0.1.3
- Token expiry set to 60 minutes as specified in section 0.1.3
- Refresh token expiry set to 7 days as specified in section 0.1.3

Usage:
- Set serviceAccount.create=true to create a service account (default: true)
- Set serviceAccount.name to override the default name
- Set serviceAccount.annotations to add custom annotations
- Set serviceAccount.iamRole to specify a custom IAM role ARN/name
- Set serviceAccount.imagePullSecrets to add image pull secrets
- Set serviceAccount.automountServiceAccountToken to control token mounting (default: true)
*/}}

{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kong.serviceAccountName" . }}
  labels:
    {{- include "kong.labels" . | nindent 4 }}
    app.kubernetes.io/component: "api-gateway"
    app.kubernetes.io/part-of: "mca-application-system"
  annotations:
    # Add security annotations for all environments
    kubernetes.io/enforce-mountable-secrets: "true"
    
    {{- /* Add environment-specific annotations */}}
    {{- if eq .Values.global.environment "production" }}
    # Production-specific security annotations
    security.dollarfunding.com/environment: "production"
    security.dollarfunding.com/reviewed: "true"
    # JWT authentication parameters as specified in section 0.1.3
    security.dollarfunding.com/jwt-algorithm: "RS256"
    security.dollarfunding.com/token-expiry: "3600"
    security.dollarfunding.com/refresh-token-expiry: "604800"
    {{- else if eq .Values.global.environment "staging" }}
    # Staging-specific security annotations
    security.dollarfunding.com/environment: "staging"
    # JWT authentication parameters as specified in section 0.1.3
    security.dollarfunding.com/jwt-algorithm: "RS256"
    security.dollarfunding.com/token-expiry: "3600"
    security.dollarfunding.com/refresh-token-expiry: "604800"
    {{- else }}
    # Development-specific security annotations
    security.dollarfunding.com/environment: "development"
    # JWT authentication parameters as specified in section 0.1.3 (with longer expiry for development)
    security.dollarfunding.com/jwt-algorithm: "RS256"
    security.dollarfunding.com/token-expiry: "3600"
    security.dollarfunding.com/refresh-token-expiry: "604800"
    {{- end }}
    
    {{- /* Add Kong-specific annotations */}}
    kong.dollarfunding.com/version: "3.5.0"
    kong.dollarfunding.com/gateway-type: "api-gateway"
    
    {{- /* Add cloud provider-specific IAM role annotations */}}
    {{- if .Values.global.cloudProvider }}
    {{- if eq .Values.global.cloudProvider "aws" }}
    # AWS IAM role annotation for EKS
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.iamRole | default (printf "arn:aws:iam::%s:role/kong-api-gateway-%s" .Values.global.awsAccountId .Release.Namespace) | quote }}
    {{- else if eq .Values.global.cloudProvider "gcp" }}
    # GCP service account annotation for GKE
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.iamRole | default (printf "kong-api-gateway-%s@%s.iam.gserviceaccount.com" .Release.Namespace .Values.global.gcpProjectId) | quote }}
    {{- else if eq .Values.global.cloudProvider "azure" }}
    # Azure workload identity annotation for AKS
    azure.workload.identity/client-id: {{ .Values.serviceAccount.iamRole | default (printf "kong-api-gateway-%s" .Release.Namespace) | quote }}
    {{- end }}
    {{- end }}
    
    {{- /* Add user-provided annotations last to allow overriding */}}
    {{- if .Values.serviceAccount.annotations }}
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.serviceAccount.imagePullSecrets }}
  # Image pull secrets for private container registries
  imagePullSecrets:
  {{- range .Values.serviceAccount.imagePullSecrets }}
    - name: {{ . }}
  {{- end }}
  {{- end }}
  # Control whether the service account token is automatically mounted
  # For Kong API Gateway, this should be true as it needs to interact with the Kubernetes API
  # for service discovery and other operations
  automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken | default true }}
{{- end }}