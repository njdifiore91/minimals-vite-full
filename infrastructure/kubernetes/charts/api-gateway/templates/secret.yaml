apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api-gateway.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
  annotations:
    # Helm annotations
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/resource-policy": keep
    # Security annotations
    "kubernetes.io/description": "Contains sensitive credentials for Kong API Gateway including JWT keys, TLS certificates, and API keys"
    "security.dollarfunding.com/sensitive": "true"
    "security.dollarfunding.com/rotation-schedule": "90d"
    "security.dollarfunding.com/last-rotated": "{{ now | date "2006-01-02" }}"
    "security.dollarfunding.com/encryption": "required"
    "security.dollarfunding.com/owner": "security-team"
    "security.dollarfunding.com/access-restricted": "true"
type: Opaque
# Enable encryption at rest for this Secret
{{- if .Values.security.enableEncryption }}
immutable: {{ .Values.security.immutableSecrets | default true }}
{{- end }}
data:
  # JWT Authentication Keys (RS256)
  # Token expiry: 60 minutes, Refresh token: 7 days
  {{- if .Values.jwt.privateKey }}
  jwt-private-key: {{ .Values.jwt.privateKey | b64enc }}
  {{- else }}
  jwt-private-key: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
  {{- if .Values.jwt.publicKey }}
  jwt-public-key: {{ .Values.jwt.publicKey | b64enc }}
  {{- else }}
  jwt-public-key: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
  jwt-config: {{ include "api-gateway.jwtConfig" . | b64enc }}
  
  # TLS Certificates for HTTPS (TLS 1.3 with strong cipher suites)
  {{- if and .Values.tls.enabled .Values.tls.cert .Values.tls.key }}
  tls.crt: {{ .Values.tls.cert | b64enc }}
  tls.key: {{ .Values.tls.key | b64enc }}
  {{- if .Values.tls.ca }}
  tls.ca: {{ .Values.tls.ca | b64enc }}
  {{- end }}
  tls-config: {{ include "api-gateway.tlsConfig" . | b64enc }}
  {{- end }}
  
  # Redis credentials for rate limiting with TLS and ACLs
  {{- if .Values.redis.password }}
  redis-password: {{ .Values.redis.password | b64enc }}
  {{- else if .Values.redis.existingSecret }}
  # Redis password will be obtained from existing secret
  {{- else }}
  redis-password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
  redis-config: {{ include "api-gateway.redisConfig" . | b64enc }}
  
  # API keys for external service integrations
  {{- if .Values.apiKeys.dataService }}
  data-service-api-key: {{ .Values.apiKeys.dataService | b64enc }}
  {{- else }}
  data-service-api-key: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
  
  {{- if .Values.apiKeys.notificationService }}
  notification-service-api-key: {{ .Values.apiKeys.notificationService | b64enc }}
  {{- else }}
  notification-service-api-key: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
  
  {{- if .Values.apiKeys.ocrService }}
  ocr-service-api-key: {{ .Values.apiKeys.ocrService | b64enc }}
  {{- else }}
  ocr-service-api-key: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
  
  {{- if .Values.apiKeys.documentService }}
  document-service-api-key: {{ .Values.apiKeys.documentService | b64enc }}
  {{- else }}
  document-service-api-key: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
  
  {{- if .Values.apiKeys.emailService }}
  email-service-api-key: {{ .Values.apiKeys.emailService | b64enc }}
  {{- else }}
  email-service-api-key: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
  
  # HMAC secret keys for webhook signature verification
  {{- if .Values.webhook.hmacSecret }}
  webhook-hmac-secret: {{ .Values.webhook.hmacSecret | b64enc }}
  {{- else }}
  webhook-hmac-secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
  
  # IP filtering and allowlists for administrative endpoints
  {{- if .Values.security.ipAllowlist }}
  ip-allowlist: {{ .Values.security.ipAllowlist | toJson | b64enc }}
  {{- else }}
  ip-allowlist: {{ list "127.0.0.1" "::1" | toJson | b64enc }}
  {{- end }}
  
  # Rate limiting configuration
  rate-limit-config: {{ include "api-gateway.rateLimitConfig" . | b64enc }}