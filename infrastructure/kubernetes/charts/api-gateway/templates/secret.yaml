{{- /*
Secret template for Kong API Gateway sensitive data
This template creates a Kubernetes Secret that stores sensitive information such as:
- JWT public and private keys (RS256 algorithm with 60-minute token expiry)
- TLS certificates and keys for HTTPS
- API keys for external service integrations
- Redis password for rate limiting
*/}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api-gateway.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- /* JWT Authentication Keys */}}
  {{- if .Values.jwt.enabled }}
  # RS256 JWT keys for authentication as specified in section 0.1.3
  # Token expiry set to 60 minutes as per requirements
  {{- if .Values.jwt.existingSecret }}
  {{- /* Use existing secret for JWT keys */}}
  {{- else }}
  {{- /* Generate or use provided JWT keys */}}
  {{- if .Values.jwt.privateKey }}
  jwt.private.key: {{ .Values.jwt.privateKey | b64enc }}
  {{- else }}
  jwt.private.key: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
  {{- if .Values.jwt.publicKey }}
  jwt.public.key: {{ .Values.jwt.publicKey | b64enc }}
  {{- else }}
  jwt.public.key: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
  # JWT configuration for RS256 algorithm and 60-minute expiry
  jwt.config: {{ (dict "algorithm" "RS256" "token_expiry_minutes" 60 "refresh_token_expiry_days" 7) | toJson | b64enc }}
  {{- end }}
  {{- end }}

  {{- /* TLS Certificates for HTTPS connections */}}
  {{- if .Values.tls.enabled }}
  {{- if .Values.tls.existingSecret }}
  {{- /* Use existing secret for TLS certificates */}}
  {{- else }}
  {{- /* Use provided TLS certificates */}}
  {{- if .Values.tls.cert }}
  tls.crt: {{ .Values.tls.cert | b64enc }}
  {{- end }}
  {{- if .Values.tls.key }}
  tls.key: {{ .Values.tls.key | b64enc }}
  {{- end }}
  {{- if .Values.tls.caCert }}
  ca.crt: {{ .Values.tls.caCert | b64enc }}
  {{- end }}
  {{- /* TLS configuration for cipher suites and protocols */}}
  tls.config: {{ (dict "ssl_ciphers" "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305" "ssl_protocols" "TLSv1.2 TLSv1.3") | toJson | b64enc }}
  {{- end }}
  {{- end }}

  {{- /* API Keys for External Service Integrations */}}
  {{- if .Values.apiKeys }}
  {{- range $name, $key := .Values.apiKeys }}
  {{ $name }}: {{ $key | b64enc }}
  {{- end }}
  {{- else }}
  # Default API key for document service integration
  document.service.api.key: {{ randAlphaNum 32 | b64enc }}
  # Default API key for OCR service integration
  ocr.service.api.key: {{ randAlphaNum 32 | b64enc }}
  # Default API key for data service integration
  data.service.api.key: {{ randAlphaNum 32 | b64enc }}
  {{- end }}

  {{- /* Redis Password for Rate Limiting */}}
  {{- if .Values.redis.enabled }}
  {{- if .Values.redis.existingSecret }}
  {{- /* Use existing secret for Redis password */}}
  {{- else }}
  {{- if .Values.redis.password }}
  redis.password: {{ .Values.redis.password | b64enc }}
  {{- else }}
  redis.password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
  # Redis configuration for rate limiting
  redis.config: {{ (dict "host" (default "redis" .Values.redis.host) "port" (default 6379 .Values.redis.port) "database" (default 0 .Values.redis.database) "timeout" 2000) | toJson | b64enc }}
  {{- end }}
  {{- end }}

  {{- /* CORS Configuration */}}
  cors.config: {{ (dict "allowed_origins" (default (list "*") .Values.cors.allowedOrigins) "allowed_methods" (default (list "GET" "POST" "PUT" "DELETE" "OPTIONS" "PATCH") .Values.cors.allowedMethods) "allowed_headers" (default (list "Authorization" "Content-Type" "Accept") .Values.cors.allowedHeaders) "exposed_headers" (default (list "Content-Length" "Content-Type") .Values.cors.exposedHeaders) "max_age" (default 3600 .Values.cors.maxAge)) | toJson | b64enc }}

  {{- /* Rate Limiting Configuration */}}
  rate.limiting.config: {{ (dict "authenticated_per_minute" (default 60 .Values.rateLimiting.authenticatedPerMinute) "unauthenticated_per_minute" (default 10 .Values.rateLimiting.unauthenticatedPerMinute)) | toJson | b64enc }}

  {{- /* Additional Configuration */}}
  {{- if .Values.extraSecrets }}
  {{- range $key, $value := .Values.extraSecrets }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
  {{- end }}