{{- /*
Deployment for Kong API Gateway.

This Deployment manages the Kong API Gateway pods with the following features:
- Kong API Gateway version 3.5.0 as specified in the technical spec
- Resource requests and limits for production-grade deployment
- Readiness and liveness probes for health monitoring
- Environment variables from ConfigMap and Secrets
- Volume mounts for Kong configuration and JWT keys
- Annotations for Prometheus metrics scraping
- Pod security context with non-root user
- JWT authentication using RS256 algorithm
- Proper container security settings
*/}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.annotations }}
    {{- toYaml .Values.annotations | nindent 4 }}
    {{- end }}
    # Prometheus annotations for metrics scraping
    prometheus.io/scrape: "{{ .Values.metrics.enabled | default "true" }}"
    prometheus.io/port: "{{ .Values.metrics.port | default "8100" }}"
    prometheus.io/path: "{{ .Values.metrics.path | default "/metrics" }}"
    # Deployment annotations
    kubernetes.io/change-cause: "{{ .Release.Name }} deployment by Helm on {{ now | date "2006-01-02T15:04:05Z07:00" }}"
    # Security annotations
    security.dollarfunding.com/reviewed: "{{ now | date "2006-01-02" }}"
    security.dollarfunding.com/compliance: "pci-dss,hipaa"
spec:
  # Deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.deployment.rollingUpdate.maxSurge | default "25%" }}
      maxUnavailable: {{ .Values.deployment.rollingUpdate.maxUnavailable | default "25%" }}
  # Replicas configuration
  replicas: {{ .Values.replicaCount }}
  # Selector for pods
  selector:
    matchLabels:
      {{- include "api-gateway.selectorLabels" . | nindent 6 }}
  # Template for pods
  template:
    metadata:
      labels:
        {{- include "api-gateway.selectorLabels" . | nindent 8 }}
        {{- if .Values.podLabels }}
        {{- toYaml .Values.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        # Pod annotations
        {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
        # Prometheus annotations
        prometheus.io/scrape: "{{ .Values.metrics.enabled | default "true" }}"
        prometheus.io/port: "{{ .Values.metrics.port | default "8100" }}"
        prometheus.io/path: "{{ .Values.metrics.path | default "/metrics" }}"
        # ConfigMap checksum to trigger pod restart on config changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Secret checksum to trigger pod restart on secret changes
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      # Service account
      serviceAccountName: {{ include "api-gateway.serviceAccountName" . }}
      # Security context for pod
      securityContext:
        {{- if .Values.podSecurityContext }}
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- else }}
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        {{- end }}
      # Termination grace period
      terminationGracePeriodSeconds: {{ .Values.deployment.terminationGracePeriodSeconds | default 30 }}
      # Affinity rules
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Node selector
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Tolerations
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Image pull secrets
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      # Containers
      containers:
        - name: {{ .Chart.Name }}
          # Kong API Gateway image version 3.5.0 as specified in technical spec
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default "3.5.0" }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          # Security context for container
          securityContext:
            {{- if .Values.containerSecurityContext }}
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
            {{- else }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
            {{- end }}
          # Ports
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: admin
              containerPort: 8001
              protocol: TCP
            - name: admin-ssl
              containerPort: 8444
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port | default 8100 }}
              protocol: TCP
          # Liveness probe
          livenessProbe:
            {{- if .Values.livenessProbe }}
            {{- toYaml .Values.livenessProbe | nindent 12 }}
            {{- else }}
            httpGet:
              path: /status
              port: admin
              scheme: HTTP
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
            {{- end }}
          # Readiness probe
          readinessProbe:
            {{- if .Values.readinessProbe }}
            {{- toYaml .Values.readinessProbe | nindent 12 }}
            {{- else }}
            httpGet:
              path: /status/ready
              port: admin
              scheme: HTTP
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
            {{- end }}
          # Startup probe
          {{- if .Values.startupProbe }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}
          # Resource limits and requests
          resources:
            {{- if .Values.resources }}
            {{- toYaml .Values.resources | nindent 12 }}
            {{- else }}
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 512Mi
            {{- end }}
          # Environment variables
          env:
            # Load environment variables from ConfigMap
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/declarative/kong.yaml
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000, 0.0.0.0:8443 ssl http2"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
            - name: KONG_LOG_LEVEL
              value: {{ .Values.kong.logLevel | default "notice" }}
            - name: KONG_NGINX_WORKER_PROCESSES
              value: {{ .Values.kong.workerProcesses | default "auto" | quote }}
            - name: KONG_NGINX_WORKER_CONNECTIONS
              value: {{ .Values.kong.workerConnections | default 1024 | quote }}
            - name: KONG_PLUGINS
              value: "bundled,jwt,rate-limiting,cors,ip-restriction,correlation-id,request-transformer"
            - name: KONG_SSL_CIPHER_SUITE
              value: "intermediate"
            - name: KONG_SSL_PROTOCOLS
              value: "TLSv1.2 TLSv1.3"
            - name: KONG_REAL_IP_HEADER
              value: "X-Forwarded-For"
            - name: KONG_TRUSTED_IPS
              value: "0.0.0.0/0,::/0"
            # JWT authentication configuration
            - name: KONG_JWT_CLAIMS_TO_VERIFY
              value: "exp"
            - name: KONG_JWT_KEY_CLAIM_NAME
              value: "iss"
            - name: KONG_JWT_MAXIMUM_EXPIRATION
              value: "7200"
            # Redis configuration for rate limiting
            - name: KONG_RATE_LIMITING_REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: KONG_RATE_LIMITING_REDIS_PORT
              value: {{ .Values.redis.port | default 6379 | quote }}
            - name: KONG_RATE_LIMITING_REDIS_DATABASE
              value: {{ .Values.redis.database | default 0 | quote }}
            - name: KONG_RATE_LIMITING_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "api-gateway.fullname" . }}-credentials
                  key: redis-password
            # Additional environment variables from values
            {{- range $key, $value := .Values.kong.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # Environment variables from secrets
            {{- range $key, $value := .Values.kong.envFromSecrets }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $value.secretName }}
                  key: {{ $value.secretKey }}
            {{- end }}
          # Volume mounts
          volumeMounts:
            # Mount for Kong configuration
            - name: kong-config
              mountPath: /kong/declarative
              readOnly: true
            # Mount for JWT keys
            - name: kong-credentials
              mountPath: /kong/credentials
              readOnly: true
            # Mount for TLS certificates
            {{- if .Values.tls.enabled }}
            - name: kong-tls
              mountPath: /kong/tls
              readOnly: true
            {{- end }}
            # Mount for temporary files
            - name: kong-tmp
              mountPath: /tmp
            # Mount for logs
            - name: kong-logs
              mountPath: /dev/shm
            # Additional volume mounts
            {{- if .Values.volumeMounts }}
            {{- toYaml .Values.volumeMounts | nindent 12 }}
            {{- end }}
        # Metrics sidecar container (optional)
        {{- if .Values.metrics.enabled }}
        - name: metrics
          image: "{{ .Values.metrics.image.repository }}:{{ .Values.metrics.image.tag }}"
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port | default 8100 }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          env:
            - name: KONG_ADMIN_URL
              value: http://localhost:8001
        {{- end }}
      # Init containers
      {{- if .Values.initContainers }}
      initContainers:
        {{- toYaml .Values.initContainers | nindent 8 }}
      {{- end }}
      # Volumes
      volumes:
        # Volume for Kong configuration
        - name: kong-config
          configMap:
            name: {{ include "api-gateway.fullname" . }}-config
            items:
              - key: kong.yaml
                path: kong.yaml
        # Volume for JWT keys and other credentials
        - name: kong-credentials
          secret:
            secretName: {{ include "api-gateway.fullname" . }}-credentials
            defaultMode: 0400
            items:
              - key: jwt-public-key
                path: jwt-public-key.pem
              - key: jwt-private-key
                path: jwt-private-key.pem
        # Volume for TLS certificates
        {{- if .Values.tls.enabled }}
        - name: kong-tls
          secret:
            secretName: {{ include "api-gateway.fullname" . }}-credentials
            defaultMode: 0400
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              {{- if .Values.tls.ca }}
              - key: tls.ca
                path: tls.ca
              {{- end }}
        {{- end }}
        # Volume for temporary files
        - name: kong-tmp
          emptyDir: {}
        # Volume for logs
        - name: kong-logs
          emptyDir:
            medium: Memory
        # Additional volumes
        {{- if .Values.volumes }}
        {{- toYaml .Values.volumes | nindent 8 }}
        {{- end }}