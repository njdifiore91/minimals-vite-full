{{- /*
Kubernetes Ingress manifest template for external access to the Kong API Gateway.
This template defines the Ingress resource that routes external HTTP/HTTPS traffic to the Kong service.
It configures hostnames, paths, TLS settings, and annotations for ingress controller-specific features.
*/}}

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kong.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kong.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  annotations:
    # Kong-specific annotations
    konghq.com/strip-path: {{ .Values.ingress.kong.stripPath | default "true" | quote }}
    konghq.com/preserve-host: {{ .Values.ingress.kong.preserveHost | default "true" | quote }}
    konghq.com/protocols: {{ .Values.ingress.kong.protocols | default "https,http" | quote }}
    
    # TLS and Security annotations
    {{- if .Values.ingress.tls.enabled }}
    kubernetes.io/tls-acme: {{ .Values.ingress.tls.acme | default "true" | quote }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | default "letsencrypt-prod" | quote }}
    {{- end }}
    
    # Plugin annotations - combining multiple plugins with a comma-separated list
    konghq.com/plugins: |
      {{ .Values.ingress.kong.securityHeadersPlugin | default "security-headers" }},
      {{ .Values.ingress.kong.rateLimitingPlugin | default "rate-limiting" }},
      {{ .Values.ingress.kong.corsPlugin | default "cors" }}
      {{- if .Values.ingress.rewrite.enabled }},{{ .Values.ingress.kong.rewritePlugin | default "request-transformer" }}{{- end }}
    
    # Additional custom annotations
    {{- if .Values.ingress.annotations }}
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range .Values.ingress.hosts }}
        - {{ .host | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "kong.fullname" .)) }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "kong.fullname" $ }}-proxy
                port:
                  number: {{ $.Values.proxy.http.servicePort | default 80 }}
          {{- end }}
    {{- end }}
    {{- if .Values.ingress.defaultBackend }}
  defaultBackend:
    service:
      name: {{ .Values.ingress.defaultBackend.service.name }}
      port:
        number: {{ .Values.ingress.defaultBackend.service.port }}
    {{- end }}
{{- end }}

{{- /* Define KongPlugin resources for the Ingress */}}
{{- if .Values.ingress.enabled }}

{{- /* Security Headers Plugin */}}
{{- if .Values.ingress.kong.plugins.securityHeaders.enabled | default true }}
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ .Values.ingress.kong.securityHeadersPlugin | default "security-headers" }}
  namespace: {{ .Release.Namespace }}
config:
  add_headers:
    - X-Frame-Options: {{ .Values.ingress.kong.plugins.securityHeaders.xFrameOptions | default "DENY" }}
    - X-Content-Type-Options: {{ .Values.ingress.kong.plugins.securityHeaders.xContentTypeOptions | default "nosniff" }}
    - X-XSS-Protection: {{ .Values.ingress.kong.plugins.securityHeaders.xXssProtection | default "1; mode=block" }}
    - Strict-Transport-Security: {{ .Values.ingress.kong.plugins.securityHeaders.strictTransportSecurity | default "max-age=31536000; includeSubDomains" }}
    - Content-Security-Policy: {{ .Values.ingress.kong.plugins.securityHeaders.contentSecurityPolicy | default "default-src 'self'; script-src 'self'; object-src 'none'" }}
    - Referrer-Policy: {{ .Values.ingress.kong.plugins.securityHeaders.referrerPolicy | default "strict-origin-when-cross-origin" }}
plugin: response-transformer
{{- end }}

{{- /* Rate Limiting Plugin */}}
{{- if .Values.ingress.kong.plugins.rateLimiting.enabled | default true }}
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ .Values.ingress.kong.rateLimitingPlugin | default "rate-limiting" }}
  namespace: {{ .Release.Namespace }}
config:
  second: {{ .Values.ingress.kong.plugins.rateLimiting.perSecond | default 10 }}
  minute: {{ .Values.ingress.kong.plugins.rateLimiting.perMinute | default 60 }}
  hour: {{ .Values.ingress.kong.plugins.rateLimiting.perHour | default 1000 }}
  day: {{ .Values.ingress.kong.plugins.rateLimiting.perDay | default 10000 }}
  policy: {{ .Values.ingress.kong.plugins.rateLimiting.policy | default "local" }}
  fault_tolerant: {{ .Values.ingress.kong.plugins.rateLimiting.faultTolerant | default true }}
  hide_client_headers: {{ .Values.ingress.kong.plugins.rateLimiting.hideClientHeaders | default false }}
  redis_host: {{ .Values.ingress.kong.plugins.rateLimiting.redisHost | default "" }}
  redis_port: {{ .Values.ingress.kong.plugins.rateLimiting.redisPort | default 6379 }}
  redis_password: {{ .Values.ingress.kong.plugins.rateLimiting.redisPassword | default "" }}
  redis_database: {{ .Values.ingress.kong.plugins.rateLimiting.redisDatabase | default 0 }}
plugin: rate-limiting
{{- end }}

{{- /* CORS Plugin */}}
{{- if .Values.ingress.kong.plugins.cors.enabled | default true }}
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ .Values.ingress.kong.corsPlugin | default "cors" }}
  namespace: {{ .Release.Namespace }}
config:
  origins: {{ .Values.ingress.kong.plugins.cors.origins | default "*" | quote }}
  methods: {{ .Values.ingress.kong.plugins.cors.methods | default "GET, PUT, POST, PATCH, DELETE, OPTIONS" | quote }}
  headers: {{ .Values.ingress.kong.plugins.cors.headers | default "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization" | quote }}
  exposed_headers: {{ .Values.ingress.kong.plugins.cors.exposedHeaders | default "Content-Length,Content-Range" | quote }}
  max_age: {{ .Values.ingress.kong.plugins.cors.maxAge | default 3600 }}
  credentials: {{ .Values.ingress.kong.plugins.cors.credentials | default false }}
  preflight_continue: {{ .Values.ingress.kong.plugins.cors.preflightContinue | default false }}
plugin: cors
{{- end }}

{{- /* Request Transformer Plugin for Path Rewrites */}}
{{- if and .Values.ingress.rewrite.enabled (.Values.ingress.kong.plugins.requestTransformer.enabled | default true) }}
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ .Values.ingress.kong.rewritePlugin | default "request-transformer" }}
  namespace: {{ .Release.Namespace }}
config:
  http_method: {{ .Values.ingress.kong.plugins.requestTransformer.httpMethod | default "" }}
  remove:
    headers: {{ .Values.ingress.kong.plugins.requestTransformer.remove.headers | default "[]" }}
    querystring: {{ .Values.ingress.kong.plugins.requestTransformer.remove.querystring | default "[]" }}
  replace:
    uri: {{ .Values.ingress.rewrite.target | default "/$1" }}
  add:
    headers: {{ .Values.ingress.kong.plugins.requestTransformer.add.headers | default "[]" }}
    querystring: {{ .Values.ingress.kong.plugins.requestTransformer.add.querystring | default "[]" }}
plugin: request-transformer
{{- end }}

{{- end }}