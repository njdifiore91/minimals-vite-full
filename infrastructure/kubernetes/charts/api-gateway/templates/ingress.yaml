apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "api-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
  annotations:
    # Enable TLS termination
    konghq.com/protocols: "https"
    # Rate limiting configuration for abuse prevention
    konghq.com/plugins: |
      {{ if .Values.ingress.rateLimit.enabled }}
      - name: rate-limiting
        config:
          second: {{ .Values.ingress.rateLimit.perSecond | default 5 }}
          minute: {{ .Values.ingress.rateLimit.perMinute | default 100 }}
          hour: {{ .Values.ingress.rateLimit.perHour | default 1000 }}
          policy: {{ .Values.ingress.rateLimit.policy | default "local" }}
          fault_tolerant: true
          hide_client_headers: false
          redis_host: {{ .Values.ingress.rateLimit.redis.host | default "redis" }}
          redis_port: {{ .Values.ingress.rateLimit.redis.port | default 6379 }}
          redis_password: {{ .Values.ingress.rateLimit.redis.password | default "" }}
          redis_timeout: {{ .Values.ingress.rateLimit.redis.timeout | default 2000 }}
      {{ end }}
      # Security headers plugin for all responses
      - name: response-transformer
        config:
          add:
            headers:
              - "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload"
              - "X-Content-Type-Options: nosniff"
              - "X-XSS-Protection: 1; mode=block"
              - "X-Frame-Options: DENY"
              - "Content-Security-Policy: default-src 'self'; script-src 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; connect-src 'self'"
              - "Referrer-Policy: strict-origin-when-cross-origin"
              - "Permissions-Policy: geolocation=(), microphone=(), camera=()"
    # Preserve client IP
    konghq.com/preserve-client-ip: "true"
    # Enable CORS if configured
    {{ if .Values.ingress.cors.enabled }}
    konghq.com/cors-plugin: |
      - name: cors
        config:
          origins: {{ .Values.ingress.cors.origins | default "*" | quote }}
          methods: {{ .Values.ingress.cors.methods | default "GET, POST, PUT, PATCH, DELETE, OPTIONS" | quote }}
          headers: {{ .Values.ingress.cors.headers | default "Accept, Accept-Version, Content-Length, Content-MD5, Content-Type, Date, X-Auth-Token, Authorization" | quote }}
          exposed_headers: {{ .Values.ingress.cors.exposedHeaders | default "" | quote }}
          credentials: {{ .Values.ingress.cors.credentials | default false }}
          max_age: {{ .Values.ingress.cors.maxAge | default 3600 }}
    {{ end }}
    # Path rewrite support
    {{ if .Values.ingress.rewrite.enabled }}
    konghq.com/rewrite: "{{ .Values.ingress.rewrite.target }}"
    {{ end }}
    # Redirect support
    {{ if .Values.ingress.redirect.enabled }}
    konghq.com/https-redirect-status-code: "{{ .Values.ingress.redirect.statusCode | default 301 }}"
    {{ end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "kong" }}
  {{ if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range .Values.ingress.hosts }}
        - {{ .host | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{ end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $.Values.ingress.serviceName | default (include "api-gateway.fullname" $) }}
                port:
                  number: {{ $.Values.ingress.servicePort | default 80 }}
          {{- end }}
    {{- end }}
  # Default backend for handling errors
  {{ if .Values.ingress.defaultBackend.enabled }}
  defaultBackend:
    service:
      name: {{ .Values.ingress.defaultBackend.serviceName }}
      port:
        number: {{ .Values.ingress.defaultBackend.servicePort | default 80 }}
  {{ end }}