{{- /*
RBAC template for Kong API Gateway

This template creates Role and RoleBinding resources for the Kong API Gateway.
It grants the Kong ServiceAccount the minimum required permissions to function
within the cluster, following the principle of least privilege.
*/}}

{{- if and .Values.rbac.create .Values.serviceAccount.create -}}

{{- if .Values.rbac.namespaced -}}
# Namespace-scoped Role for Kong API Gateway
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "kong.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kong.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
rules:
  # Allow Kong to get and update services and endpoints for service discovery
  - apiGroups: [""] # "" indicates the core API group
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  # Allow Kong to read ConfigMaps for configuration
  - apiGroups: [""] # "" indicates the core API group
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.rbac.extraRules }}
  {{- toYaml .Values.rbac.extraRules | nindent 2 }}
  {{- end }}
---
# Namespace-scoped RoleBinding for Kong API Gateway
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "kong.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kong.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "kong.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ template "kong.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- else -}}
# Cluster-scoped ClusterRole for Kong API Gateway
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ template "kong.fullname" . }}
  labels:
    {{- include "kong.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
rules:
  # Allow Kong to get and update services and endpoints for service discovery
  - apiGroups: [""] # "" indicates the core API group
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  # Allow Kong to read ConfigMaps for configuration
  - apiGroups: [""] # "" indicates the core API group
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.rbac.extraRules }}
  {{- toYaml .Values.rbac.extraRules | nindent 2 }}
  {{- end }}
---
# Cluster-scoped ClusterRoleBinding for Kong API Gateway
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ template "kong.fullname" . }}
  labels:
    {{- include "kong.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ template "kong.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ template "kong.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end -}}

{{- end -}}