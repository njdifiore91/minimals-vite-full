{{- /*
Common Secret template for MCA Application Processing System microservices.

This template creates Kubernetes Secrets for storing sensitive configuration data
with proper security measures and supports different secret types. It implements
the security requirements specified in the MCA Application Processing System
technical specification, including AES-256 encryption for sensitive data and
field-level encryption for PII.

Features:
- Support for different secret types (Opaque, TLS, etc.)
- Proper data encoding and security measures
- Annotations for tracking secret versions
- Options for external secret management integration
- Special handling for JWT authentication secrets
- PII data protection with field-level encryption

Usage:
```yaml
# values.yaml
secrets:
  # Standard application secrets
  - name: app-secrets
    type: Opaque
    annotations:
      version: "1.0.0"
    data:
      API_KEY: "your-api-key"
      DATABASE_PASSWORD: "your-db-password"
  
  # TLS certificate secrets
  - name: app-tls
    type: kubernetes.io/tls
    annotations:
      created-by: "helm"
    data:
      tls.crt: |
        {{ .Files.Get "path/to/tls.crt" | b64enc }}
      tls.key: |
        {{ .Files.Get "path/to/tls.key" | b64enc }}
  
  # JWT authentication secrets
  - name: jwt-auth-secrets
    type: Opaque
    annotations:
      version: "1.0.0"
    containsPII: false
    data:
      JWT_PRIVATE_KEY: "your-private-key"
      JWT_PUBLIC_KEY: "your-public-key"
      JWT_ALGORITHM: "RS256"
      JWT_TOKEN_EXPIRY: "3600"  # 60 minutes in seconds
      JWT_REFRESH_TOKEN_EXPIRY: "604800"  # 7 days in seconds
  
  # PII data secrets with field-level encryption
  - name: pii-secrets
    type: Opaque
    annotations:
      version: "1.0.0"
    containsPII: true
    data:
      ENCRYPTION_KEY: "your-aes-256-encryption-key"
```
*/ -}}

{{- if .Values.secrets }}
{{- range .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "common.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    helm.sh/chart: {{ include "common.chart" $ }}
    {{- if .serviceType }}
    app.kubernetes.io/component: {{ .serviceType }}
    {{- end }}
    {{- if .labels }}
    {{- toYaml .labels | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .annotations }}
    {{- toYaml .annotations | nindent 4 }}
    {{- end }}
    # Add version tracking for secret rotation
    secret.kubernetes.io/version: {{ .annotations.version | default "1.0.0" | quote }}
    # Add timestamp for auditing
    secret.kubernetes.io/created-at: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
    # Add encryption annotation for sensitive data (AES-256 as specified in section 0.2.6)
    encryption.kubernetes.io/encryption-provider: aes-gcm
    security.dollarfunding.com/encryption-standard: "AES-256"
    # Add note about PII data if present (as specified in section 0.2.3)
    {{- if .containsPII }}
    security.dollarfunding.com/contains-pii: "true"
    security.dollarfunding.com/field-level-encryption: "true"
    {{- end }}
    # Add external secret management integration if enabled
    {{- if .externalSecretManager }}
    external-secrets.io/managed-by: {{ .externalSecretManager }}
    {{- end }}
    # Add environment indicator
    {{- if $.Values.global }}
    {{- if $.Values.global.environment }}
    environment.dollarfunding.com/name: {{ $.Values.global.environment }}
    {{- end }}
    {{- end }}
type: {{ .type | default "Opaque" }}
{{- if .stringData }}
stringData:
  {{- toYaml .stringData | nindent 2 }}
{{- end }}
{{- if .data }}
data:
  {{- if eq .type "kubernetes.io/tls" }}
  # Special handling for TLS secrets
  {{- if .data.tls\.crt }}
  tls.crt: {{ .data.tls\.crt }}
  {{- end }}
  {{- if .data.tls\.key }}
  tls.key: {{ .data.tls\.key }}
  {{- end }}
  {{- if .data.ca\.crt }}
  ca.crt: {{ .data.ca\.crt }}
  {{- end }}
  
  {{- else if .serviceType }}
  # Service-specific secret handling based on service type
  {{- if eq .serviceType "email-service" }}
  # Email Service specific secrets
  {{- if .data.IMAP_PASSWORD }}
  IMAP_PASSWORD: {{ .data.IMAP_PASSWORD | b64enc | quote }}
  {{- end }}
  {{- if .data.SMTP_PASSWORD }}
  SMTP_PASSWORD: {{ .data.SMTP_PASSWORD | b64enc | quote }}
  {{- end }}
  
  {{- else if eq .serviceType "data-service" }}
  # Data Service specific secrets (Java/Spring Boot)
  {{- if .data.SPRING_DATASOURCE_PASSWORD }}
  SPRING_DATASOURCE_PASSWORD: {{ .data.SPRING_DATASOURCE_PASSWORD | b64enc | quote }}
  {{- end }}
  {{- if .data.ENCRYPTION_KEY }}
  ENCRYPTION_KEY: {{ .data.ENCRYPTION_KEY | b64enc | quote }}
  {{- end }}
  
  {{- else if eq .serviceType "document-service" or eq .serviceType "ocr-service" }}
  # Python services specific secrets
  {{- if .data.S3_ACCESS_KEY }}
  S3_ACCESS_KEY: {{ .data.S3_ACCESS_KEY | b64enc | quote }}
  {{- end }}
  {{- if .data.S3_SECRET_KEY }}
  S3_SECRET_KEY: {{ .data.S3_SECRET_KEY | b64enc | quote }}
  {{- end }}
  
  {{- else if eq .serviceType "notification-service" }}
  # Notification Service specific secrets
  {{- if .data.WEBHOOK_SECRET }}
  WEBHOOK_SECRET: {{ .data.WEBHOOK_SECRET | b64enc | quote }}
  {{- end }}
  
  {{- else if eq .serviceType "api-gateway" }}
  # API Gateway specific secrets
  {{- if .data.JWT_SIGNING_KEY }}
  JWT_SIGNING_KEY: {{ .data.JWT_SIGNING_KEY | b64enc | quote }}
  {{- end }}
  
  {{- else if eq .serviceType "jwt-auth" }}
  # JWT Authentication secrets as specified in section 0.1.3
  {{- if .data.JWT_PRIVATE_KEY }}
  JWT_PRIVATE_KEY: {{ .data.JWT_PRIVATE_KEY | b64enc | quote }}
  {{- end }}
  {{- if .data.JWT_PUBLIC_KEY }}
  JWT_PUBLIC_KEY: {{ .data.JWT_PUBLIC_KEY | b64enc | quote }}
  {{- end }}
  JWT_ALGORITHM: {{ .data.JWT_ALGORITHM | default "RS256" | b64enc | quote }}
  JWT_TOKEN_EXPIRY: {{ .data.JWT_TOKEN_EXPIRY | default "3600" | b64enc | quote }}
  JWT_REFRESH_TOKEN_EXPIRY: {{ .data.JWT_REFRESH_TOKEN_EXPIRY | default "604800" | b64enc | quote }}
  
  {{- else }}
  # Standard secret data handling for other service types
  {{- range $key, $value := .data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
  
  {{- else }}
  # Standard secret data handling when no service type is specified
  {{- range $key, $value := .data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- /* Generate standard database secrets if enabled */ -}}
{{- if .Values.generateDatabaseSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.name" . }}-db-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "common.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "common.chart" . }}
    app.kubernetes.io/component: database
  annotations:
    secret.kubernetes.io/version: "1.0.0"
    secret.kubernetes.io/created-at: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
    encryption.kubernetes.io/encryption-provider: aes-gcm
    security.dollarfunding.com/encryption-standard: "AES-256"
    security.dollarfunding.com/contains-pii: "false"
    {{- if .Values.global }}
    {{- if .Values.global.environment }}
    environment.dollarfunding.com/name: {{ .Values.global.environment }}
    {{- end }}
    {{- end }}
type: Opaque
data:
  # PostgreSQL credentials as specified in section 0.2.1
  POSTGRES_USER: {{ .Values.database.username | default "postgres" | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | default (randAlphaNum 16) | b64enc | quote }}
  POSTGRES_DB: {{ .Values.database.name | default "mca_application" | b64enc | quote }}
  POSTGRES_HOST: {{ .Values.database.host | default (printf "%s-postgresql" .Release.Name) | b64enc | quote }}
  POSTGRES_PORT: {{ .Values.database.port | default "5432" | b64enc | quote }}
  # Connection string for services
  DATABASE_URL: {{ printf "jdbc:postgresql://%s:%s/%s" (.Values.database.host | default (printf "%s-postgresql" .Release.Name)) (.Values.database.port | default "5432") (.Values.database.name | default "mca_application") | b64enc | quote }}
{{- end }}

{{- /* Generate Redis credentials if enabled */ -}}
{{- if .Values.generateRedisSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.name" . }}-redis-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "common.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "common.chart" . }}
    app.kubernetes.io/component: cache
  annotations:
    secret.kubernetes.io/version: "1.0.0"
    secret.kubernetes.io/created-at: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
    encryption.kubernetes.io/encryption-provider: aes-gcm
    security.dollarfunding.com/encryption-standard: "AES-256"
    {{- if .Values.global }}
    {{- if .Values.global.environment }}
    environment.dollarfunding.com/name: {{ .Values.global.environment }}
    {{- end }}
    {{- end }}
type: Opaque
data:
  # Redis credentials as specified in section 0.2.3
  REDIS_HOST: {{ .Values.redis.host | default (printf "%s-redis" .Release.Name) | b64enc | quote }}
  REDIS_PORT: {{ .Values.redis.port | default "6379" | b64enc | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | default "" | b64enc | quote }}
  # TTL settings as specified in section 0.2.5
  REDIS_TTL_APPLICATION_DATA: {{ .Values.redis.ttl.applicationData | default "900" | b64enc | quote }}  # 15 minutes in seconds
  REDIS_TTL_USER_SESSIONS: {{ .Values.redis.ttl.userSessions | default "86400" | b64enc | quote }}  # 24 hours in seconds
{{- end }}

{{- /* Generate RabbitMQ credentials if enabled */ -}}
{{- if .Values.generateRabbitMQSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.name" . }}-rabbitmq-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "common.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "common.chart" . }}
    app.kubernetes.io/component: messaging
  annotations:
    secret.kubernetes.io/version: "1.0.0"
    secret.kubernetes.io/created-at: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
    encryption.kubernetes.io/encryption-provider: aes-gcm
    security.dollarfunding.com/encryption-standard: "AES-256"
    {{- if .Values.global }}
    {{- if .Values.global.environment }}
    environment.dollarfunding.com/name: {{ .Values.global.environment }}
    {{- end }}
    {{- end }}
type: Opaque
data:
  # RabbitMQ credentials as specified in section 0.1.4
  RABBITMQ_HOST: {{ .Values.rabbitmq.host | default (printf "%s-rabbitmq" .Release.Name) | b64enc | quote }}
  RABBITMQ_PORT: {{ .Values.rabbitmq.port | default "5672" | b64enc | quote }}
  RABBITMQ_USERNAME: {{ .Values.rabbitmq.username | default "guest" | b64enc | quote }}
  RABBITMQ_PASSWORD: {{ .Values.rabbitmq.password | default "guest" | b64enc | quote }}
  RABBITMQ_VHOST: {{ .Values.rabbitmq.vhost | default "/" | b64enc | quote }}
  # Exchange and queue configuration as specified in section 0.1.4
  RABBITMQ_EXCHANGE: {{ .Values.rabbitmq.exchange | default "mca.documents" | b64enc | quote }}
  RABBITMQ_QUEUE_DOCUMENT_PROCESSING: {{ .Values.rabbitmq.queues.documentProcessing | default "document-processing" | b64enc | quote }}
  RABBITMQ_QUEUE_DATA_EXTRACTION: {{ .Values.rabbitmq.queues.dataExtraction | default "data-extraction" | b64enc | quote }}
  RABBITMQ_QUEUE_NOTIFICATION: {{ .Values.rabbitmq.queues.notification | default "notification" | b64enc | quote }}
{{- end }}

{{- /* Generate S3 storage credentials if enabled */ -}}
{{- if .Values.generateS3Secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.name" . }}-s3-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "common.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "common.chart" . }}
    app.kubernetes.io/component: storage
  annotations:
    secret.kubernetes.io/version: "1.0.0"
    secret.kubernetes.io/created-at: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
    encryption.kubernetes.io/encryption-provider: aes-gcm
    security.dollarfunding.com/encryption-standard: "AES-256"
    {{- if .Values.global }}
    {{- if .Values.global.environment }}
    environment.dollarfunding.com/name: {{ .Values.global.environment }}
    {{- end }}
    {{- end }}
type: Opaque
data:
  # S3 storage credentials as specified in section 0.2.5
  S3_ENDPOINT: {{ .Values.s3.endpoint | default "s3.amazonaws.com" | b64enc | quote }}
  S3_REGION: {{ .Values.s3.region | default "us-east-1" | b64enc | quote }}
  S3_ACCESS_KEY: {{ .Values.s3.accessKey | default "" | b64enc | quote }}
  S3_SECRET_KEY: {{ .Values.s3.secretKey | default "" | b64enc | quote }}
  # Bucket names based on environment as specified in section 0.2.5
  {{- if .Values.global }}
  {{- if eq .Values.global.environment "production" }}
  S3_BUCKET_NAME: {{ .Values.s3.bucketName | default "mca-documents-production" | b64enc | quote }}
  {{- else if eq .Values.global.environment "staging" }}
  S3_BUCKET_NAME: {{ .Values.s3.bucketName | default "mca-documents-staging" | b64enc | quote }}
  {{- else }}
  S3_BUCKET_NAME: {{ .Values.s3.bucketName | default "mca-documents-development" | b64enc | quote }}
  {{- end }}
  {{- else }}
  S3_BUCKET_NAME: {{ .Values.s3.bucketName | default "mca-documents" | b64enc | quote }}
  {{- end }}
  # Encryption settings as specified in section 0.2.5
  S3_USE_SSL: {{ .Values.s3.useSsl | default "true" | b64enc | quote }}
  S3_ENCRYPTION: {{ .Values.s3.encryption | default "AES256" | b64enc | quote }}
{{- end }}