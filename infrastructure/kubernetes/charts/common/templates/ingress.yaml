{{- /*
Common Ingress template for MCA Application Processing System microservices.
This template creates a Kubernetes Ingress resource for exposing services externally.

Features:
- TLS configuration for secure connections
- Annotations for different ingress controllers
- Path-based and host-based routing options
- Rate limiting and traffic management features
- CORS configuration
- Integration with Kong API Gateway
*/}}

{{- if .Values.ingress.enabled -}}
{{- $fullName := include "common.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $ingressApiVersion := include "common.capabilities.ingress.apiVersion" . -}}
apiVersion: {{ $ingressApiVersion }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    {{- with .Values.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    # Default annotations
    kubernetes.io/ingress.class: {{ .Values.ingress.className | default "nginx" | quote }}
    
    # Security-related annotations
    nginx.ingress.kubernetes.io/ssl-redirect: {{ .Values.ingress.sslRedirect | default "true" | quote }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: {{ .Values.ingress.forceSSLRedirect | default "true" | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.proxyBodySize | default "10m" | quote }}
    
    # CORS configuration
    nginx.ingress.kubernetes.io/enable-cors: {{ .Values.ingress.cors.enabled | default "true" | quote }}
    nginx.ingress.kubernetes.io/cors-allow-origin: {{ .Values.ingress.cors.allowOrigin | default "https://app.dollarfunding.com,https://staging.dollarfunding.com,http://localhost:3000" | quote }}
    nginx.ingress.kubernetes.io/cors-allow-methods: {{ .Values.ingress.cors.allowMethods | default "GET, PUT, POST, DELETE, PATCH, OPTIONS" | quote }}
    nginx.ingress.kubernetes.io/cors-allow-headers: {{ .Values.ingress.cors.allowHeaders | default "Accept,Authorization,Content-Type,X-Auth-Token,X-Correlation-ID" | quote }}
    nginx.ingress.kubernetes.io/cors-max-age: {{ .Values.ingress.cors.maxAge | default "3600" | quote }}
    nginx.ingress.kubernetes.io/cors-allow-credentials: {{ .Values.ingress.cors.allowCredentials | default "true" | quote }}
    
    # Rate limiting annotations
    nginx.ingress.kubernetes.io/rate-limit-rps: {{ .Values.ingress.rateLimit.requestsPerSecond | default "10" | quote }}
    nginx.ingress.kubernetes.io/rate-limit-connections: {{ .Values.ingress.rateLimit.connections | default "5" | quote }}
    nginx.ingress.kubernetes.io/rate-limit-burst-multiplier: {{ .Values.ingress.rateLimit.burstMultiplier | default "3" | quote }}
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    
    # Kong-specific annotations (if using Kong Ingress Controller)
    {{- if eq (.Values.ingress.className | default "nginx") "kong" }}
    konghq.com/strip-path: {{ .Values.ingress.kong.stripPath | default "false" | quote }}
    konghq.com/preserve-host: {{ .Values.ingress.kong.preserveHost | default "true" | quote }}
    konghq.com/protocols: {{ .Values.ingress.kong.protocols | default "https" | quote }}
    konghq.com/https-redirect-status-code: {{ .Values.ingress.kong.httpsRedirectStatusCode | default "301" | quote }}
    
    # Kong plugins
    konghq.com/plugins: {{ .Values.ingress.kong.plugins | default "cors,jwt,rate-limiting,request-transformer,response-transformer,correlation-id" | quote }}
    
    # Kong rate limiting
    konghq.com/rate-limiting.minute: {{ .Values.ingress.kong.rateLimit.minute | default "60" | quote }}
    konghq.com/rate-limiting.hour: {{ .Values.ingress.kong.rateLimit.hour | default "3000" | quote }}
    konghq.com/rate-limiting.policy: {{ .Values.ingress.kong.rateLimit.policy | default "redis" | quote }}
    {{- end }}
    
    # Custom annotations
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if and $ingressApiVersion (semverCompare ">=1.18-0" $ingressApiVersion) }}
  ingressClassName: {{ .Values.ingress.className | default "nginx" | quote }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- else if .Values.ingress.tlsEnabled }}
  tls:
    - hosts:
        {{- range .Values.ingress.hosts }}
        - {{ .host | quote }}
        {{- end }}
      secretName: {{ $fullName }}-tls
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if and $ingressApiVersion (semverCompare ">=1.18-0" $ingressApiVersion) }}
            pathType: {{ .pathType | default "Prefix" }}
            {{- end }}
            backend:
              {{- if and $ingressApiVersion (semverCompare ">=1.19-0" $ingressApiVersion) }}
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
              {{- else }}
              serviceName: {{ $fullName }}
              servicePort: {{ $svcPort }}
              {{- end }}
          {{- end }}
    {{- end }}
    {{- if not .Values.ingress.hosts }}
    - http:
        paths:
          - path: {{ .Values.ingress.path | default "/" }}
            {{- if and $ingressApiVersion (semverCompare ">=1.18-0" $ingressApiVersion) }}
            pathType: {{ .Values.ingress.pathType | default "Prefix" }}
            {{- end }}
            backend:
              {{- if and $ingressApiVersion (semverCompare ">=1.19-0" $ingressApiVersion) }}
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
              {{- else }}
              serviceName: {{ $fullName }}
              servicePort: {{ $svcPort }}
              {{- end }}
    {{- end }}
{{- end }}