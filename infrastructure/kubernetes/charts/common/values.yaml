# Default values for common Helm chart templates
# This file provides standardized settings for all MCA Application Processing System services
# Service-specific charts can override these values as needed

# Image configuration
image:
  # Default pull policy as specified in section 8.5.4
  pullPolicy: IfNotPresent
  # Default tag to use if not specified
  tag: "latest"

# Replica count for deployments
replicaCount: 1

# Resource limits and requests to prevent resource contention as specified in section 8.5.4
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Container security context for defense-in-depth approach as required in section 8.5.4
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Pod security context
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

# Service configuration
service:
  type: ClusterIP
  port: 80
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: ""  # Default is nginx, can be set to kong for Kong Ingress Controller
  annotations: {}
  labels: {}
  path: "/"  # Default path when hosts are not specified
  pathType: "Prefix"  # Can be Prefix, Exact, or ImplementationSpecific
  hosts: []  # List of host configurations
  # Example host configuration:
  # - host: example.com
  #   paths:
  #   - path: /api
  #     pathType: Prefix
  tls: []  # TLS configuration
  tlsEnabled: false  # Enable TLS without specifying tls section
  sslRedirect: true  # Redirect HTTP to HTTPS
  forceSSLRedirect: true  # Force SSL redirect even when TLS is not configured
  proxyBodySize: "10m"  # Maximum request body size
  
  # CORS configuration
  cors:
    enabled: true
    allowOrigin: "https://app.dollarfunding.com,https://staging.dollarfunding.com,http://localhost:3000"
    allowMethods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    allowHeaders: "Accept,Authorization,Content-Type,X-Auth-Token,X-Correlation-ID"
    maxAge: 3600
    allowCredentials: true
  
  # Rate limiting configuration
  rateLimit:
    requestsPerSecond: 10
    connections: 5
    burstMultiplier: 3
  
  # Kong-specific configuration
  kong:
    stripPath: false
    preserveHost: true
    protocols: "https"
    httpsRedirectStatusCode: 301
    plugins: "cors,jwt,rate-limiting,request-transformer,response-transformer,correlation-id"
    rateLimit:
      minute: 60
      hour: 3000
      policy: "redis"

# Liveness and readiness probes for self-healing services as mentioned in section 8.5.4
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
    path: /health/liveness
    port: http
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
    path: /health/readiness
    port: http

# Persistent volume claim configuration
persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""
  annotations: {}

# Network policy configuration
networkPolicy:
  enabled: false
  ingressRules: []
  egressRules: []

# Horizontal Pod Autoscaler configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ConfigMap configuration
configMap:
  enabled: true
  data: {}

# Secret configuration
secret:
  enabled: false
  type: Opaque
  data: {}

# ServiceAccount configuration
serviceAccount:
  create: true
  automountServiceAccountToken: true
  annotations: {}

# Standard labels for all resources
labels:
  app.kubernetes.io/part-of: "mca-application-processing-system"
  app.kubernetes.io/managed-by: "helm"

# Standard annotations for all resources
annotations:
  "mca.dollarfunding.com/version": "1.0.0"

# Environment-specific configurations
environments:
  development:
    resources:
      limits:
        cpu: 300m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  staging:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 256Mi
  production:
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    replicaCount: 2
    autoscaling:
      enabled: true

# Node affinity and tolerations
affinity: {}
tolerations: []
nodeSelector: {}

# Init containers
initContainers: []

# Additional containers (sidecars)
additionalContainers: []

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

# Topology spread constraints
topologySpreadConstraints: []

# Priority class name
priorityClassName: ""

# Service monitor for Prometheus integration
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Termination grace period seconds
terminationGracePeriodSeconds: 30

# Strategy for deployment updates
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%