{{- /*
PostgreSQL Service for Merchant Cash Advance Application Processing System

This Service provides a stable endpoint for client applications to connect to the PostgreSQL database.
It targets the primary PostgreSQL instance for write operations by default, and can be configured to
load balance read operations across replicas when read-write split is enabled.

Features:
- Stable DNS name for client connections
- Support for read-write splitting with annotations
- Integration with cloud provider load balancing
- Configurable session affinity
*/ -}}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
    app.kubernetes.io/component: primary
  annotations:
    # Description of the service purpose
    kubernetes.io/description: "PostgreSQL database service for client connections"
    
    {{- if .Values.service.annotations }}
    {{- toYaml .Values.service.annotations | nindent 4 }}
    {{- end }}
    
    # Cloud provider specific annotations
    {{- if eq .Values.global.provider "aws" }}
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    {{- else if eq .Values.global.provider "azure" }}
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    {{- else if eq .Values.global.provider "gcp" }}
    cloud.google.com/load-balancer-type: "Internal"
    {{- end }}
    
    # Read-write split annotations if enabled
    {{- if .Values.service.readWriteSplit.enabled }}
    service.beta.kubernetes.io/read-write-split: "true"
    service.beta.kubernetes.io/read-only-endpoints: "{{ include "postgresql.fullname" . }}-1.{{ include "postgresql.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local:5432{{- if eq .Values.global.environment "production" }},{{ include "postgresql.fullname" . }}-2.{{ include "postgresql.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local:5432{{- end }}"
    service.beta.kubernetes.io/write-only-endpoints: "{{ include "postgresql.fullname" . }}-0.{{ include "postgresql.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local:5432"
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- if .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  {{- if .Values.service.sessionAffinity }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  {{- if .Values.service.sessionAffinityConfig }}
  sessionAffinityConfig:
    {{- toYaml .Values.service.sessionAffinityConfig | nindent 4 }}
  {{- end }}
  {{- end }}
  ports:
    - name: postgresql
      port: {{ .Values.service.port | default 5432 }}
      targetPort: postgresql
      protocol: TCP
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- if .Values.service.readWriteSplit.enabled }}
    # When read-write split is enabled, target all PostgreSQL pods
    {{- include "postgresql.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
    {{- else }}
    # By default, target only the primary PostgreSQL pod (ordinal 0)
    {{- include "postgresql.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
    statefulset.kubernetes.io/pod-name: {{ include "postgresql.fullname" . }}-0
    {{- end }}