{{- /*
Secret template for PostgreSQL credentials and encryption keys
This template creates a Kubernetes Secret containing sensitive PostgreSQL configuration
including database credentials, replication user password, and encryption keys.
*/}}

{{- $fullName := include "postgresql.fullname" . -}}
{{- $postgresqlSecretName := printf "%s" $fullName -}}

{{- $postgresqlPassword := .Values.postgresql.password | default (randAlphaNum 16) -}}
{{- $replicationPassword := .Values.postgresql.replication.password | default (randAlphaNum 16) -}}
{{- $fieldLevelEncryptionKey := .Values.security.encryption.fieldLevelEncryption.key | default (randAlphaNum 32) -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $postgresqlSecretName }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-delete-policy": "before-hook-creation"
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  # Database credentials
  # The password will be auto-generated if not provided in values
  postgresql-password: {{ $postgresqlPassword | b64enc | quote }}
  
  # Replication user credentials
  # The password will be auto-generated if not provided in values
  {{- if .Values.postgresql.replication.enabled }}
  postgresql-replication-password: {{ $replicationPassword | b64enc | quote }}
  {{- end }}
  
  # Field-level encryption key for PII protection
  # The key will be auto-generated if not provided in values
  {{- if .Values.security.encryption.fieldLevelEncryption.enabled }}
  field-level-encryption-key: {{ $fieldLevelEncryptionKey | b64enc | quote }}
  {{- end }}
  
  # Connection string for applications
  # Format: postgresql://username:password@host:port/database
  postgresql-connection-string: {{ printf "postgresql://%s:%s@%s:%s/%s" .Values.postgresql.username $postgresqlPassword (include "postgresql.fullname" .) (toString .Values.postgresql.port) .Values.postgresql.database | b64enc | quote }}
  
  # Connection string for read replicas (if enabled)
  {{- if and .Values.service.readReplica.enabled (gt (int (include "postgresql.replicaCount" .)) 0) }}
  postgresql-readonly-connection-string: {{ printf "postgresql://%s:%s@%s:%s/%s" .Values.postgresql.username $postgresqlPassword (include "postgresql.readReplicaServiceName" .) (toString .Values.postgresql.port) .Values.postgresql.database | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.security.encryption.fieldLevelEncryption.enabled }}
  # Previous encryption keys for key rotation (if any)
  {{- range $i, $key := .Values.security.encryption.fieldLevelEncryption.previousKeys | default list }}
  field-level-encryption-key-{{ $i }}: {{ $key | b64enc | quote }}
  {{- end }}
  {{- end }}
  
  {{- if .Values.security.tls.enabled }}
  # TLS certificate and key will be populated by cert-manager or provided externally
  # This is a placeholder for manual TLS configuration if needed
  {{- if .Values.security.tls.crt }}
  tls.crt: {{ .Values.security.tls.crt | b64enc | quote }}
  {{- end }}
  {{- if .Values.security.tls.key }}
  tls.key: {{ .Values.security.tls.key | b64enc | quote }}
  {{- end }}
  {{- end }}
  
  {{- if .Values.backup.s3.enabled }}
  # S3 backup credentials (if not using IAM roles)
  {{- if .Values.backup.s3.accessKey }}
  s3-access-key: {{ .Values.backup.s3.accessKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.backup.s3.secretKey }}
  s3-secret-key: {{ .Values.backup.s3.secretKey | b64enc | quote }}
  {{- end }}
  {{- end }}