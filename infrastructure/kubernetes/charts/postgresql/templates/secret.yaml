{{- /*
PostgreSQL Secret Template

This template creates a Kubernetes Secret resource containing sensitive PostgreSQL configuration
including database credentials, replication user password, and encryption keys.

The secret includes:
1. Database username and password
2. Replication user credentials
3. Encryption keys for AES-256 encryption
4. Field-level encryption keys for PII

Passwords are generated randomly if not provided in values.yaml

This secret supports the following requirements from the technical specification:
- Secure storage of database credentials
- Support for replication user setup
- Implementation of AES-256 encryption for sensitive data
- Secure field-level encryption for PII
*/}}

{{- /* Define helper templates for PostgreSQL configuration */}}
{{- define "postgresql.conf.security" -}}
# Security configuration for PostgreSQL
# These settings implement the security requirements from the technical specification

# Encryption settings
ssl_cert_file = '/etc/postgresql/tls/tls.crt'
ssl_key_file = '/etc/postgresql/tls/tls.key'

# Connection security
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 10

# Authentication settings
password_encryption = scram-sha-256
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql.fullname" . }}-credentials
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
    {{- if .Values.security.encryption.aes256.enabled }}
    # Annotation for key rotation schedule
    security.dollarfunding.com/key-rotation-days: "{{ .Values.security.encryption.aes256.keyRotationDays }}"
    {{- end }}
type: Opaque
data:
  # Database credentials
  {{- if .Values.postgresql.password }}
  # Use provided password if available
  postgres-password: {{ .Values.postgresql.password | b64enc | quote }}
  {{- else }}
  # Generate a random password if not provided
  postgres-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  
  # Application database user credentials
  postgres-username: {{ .Values.postgresql.username | b64enc | quote }}
  {{- if .Values.postgresql.password }}
  # Use provided password if available
  postgres-user-password: {{ .Values.postgresql.password | b64enc | quote }}
  {{- else }}
  # Generate a random password if not provided
  postgres-user-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  
  # Replication user credentials
  replication-username: {{ .Values.postgresql.replicationUsername | b64enc | quote }}
  {{- if .Values.postgresql.replicationPassword }}
  # Use provided replication password if available
  replication-password: {{ .Values.postgresql.replicationPassword | b64enc | quote }}
  {{- else }}
  # Generate a random replication password if not provided
  replication-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.metrics.enabled }}
  # Metrics exporter credentials
  metrics-username: {{ .Values.metrics.username | b64enc | quote }}
  metrics-password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.security.encryption.aes256.enabled }}
  # AES-256 encryption key for sensitive data
  # Generate a secure random key for AES-256 encryption
  aes-256-encryption-key: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  
  {{- if .Values.security.encryption.fieldLevel.enabled }}
  # Field-level encryption key for PII data
  # Generate a secure random key for field-level encryption
  field-level-encryption-key: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  
  # Connection string for applications
  # Format: postgresql://username:password@host:port/database
  {{- $postgresPassword := .Values.postgresql.password | default (randAlphaNum 32) }}
  {{- $serviceName := include "postgresql.fullname" . }}
  {{- $namespace := .Release.Namespace }}
  {{- $port := .Values.service.port | default 5432 }}
  {{- $database := .Values.postgresql.database }}
  {{- $username := .Values.postgresql.username }}
  connection-string: {{ printf "postgresql://%s:%s@%s.%s.svc.cluster.local:%d/%s" $username $postgresPassword $serviceName $namespace $port $database | b64enc | quote }}
  
  # Connection string for read-only operations (connecting to replicas)
  {{- $readServiceName := printf "%s-read" (include "postgresql.fullname" .) }}
  read-connection-string: {{ printf "postgresql://%s:%s@%s.%s.svc.cluster.local:%d/%s" $username $postgresPassword $readServiceName $namespace $port $database | b64enc | quote }}
  
  # PostgreSQL configuration file with secure settings
  postgresql.conf: |-
    # Security settings
    ssl = on
    ssl_ciphers = 'HIGH:!aNULL'
    password_encryption = scram-sha-256
    
    # Prevent exposure of sensitive data
    log_statement = 'none'
    log_min_error_statement = 'error'
    
    # Encryption settings
    {{- if .Values.security.encryption.aes256.enabled }}
    # Enable pgcrypto extension for encryption
    shared_preload_libraries = 'pgcrypto'
    {{- end }}
    {{- include "postgresql.conf.security" . | indent 4 }}
  
  # pg_hba.conf for access control
  pg_hba.conf: |-
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    
    # Allow replication connections from localhost, by a user with the replication privilege
    local   replication     {{ .Values.postgresql.replicationUsername }}  scram-sha-256
    host    replication     {{ .Values.postgresql.replicationUsername }}  127.0.0.1/32       scram-sha-256
    host    replication     {{ .Values.postgresql.replicationUsername }}  ::1/128            scram-sha-256
    
    # Allow replication connections from pods in the same namespace
    host    replication     {{ .Values.postgresql.replicationUsername }}  10.0.0.0/8         scram-sha-256
    
    # Database administrative login by Unix domain socket
    local   all             postgres                                     peer
    
    # "local" is for Unix domain socket connections only
    local   all             all                                          scram-sha-256
    
    # IPv4 local connections:
    host    all             all             127.0.0.1/32                scram-sha-256
    
    # IPv6 local connections:
    host    all             all             ::1/128                     scram-sha-256
    
    # Allow connections from pods in the same namespace
    host    all             all             10.0.0.0/8                  scram-sha-256
    
    # Allow connections from specific namespaces
    {{- range .Values.security.networkPolicies.allowedNamespaces }}
    host    all             all             10.0.0.0/8                  scram-sha-256
    {{- end }}