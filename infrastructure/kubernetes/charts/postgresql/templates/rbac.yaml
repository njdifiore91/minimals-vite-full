{{- if .Values.rbac.create -}}
# Role for PostgreSQL pods
# This Role defines the permissions required for PostgreSQL pods to operate within their namespace
# Following the principle of least privilege, only necessary permissions are granted
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    # Helm hooks ensure Role is created before other resources that depend on it
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
rules:
  # Allow access to ConfigMaps for configuration
  - apiGroups: [""] 
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
    # Optionally restrict to specific ConfigMaps if needed
    # resourceNames: ["{{ include "postgresql.fullname" . }}-config"]
  
  # Allow access to Secrets for credentials
  - apiGroups: [""] 
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
    # Optionally restrict to specific Secrets if needed
    # resourceNames: ["{{ include "postgresql.fullname" . }}", "{{ include "postgresql.fullname" . }}-replication"]
  
  # Allow access to PersistentVolumeClaims for data storage
  - apiGroups: [""] 
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  
  # Allow pod management within the StatefulSet
  - apiGroups: [""] 
    resources: ["pods"]
    verbs: ["get", "list", "watch", "update", "patch"]
  
  # Allow endpoint access for service discovery
  - apiGroups: [""] 
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  
  # Allow service access for network connectivity
  - apiGroups: [""] 
    resources: ["services"]
    verbs: ["get", "list", "watch"]

---
# RoleBinding for PostgreSQL pods
# This RoleBinding associates the Role with the PostgreSQL ServiceAccount
# It grants the permissions defined in the Role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    # Helm hooks ensure RoleBinding is created after Role but before other resources
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "postgresql.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rbac.serviceAccountName | default (include "postgresql.fullname" .) }}
    namespace: {{ .Release.Namespace }}
{{- end }}