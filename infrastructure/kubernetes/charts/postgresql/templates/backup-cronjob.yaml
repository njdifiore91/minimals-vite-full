{{- /*
PostgreSQL Backup CronJob
This template creates a Kubernetes CronJob that performs scheduled backups of the PostgreSQL database
to S3-compatible storage with environment-specific configuration.

Features:
- Regular backup schedule with point-in-time recovery capability
- Automated daily backups with 30-day retention in production (configurable)
- Integration with S3-compatible storage for backup storage with AES-256 encryption
- Support for point-in-time recovery with 5-minute RPO through WAL archiving
- Backup verification and monitoring with notification support
*/}}
{{- if .Values.backup.enabled }}
# Create a ConfigMap for WAL archiving script to support point-in-time recovery with 5-minute RPO
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgresql.fullname" . }}-wal-archive
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
    app.kubernetes.io/component: wal-archive
data:
  archive-wal.sh: |
    #!/bin/bash
    # WAL archiving script for point-in-time recovery with 5-minute RPO
    # This script is called by PostgreSQL archive_command to copy WAL segments to S3
    
    # Parameters passed by PostgreSQL
    WAL_FILE=$1
    WAL_DEST=$2
    
    # Environment variables
    S3_BUCKET=${S3_BUCKET:-"{{ .Values.backup.destination.bucketName }}"}
    WAL_PREFIX=${WAL_PREFIX:-"{{ .Values.backup.walArchive.prefix }}"}
    
    # Archive the WAL segment to S3
    aws s3 cp "${WAL_FILE}" "s3://${S3_BUCKET}/${WAL_PREFIX}/$(basename ${WAL_FILE})" \
      --storage-class STANDARD \
      --server-side-encryption AES256
    
    # Log the archival for monitoring
    echo "$(date -u +"%Y-%m-%dT%H:%M:%SZ") - Archived WAL segment $(basename ${WAL_FILE}) to s3://${S3_BUCKET}/${WAL_PREFIX}/" >> /var/log/postgresql/wal_archive.log
    
    # Return success/failure
    exit $?
  
  restore-wal.sh: |
    #!/bin/bash
    # WAL restoration script for point-in-time recovery
    # This script is called by PostgreSQL restore_command to retrieve WAL segments from S3
    
    # Parameters passed by PostgreSQL
    WAL_FILE=$1
    WAL_DEST=$2
    
    # Environment variables
    S3_BUCKET=${S3_BUCKET:-"{{ .Values.backup.destination.bucketName }}"}
    WAL_PREFIX=${WAL_PREFIX:-"{{ .Values.backup.walArchive.prefix }}"}
    
    # Retrieve the WAL segment from S3
    aws s3 cp "s3://${S3_BUCKET}/${WAL_PREFIX}/$(basename ${WAL_FILE})" "${WAL_DEST}" \
      || exit 1
    
    # Log the restoration for monitoring
    echo "$(date -u +"%Y-%m-%dT%H:%M:%SZ") - Restored WAL segment $(basename ${WAL_FILE}) from s3://${S3_BUCKET}/${WAL_PREFIX}/" >> /var/log/postgresql/wal_restore.log
    
    # Return success
    exit 0
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "postgresql.fullname" . }}-backup
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  # Schedule based on environment (daily for production, configurable for others)
  schedule: {{ .Values.backup.schedule | quote }}
  # Concurrency policy to prevent overlapping backup jobs
  concurrencyPolicy: Forbid
  # Keep history of successful and failed jobs
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit | default 3 }}
  # Job template
  jobTemplate:
    spec:
      # Set timeout for backup jobs
      activeDeadlineSeconds: {{ .Values.backup.activeDeadlineSeconds | default 3600 }}
      template:
        metadata:
          labels:
            {{- include "postgresql.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
          annotations:
            {{- with .Values.backup.podAnnotations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          # Service account for backup job
          serviceAccountName: {{ include "postgresql.serviceAccountName" . }}
          # Restart policy for the pod
          restartPolicy: OnFailure
          # Security context for the pod
          securityContext:
            {{- toYaml .Values.backup.podSecurityContext | nindent 12 }}
          # Init containers
          initContainers:
            # Check database availability
            - name: check-db-ready
              image: {{ .Values.backup.initContainer.image }}
              imagePullPolicy: {{ .Values.backup.initContainer.pullPolicy }}
              command: ['sh', '-c', 'until pg_isready -h {{ include "postgresql.fullname" . }} -p {{ .Values.service.port }}; do echo waiting for database; sleep 2; done;']
              securityContext:
                {{- toYaml .Values.backup.initContainer.securityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.backup.initContainer.resources | nindent 16 }}
            
            # Check S3 bucket accessibility
            - name: check-s3-access
              image: {{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}
              imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
              command: ['sh', '-c', 'aws s3 ls s3://{{ .Values.backup.destination.bucketName }} || exit 1']
              securityContext:
                {{- toYaml .Values.backup.initContainer.securityContext | nindent 16 }}
              env:
                # AWS credentials for S3 access
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.destination.credentialsSecret }}
                      key: access-key
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.destination.credentialsSecret }}
                      key: secret-key
                - name: AWS_REGION
                  value: {{ .Values.backup.destination.region }}
                - name: AWS_ENDPOINT_URL
                  value: {{ .Values.backup.destination.endpointUrl | default "" | quote }}
              resources:
                {{- toYaml .Values.backup.initContainer.resources | nindent 16 }}
          # Main backup container
          containers:
            - name: backup
              image: {{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}
              imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.backup.securityContext | nindent 16 }}
              # Resource limits and requests
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              # Command to execute backup
              command:
                - /bin/sh
                - -c
                - |
                  # Set timestamp for backup file naming
                  TIMESTAMP=$(date +%Y%m%d%H%M%S)
                  BACKUP_FILE="${POSTGRES_DATABASE}_${TIMESTAMP}.sql.gz"
                  BACKUP_PATH="${BACKUP_PREFIX}/${BACKUP_FILE}"
                  
                  echo "Starting PostgreSQL backup to S3: ${BACKUP_PATH}"
                  
                  # Perform database backup with pg_dump and compress
                  # Using custom format (-Fc) for better compression and selective restore capability
                  pg_dump -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -U ${POSTGRES_USER} \
                    -d ${POSTGRES_DATABASE} -Fc -v -Z 9 > /tmp/${BACKUP_FILE}
                  
                  # Check if backup was successful
                  if [ $? -eq 0 ]; then
                    echo "Database backup completed successfully"
                    
                    # Upload to S3 with server-side encryption
                    echo "Uploading backup to S3 bucket: ${S3_BUCKET}"
                    aws s3 cp /tmp/${BACKUP_FILE} s3://${S3_BUCKET}/${BACKUP_PATH} \
                      --storage-class STANDARD \
                      --server-side-encryption AES256
                    
                    # Verify the upload was successful
                    if [ $? -eq 0 ]; then
                      echo "Backup uploaded successfully to S3"
                      
                      # Create backup metadata file
                      echo "{\
                        \"database\": \"${POSTGRES_DATABASE}\",\
                        \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\
                        \"size\": $(stat -c%s /tmp/${BACKUP_FILE}),\
                        \"environment\": \"${ENVIRONMENT}\",\
                        \"version\": \"$(pg_dump --version | head -n 1)\"\
                      }" > /tmp/metadata.json
                      
                      # Upload metadata file
                      aws s3 cp /tmp/metadata.json s3://${S3_BUCKET}/${BACKUP_PREFIX}/metadata/${TIMESTAMP}.json \
                        --storage-class STANDARD \
                        --server-side-encryption AES256
                      
                      # Clean up old backups if retention is enabled
                      if [ ${RETENTION_DAYS} -gt 0 ]; then
                        echo "Cleaning up backups older than ${RETENTION_DAYS} days"
                        
                        # Calculate cutoff date for retention
                        CUTOFF_DATE=$(date -d "${RETENTION_DAYS} days ago" +%Y-%m-%d)
                        
                        # List and delete old backups
                        aws s3 ls s3://${S3_BUCKET}/${BACKUP_PREFIX}/ | \
                          grep -v metadata | \
                          awk '{print $4}' | \
                          while read -r backup; do
                            # Extract date from backup filename
                            BACKUP_DATE=$(echo "$backup" | grep -oP '\d{8}')
                            FORMATTED_DATE="${BACKUP_DATE:0:4}-${BACKUP_DATE:4:2}-${BACKUP_DATE:6:2}"
                            
                            # Compare with cutoff date
                            if [[ "$FORMATTED_DATE" < "$CUTOFF_DATE" ]]; then
                              echo "Deleting old backup: $backup"
                              aws s3 rm s3://${S3_BUCKET}/${BACKUP_PREFIX}/$backup
                              
                              # Also delete corresponding metadata
                              METADATA_FILE="metadata/${BACKUP_DATE}.json"
                              if aws s3 ls s3://${S3_BUCKET}/${BACKUP_PREFIX}/$METADATA_FILE &>/dev/null; then
                                aws s3 rm s3://${S3_BUCKET}/${BACKUP_PREFIX}/$METADATA_FILE
                              fi
                            fi
                          done
                      fi
                      
                      # Verify backup integrity by testing restore
                      if [ "${VERIFY_BACKUP}" = "true" ]; then
                        echo "Verifying backup integrity"
                        
                        # Create temporary directory for verification
                        mkdir -p /tmp/verify
                        
                        # Test restore of the backup (metadata only, not full restore)
                        pg_restore -l /tmp/${BACKUP_FILE} > /tmp/verify/backup_toc.txt
                        
                        # Check if TOC was successfully extracted
                        if [ $? -eq 0 ]; then
                          echo "Backup verification successful"
                          
                          # Add verification status to metadata
                          sed -i 's/}$/,"verified": true}/' /tmp/metadata.json
                          
                          # Re-upload updated metadata
                          aws s3 cp /tmp/metadata.json s3://${S3_BUCKET}/${BACKUP_PREFIX}/metadata/${TIMESTAMP}.json \
                            --storage-class STANDARD \
                            --server-side-encryption AES256
                        else
                          echo "Backup verification failed"
                          
                          # Add verification failure to metadata
                          sed -i 's/}$/,"verified": false}/' /tmp/metadata.json
                          
                          # Re-upload updated metadata
                          aws s3 cp /tmp/metadata.json s3://${S3_BUCKET}/${BACKUP_PREFIX}/metadata/${TIMESTAMP}.json \
                            --storage-class STANDARD \
                            --server-side-encryption AES256
                          
                          # Send verification failure notification if configured
                          if [ ! -z "${NOTIFICATION_URL}" ]; then
                            curl -X POST ${NOTIFICATION_URL} \
                              -H "Content-Type: application/json" \
                              -d "{\
                                \"status\": \"warning\",\
                                \"database\": \"${POSTGRES_DATABASE}\",\
                                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\
                                \"backup_path\": \"${BACKUP_PATH}\",\
                                \"environment\": \"${ENVIRONMENT}\",\
                                \"message\": \"Backup verification failed\"\
                              }"
                          fi
                        fi
                        
                        # Clean up verification directory
                        rm -rf /tmp/verify
                      fi
                      
                      # Send success notification if configured
                      if [ ! -z "${NOTIFICATION_URL}" ]; then
                        curl -X POST ${NOTIFICATION_URL} \
                          -H "Content-Type: application/json" \
                          -d "{\
                            \"status\": \"success\",\
                            \"database\": \"${POSTGRES_DATABASE}\",\
                            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\
                            \"backup_path\": \"${BACKUP_PATH}\",\
                            \"environment\": \"${ENVIRONMENT}\"\
                          }"
                      fi
                      
                      echo "Backup process completed successfully"
                      exit 0
                    else
                      echo "Failed to upload backup to S3"
                      exit 1
                    fi
                  else
                    echo "Database backup failed"
                    
                    # Send failure notification if configured
                    if [ ! -z "${NOTIFICATION_URL}" ]; then
                      curl -X POST ${NOTIFICATION_URL} \
                        -H "Content-Type: application/json" \
                        -d "{\
                          \"status\": \"failure\",\
                          \"database\": \"${POSTGRES_DATABASE}\",\
                          \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\
                          \"error\": \"Database backup failed\",\
                          \"environment\": \"${ENVIRONMENT}\"\
                        }"
                    fi
                    
                    exit 1
                  fi
              # Environment variables for backup
              env:
                - name: POSTGRES_HOST
                  value: {{ include "postgresql.fullname" . }}
                - name: POSTGRES_PORT
                  value: "{{ .Values.service.port }}"
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "postgresql.secretName" . }}
                      key: {{ .Values.auth.secretKeys.adminPasswordKey }}
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "postgresql.secretName" . }}
                      key: {{ .Values.auth.secretKeys.adminPasswordKey }}
                - name: POSTGRES_DATABASE
                  value: {{ .Values.auth.database }}
                - name: S3_BUCKET
                  value: {{ .Values.backup.destination.bucketName }}
                - name: BACKUP_PREFIX
                  value: {{ .Values.backup.destination.prefix }}
                - name: ENVIRONMENT
                  value: {{ .Values.global.environment | default .Release.Namespace }}
                - name: RETENTION_DAYS
                  value: "{{ .Values.backup.retentionDays }}"
                - name: NOTIFICATION_URL
                  value: {{ .Values.backup.notificationUrl | default "" | quote }}
                - name: VERIFY_BACKUP
                  value: {{ .Values.backup.verifyBackup | default "true" | quote }}
                # AWS credentials for S3 access
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.destination.credentialsSecret }}
                      key: access-key
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.destination.credentialsSecret }}
                      key: secret-key
                - name: AWS_REGION
                  value: {{ .Values.backup.destination.region }}
                - name: AWS_ENDPOINT_URL
                  value: {{ .Values.backup.destination.endpointUrl | default "" | quote }}
              # Resource limits
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              # Volume mounts for temporary storage
              volumeMounts:
                - name: backup-temp
                  mountPath: /tmp
                - name: wal-archive-scripts
                  mountPath: /scripts
                  readOnly: true
          # Volumes for backup job
          volumes:
            - name: backup-temp
              emptyDir: {}
            - name: wal-archive-scripts
              configMap:
                name: {{ include "postgresql.fullname" . }}-wal-archive
                defaultMode: 0755
{{- end }}