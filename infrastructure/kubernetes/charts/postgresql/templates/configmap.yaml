{{- /*
ConfigMap for PostgreSQL configuration
This template generates a ConfigMap containing PostgreSQL configuration parameters
including performance tuning, connection limits, and replication settings.
*/}}

{{- $environment := .Values.global.environment | default "production" }}
{{- $postgresParams := .Values.postgresql.parameters }}

{{- /* Apply environment-specific overrides if they exist */}}
{{- if eq $environment "staging" }}
  {{- if .Values.environmentOverrides.staging.postgresql.parameters }}
    {{- $postgresParams = merge $postgresParams .Values.environmentOverrides.staging.postgresql.parameters }}
  {{- end }}
{{- else if eq $environment "development" }}
  {{- if .Values.environmentOverrides.development.postgresql.parameters }}
    {{- $postgresParams = merge $postgresParams .Values.environmentOverrides.development.postgresql.parameters }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgresql.fullname" . }}-config
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
    {{- if .Values.annotations }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
    {{- end }}
data:
  # Main PostgreSQL configuration file
  postgresql.conf: |
    # -----------------------------
    # PostgreSQL {{ .Values.global.postgresVersion }} configuration file
    # Generated for {{ .Values.global.applicationName }} in {{ $environment }} environment
    # -----------------------------

    # CONNECTIONS AND AUTHENTICATION
    # -----------------------------
    listen_addresses = '*'
    port = 5432
    max_connections = {{ $postgresParams.max_connections }}
    
    # RESOURCE USAGE (except WAL)
    # -----------------------------
    shared_buffers = {{ $postgresParams.shared_buffers }}
    effective_cache_size = {{ $postgresParams.effective_cache_size }}
    work_mem = {{ $postgresParams.work_mem }}
    maintenance_work_mem = {{ $postgresParams.maintenance_work_mem }}
    
    # WRITE-AHEAD LOG
    # -----------------------------
    wal_level = {{ $postgresParams.wal_level }}
    max_wal_senders = {{ $postgresParams.max_wal_senders }}
    max_replication_slots = {{ $postgresParams.max_replication_slots }}
    wal_keep_size = {{ $postgresParams.wal_keep_size }}
    
    # REPLICATION
    # -----------------------------
    hot_standby = on
    hot_standby_feedback = on
    
    # QUERY TUNING
    # -----------------------------
    random_page_cost = {{ $postgresParams.random_page_cost }}
    effective_io_concurrency = {{ $postgresParams.effective_io_concurrency }}
    
    # AUTOVACUUM PARAMETERS
    # -----------------------------
    autovacuum = on
    autovacuum_vacuum_scale_factor = 0.1
    autovacuum_analyze_scale_factor = 0.05
    
    # CLIENT CONNECTION DEFAULTS
    # -----------------------------
    datestyle = 'iso, mdy'
    timezone = 'UTC'
    lc_messages = 'en_US.UTF-8'
    lc_monetary = 'en_US.UTF-8'
    lc_numeric = 'en_US.UTF-8'
    lc_time = 'en_US.UTF-8'
    default_text_search_config = 'pg_catalog.english'
    
    # LOGGING
    # -----------------------------
    log_destination = 'stderr'
    logging_collector = on
    log_directory = 'pg_log'
    log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
    log_rotation_age = 1d
    log_rotation_size = 100MB
    log_min_duration_statement = {{ $postgresParams.logging.logMinDurationStatement }}
    log_checkpoints = {{ $postgresParams.logging.logCheckpoints }}
    log_connections = {{ $postgresParams.logging.logConnections }}
    log_disconnections = {{ $postgresParams.logging.logDisconnections }}
    log_lock_waits = {{ $postgresParams.logging.logLockWaits }}
    log_temp_files = {{ $postgresParams.logging.logTempFiles }}
    log_line_prefix = '%m [%p] %q%u@%d '
    
    # STATISTICS
    # -----------------------------
    track_activities = on
    track_counts = on
    track_io_timing = on
    track_functions = all
    
    {{- if $postgresParams.partitioning.enabled }}
    # PARTITIONING SETTINGS
    # -----------------------------
    # Enable declarative partitioning features
    enable_partitionwise_join = on
    enable_partitionwise_aggregate = on
    {{- end }}

  # PostgreSQL client authentication configuration file
  pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    
    # "local" is for Unix domain socket connections only
    local   all             all                                     trust
    
    # IPv4 local connections:
    host    all             all             127.0.0.1/32            trust
    
    # IPv6 local connections:
    host    all             all             ::1/128                 trust
    
    # Allow replication connections from localhost, by a user with the replication privilege
    local   replication     {{ .Values.postgresql.replicationUsername }}                trust
    host    replication     {{ .Values.postgresql.replicationUsername }}    127.0.0.1/32    trust
    host    replication     {{ .Values.postgresql.replicationUsername }}    ::1/128         trust
    
    # Allow connections from all pods in the same namespace
    host    all             all             10.0.0.0/8              md5
    
    # Allow connections from the application services
    host    {{ .Values.postgresql.database }}  {{ .Values.postgresql.username }}  10.0.0.0/8    md5

  {{- if $postgresParams.pooling.enabled }}
  # PgBouncer configuration for connection pooling
  pgbouncer.ini: |
    [databases]
    * = host=localhost port=5432
    
    [pgbouncer]
    listen_addr = *
    listen_port = 6432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    
    # Connection pooling settings
    default_pool_size = {{ $postgresParams.pooling.defaultPoolSize }}
    min_pool_size = {{ $postgresParams.pooling.minPoolSize }}
    max_pool_size = {{ $postgresParams.pooling.maxPoolSize }}
    max_client_conn = {{ $postgresParams.pooling.maxClientConnections }}
    pool_mode = transaction
    
    # Log settings
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1
    
    # Connection settings
    server_reset_query = DISCARD ALL
    server_check_delay = 30
    server_check_query = SELECT 1
    server_lifetime = 3600
    server_idle_timeout = 600
    client_idle_timeout = {{ $postgresParams.pooling.connectionTimeout }}
  {{- end }}

  {{- if $postgresParams.partitioning.enabled }}
  # Partitioning initialization script
  init-partitioning.sql: |
    -- Script to set up table partitioning
    -- This will be executed during database initialization
    
    {{- range $table := $postgresParams.partitioning.tables }}
    -- Create partitioned table for {{ $table.name }}
    CREATE TABLE IF NOT EXISTS {{ $table.name }} (
      id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
      {{ $table.column }} TIMESTAMP NOT NULL,
      -- Additional columns will be added by application migrations
      created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    ) PARTITION BY {{ $table.type }} ({{ $table.column }});
    
    -- Create initial partitions
    -- Current month partition
    CREATE TABLE IF NOT EXISTS {{ $table.name }}_current_month
      PARTITION OF {{ $table.name }}
      FOR VALUES FROM (
        DATE_TRUNC('month', CURRENT_DATE)
      ) TO (
        DATE_TRUNC('month', CURRENT_DATE) + INTERVAL '1 {{ $table.interval }}'
      );
    
    -- Next month partition
    CREATE TABLE IF NOT EXISTS {{ $table.name }}_next_month
      PARTITION OF {{ $table.name }}
      FOR VALUES FROM (
        DATE_TRUNC('month', CURRENT_DATE) + INTERVAL '1 {{ $table.interval }}'
      ) TO (
        DATE_TRUNC('month', CURRENT_DATE) + INTERVAL '2 {{ $table.interval }}'
      );
    {{- end }}
  {{- end }}

  # Monitoring configuration for PostgreSQL exporter
  queries.yaml: |
    pg_replication:
      query: "{{ .Values.metrics.customMetrics.pg_replication.query }}"
      metrics:
        - lag:
            usage: "{{ .Values.metrics.customMetrics.pg_replication.metrics[0].lag.usage }}"
            description: "{{ .Values.metrics.customMetrics.pg_replication.metrics[0].lag.description }}"
    
    pg_stat_activity:
      query: |
        SELECT 
          state, 
          count(*) as count 
        FROM 
          pg_stat_activity 
        GROUP BY 
          state
      metrics:
        - state:
            usage: "LABEL"
            description: "Connection state"
        - count:
            usage: "GAUGE"
            description: "Number of connections in this state"
    
    pg_database_size:
      query: |
        SELECT 
          datname, 
          pg_database_size(datname) as size 
        FROM 
          pg_database
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - size:
            usage: "GAUGE"
            description: "Database size in bytes"