{{- if .Values.rbac.create -}}
# ServiceAccount for PostgreSQL pods
# This ServiceAccount provides identity for PostgreSQL pods within the Kubernetes cluster
# It is used for authentication and authorization with the Kubernetes API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.rbac.serviceAccountName | default (include "postgresql.fullname" .) }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
    {{- with .Values.global.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    # Helm hooks ensure ServiceAccount is created before other resources that depend on it
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    {{- with .Values.rbac.serviceAccountAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.global.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- if .Values.global.imagePullSecrets }}
imagePullSecrets:
  {{- range .Values.global.imagePullSecrets }}
  - name: {{ . }}
  {{- end }}
{{- end }}
{{- end }}