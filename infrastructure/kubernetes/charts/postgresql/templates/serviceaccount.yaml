{{- /*
serviceaccount.yaml

This template creates a Kubernetes ServiceAccount for PostgreSQL pods, providing identity for
authentication and authorization within the cluster. The ServiceAccount is configured with
appropriate annotations for cloud provider integration and secret mounting permissions.

The ServiceAccount is only created if .Values.serviceAccount.create is true.
The name of the ServiceAccount is determined by the postgresql.serviceAccountName template.
Cloud provider annotations can be specified in .Values.serviceAccount.annotations.
Image pull secrets can be specified in .Values.serviceAccount.imagePullSecrets.
Automounting of the service account token can be controlled with .Values.serviceAccount.automountServiceAccountToken.
*/ -}}

{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "postgresql.serviceAccountName" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  {{- $annotations := dict }}
  {{- if .Values.serviceAccount.annotations }}
    {{- $annotations = merge $annotations .Values.serviceAccount.annotations }}
  {{- end }}
  {{- if and .Values.global .Values.global.annotations }}
    {{- $annotations = merge $annotations .Values.global.annotations }}
  {{- end }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
{{- if .Values.serviceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml .Values.serviceAccount.imagePullSecrets | nindent 2 }}
{{- end }}
{{- if hasKey .Values.serviceAccount "automountServiceAccountToken" }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}