{{- /*
serviceaccount.yaml for OCR Service

This template creates a Kubernetes ServiceAccount specifically for the OCR Service.
It extends the common serviceaccount template with OCR Service specific configurations.

Features:
- OCR Service specific IAM role annotations for accessing S3 storage and other resources
- Proper naming and labels for the OCR Service identity
- Configured automount of API token for service authentication
- Implements security best practices for Kubernetes service accounts

This implements the authentication/authorization considerations specified in section 0.1.3
and security architecture requirements for proper service identities.

Security Considerations:
- IAM roles with least-privilege permissions for S3 access and GPU resources
- TensorFlow OCR processing requires specific permissions for GPU acceleration
- JWT authentication with RS256 algorithm as specified in section 0.1.3 and 3.8.1
- Service-to-service communications enforce strict security measures as specified in section 3.8.3
*/}}

{{- /* Set OCR Service specific values before including the common template */}}
{{- $_ := set .Values.serviceAccount "create" (default true .Values.serviceAccount.create) }}
{{- $_ := set .Values.serviceAccount "name" (default (printf "%s-ocr" (include "common.fullname" .)) .Values.serviceAccount.name) }}

{{- /* Set OCR Service specific annotations */}}
{{- if not .Values.serviceAccount.annotations }}
{{- $_ := set .Values.serviceAccount "annotations" dict }}
{{- end }}

{{- /* Add OCR Service specific annotations based on cloud provider */}}
{{- if .Values.global.cloudProvider }}
{{- if eq .Values.global.cloudProvider "aws" }}
{{- /* AWS specific annotations for S3 access and GPU resources */}}
{{- $_ := set .Values.serviceAccount.annotations "eks.amazonaws.com/role-arn" (default (printf "arn:aws:iam::%s:role/%s-ocr-service" .Values.global.awsAccountId .Release.Name) .Values.serviceAccount.iamRole) }}
{{- $_ := set .Values.serviceAccount.annotations "eks.amazonaws.com/sts-regional-endpoints" "true" }}
{{- $_ := set .Values.serviceAccount.annotations "eks.amazonaws.com/credential-expiration" "3600" }}
{{- else if eq .Values.global.cloudProvider "gcp" }}
{{- /* GCP specific annotations for GCS access and GPU resources */}}
{{- $_ := set .Values.serviceAccount.annotations "iam.gke.io/gcp-service-account" (default (printf "%s-ocr-service@%s.iam.gserviceaccount.com" .Release.Name .Values.global.gcpProjectId) .Values.serviceAccount.iamRole) }}
{{- else if eq .Values.global.cloudProvider "azure" }}
{{- /* Azure specific annotations for Blob storage access and GPU resources */}}
{{- $_ := set .Values.serviceAccount.annotations "azure.workload.identity/client-id" (default (printf "%s-ocr-service" .Release.Name) .Values.serviceAccount.iamRole) }}
{{- $_ := set .Values.serviceAccount.annotations "azure.workload.identity/tenant-id" .Values.global.azureTenantId }}
{{- end }}
{{- end }}

{{- /* Add OCR Service specific security annotations */}}
{{- $_ := set .Values.serviceAccount.annotations "security.dollarfunding.com/service" "ocr-service" }}
{{- $_ := set .Values.serviceAccount.annotations "security.dollarfunding.com/requires-gpu" "true" }}
{{- $_ := set .Values.serviceAccount.annotations "security.dollarfunding.com/data-classification" "sensitive" }}
{{- $_ := set .Values.serviceAccount.annotations "security.dollarfunding.com/s3-access" "true" }}
{{- $_ := set .Values.serviceAccount.annotations "security.dollarfunding.com/rabbitmq-access" "true" }}

{{- /* Set OCR Service specific role */}}
{{- $_ := set .Values.serviceAccount "role" "ocr-processor" }}

{{- /* Set automount token to true as OCR Service needs to authenticate with Kubernetes API */}}
{{- $_ := set .Values.serviceAccount "automountServiceAccountToken" true }}

{{- /* Include the common serviceaccount template */}}
{{- include "common.serviceaccount" . }}