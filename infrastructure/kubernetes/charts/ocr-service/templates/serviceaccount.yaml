{{- /*
ServiceAccount template for OCR Service.

This template extends the common serviceaccount template with OCR Service specific
configurations, including annotations for cloud provider IAM integration. The OCR Service
requires access to S3-compatible storage for document processing and GPU resources for
TensorFlow-based OCR processing.

Parameters:
  - .Values.serviceAccount.create: Whether to create a service account (default: true)
  - .Values.serviceAccount.name: Name of the service account (default: release name)
  - .Values.serviceAccount.annotations: Map of annotations to add to the service account
  - .Values.serviceAccount.automountServiceAccountToken: Whether to auto-mount the token (default: true)
  - .Values.serviceAccount.imagePullSecrets: List of image pull secrets to add
  - .Values.global.provider: Cloud provider (aws, azure, gcp)
  - .Values.global.awsAccountId: AWS account ID for IAM role ARN
  - .Values.global.gcpProjectId: GCP project ID for service account email
  - .Values.serviceAccount.s3AccessRole: Role ARN for S3 access (AWS-specific)
  - .Values.serviceAccount.gpuResourceRole: Role ARN for GPU resource access (AWS-specific)
*/ -}}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "common.serviceAccountName" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: ocr-service
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if eq (.Values.global.provider | default "") "aws" }}
    # Main IAM role for the service account
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.iamRole | default (printf "arn:aws:iam::%s:role/%s-%s" .Values.global.awsAccountId .Release.Namespace .Release.Name) }}
    
    # S3 access role for document storage
    {{- if .Values.serviceAccount.s3AccessRole }}
    eks.amazonaws.com/s3-access-role: {{ .Values.serviceAccount.s3AccessRole }}
    {{- end }}
    
    # GPU resource role for TensorFlow processing
    {{- if .Values.serviceAccount.gpuResourceRole }}
    eks.amazonaws.com/gpu-resource-role: {{ .Values.serviceAccount.gpuResourceRole }}
    {{- end }}
    {{- end }}
    
    {{- if eq (.Values.global.provider | default "") "azure" }}
    # Azure Workload Identity for the service account
    azure.workload.identity/client-id: {{ .Values.serviceAccount.clientId | default (printf "%s-%s" .Release.Namespace .Release.Name) }}
    
    # Azure Storage access for document storage
    {{- if .Values.serviceAccount.storageAccountName }}
    azure.workload.identity/storage-account: {{ .Values.serviceAccount.storageAccountName }}
    {{- end }}
    {{- end }}
    
    {{- if eq (.Values.global.provider | default "") "gcp" }}
    # GCP Service Account for the service account
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount | default (printf "%s-%s@%s.iam.gserviceaccount.com" .Release.Namespace .Release.Name .Values.global.gcpProjectId) }}
    
    # GCS access for document storage
    {{- if .Values.serviceAccount.gcsAccessRole }}
    iam.gke.io/gcs-access-role: {{ .Values.serviceAccount.gcsAccessRole }}
    {{- end }}
    {{- end }}
    
    # Add OCR Service specific annotations
    ocr-service/document-processing: "enabled"
    ocr-service/tensorflow-version: "2.15.0"
    ocr-service/requires-gpu: "true"
{{- if hasKey .Values.serviceAccount "automountServiceAccountToken" }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- with .Values.serviceAccount.imagePullSecrets }}
imagePullSecrets:
{{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}