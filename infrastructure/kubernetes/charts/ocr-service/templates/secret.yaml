{{- /*
OCR Service Secret template for MCA Application Processing System.

This template creates Kubernetes Secrets for the OCR Service, extending the common
secret template with OCR Service specific sensitive configuration data, including
RabbitMQ authentication, S3 access keys, and API tokens. It implements the security requirements
specified in the MCA Application Processing System technical specification, including
AES-256 encryption for sensitive data and field-level encryption for PII.

Features:
- RabbitMQ authentication credentials for message processing
- S3 access keys for secure document storage with AES-256 encryption
- API tokens for external services if needed
- Proper data encoding and security measures
- Field-level encryption for PII data

Usage:
```yaml
# values.yaml
ocrService:
  secrets:
    # RabbitMQ credentials
    rabbitmq:
      username: "ocr-service"
      password: "strong-password"
    # S3 storage credentials
    s3:
      accessKey: "your-access-key"
      secretKey: "your-secret-key"
    # Field-level encryption for PII
    encryption:
      key: "your-aes-256-encryption-key"
    # API tokens for external services
    apiTokens:
      tensorflowService: "your-api-token"
```
*/ -}}

{{- if .Values.ocrService.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ocr-service.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ocr-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: ocr-service
  annotations:
    # Add version tracking for secret rotation
    secret.kubernetes.io/version: {{ .Values.ocrService.secrets.version | default "1.0.0" | quote }}
    # Add timestamp for auditing
    secret.kubernetes.io/created-at: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
    # Add encryption annotation for sensitive data (AES-256 as specified in section 0.2.6)
    encryption.kubernetes.io/encryption-provider: aes-gcm
    security.dollarfunding.com/encryption-standard: "AES-256"
    # Add note about PII data if present (as specified in section 0.2.3)
    security.dollarfunding.com/contains-pii: "true"
    security.dollarfunding.com/field-level-encryption: "true"
    # Add environment indicator
    {{- if .Values.global }}
    {{- if .Values.global.environment }}
    environment.dollarfunding.com/name: {{ .Values.global.environment }}
    {{- end }}
    {{- end }}
type: Opaque
data:
  # RabbitMQ credentials for message processing as specified in section 0.1.3
  RABBITMQ_USERNAME: {{ .Values.ocrService.secrets.rabbitmq.username | default "ocr-service" | b64enc | quote }}
  RABBITMQ_PASSWORD: {{ .Values.ocrService.secrets.rabbitmq.password | default (randAlphaNum 16) | b64enc | quote }}
  
  # S3 storage credentials with AES-256 encryption as specified in section 0.1.3 and 3.8.2
  S3_ACCESS_KEY: {{ .Values.ocrService.secrets.s3.accessKey | b64enc | quote }}
  S3_SECRET_KEY: {{ .Values.ocrService.secrets.s3.secretKey | b64enc | quote }}
  
  # Field-level encryption key for PII as specified in section 0.2.6 and 3.8.2
  ENCRYPTION_KEY: {{ .Values.ocrService.secrets.encryption.key | default (randAlphaNum 32) | b64enc | quote }}
  
  # Python-specific configuration for TensorFlow OCR processing
  MODEL_VERSION: {{ .Values.ocrService.secrets.modelVersion | default "1.0.0" | b64enc | quote }}
  GPU_ENABLED: {{ .Values.ocrService.secrets.gpuEnabled | default "true" | b64enc | quote }}
  
  # API tokens for external services (if needed)
  {{- if .Values.ocrService.secrets.apiTokens }}
  {{- range $key, $value := .Values.ocrService.secrets.apiTokens }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}

{{- /* Include common secrets if enabled */ -}}
{{- if .Values.ocrService.includeCommonSecrets }}
{{- if .Values.secrets }}
{{- range .Values.secrets }}
{{- if or (eq .serviceType "ocr-service") (not .serviceType) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ocr-service.labels" $ | nindent 4 }}
    {{- if .labels }}
    {{- toYaml .labels | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .annotations }}
    {{- toYaml .annotations | nindent 4 }}
    {{- end }}
    # Add version tracking for secret rotation
    secret.kubernetes.io/version: {{ .annotations.version | default "1.0.0" | quote }}
    # Add timestamp for auditing
    secret.kubernetes.io/created-at: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
    # Add encryption annotation for sensitive data (AES-256 as specified in section 0.2.6)
    encryption.kubernetes.io/encryption-provider: aes-gcm
    security.dollarfunding.com/encryption-standard: "AES-256"
    # Add note about PII data if present (as specified in section 0.2.3)
    {{- if .containsPII }}
    security.dollarfunding.com/contains-pii: "true"
    security.dollarfunding.com/field-level-encryption: "true"
    {{- end }}
    # Add environment indicator
    {{- if $.Values.global }}
    {{- if $.Values.global.environment }}
    environment.dollarfunding.com/name: {{ $.Values.global.environment }}
    {{- end }}
    {{- end }}
type: {{ .type | default "Opaque" }}
{{- if .stringData }}
stringData:
  {{- toYaml .stringData | nindent 2 }}
{{- end }}
{{- if .data }}
data:
  {{- range $key, $value := .data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- /* Generate RabbitMQ credentials if enabled */ -}}
{{- if .Values.ocrService.generateRabbitMQSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ocr-service.fullname" . }}-rabbitmq-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ocr-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: messaging
  annotations:
    secret.kubernetes.io/version: "1.0.0"
    secret.kubernetes.io/created-at: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
    encryption.kubernetes.io/encryption-provider: aes-gcm
    security.dollarfunding.com/encryption-standard: "AES-256"
    {{- if .Values.global }}
    {{- if .Values.global.environment }}
    environment.dollarfunding.com/name: {{ .Values.global.environment }}
    {{- end }}
    {{- end }}
type: Opaque
data:
  # RabbitMQ credentials as specified in section 0.1.4 and 3.8.4
  RABBITMQ_HOST: {{ .Values.rabbitmq.host | default (printf "%s-rabbitmq" .Release.Name) | b64enc | quote }}
  RABBITMQ_PORT: {{ .Values.rabbitmq.port | default "5672" | b64enc | quote }}
  RABBITMQ_USERNAME: {{ .Values.rabbitmq.username | default "ocr-service" | b64enc | quote }}
  RABBITMQ_PASSWORD: {{ .Values.rabbitmq.password | default (randAlphaNum 16) | b64enc | quote }}
  RABBITMQ_VHOST: {{ .Values.rabbitmq.vhost | default "/" | b64enc | quote }}
  # Exchange and queue configuration as specified in section 0.1.4
  RABBITMQ_EXCHANGE: {{ .Values.rabbitmq.exchange | default "mca.documents" | b64enc | quote }}
  RABBITMQ_QUEUE_DATA_EXTRACTION: {{ .Values.rabbitmq.queues.dataExtraction | default "data-extraction" | b64enc | quote }}
  # TLS configuration for RabbitMQ as specified in section 3.8.4
  RABBITMQ_USE_TLS: {{ .Values.rabbitmq.useTls | default "true" | b64enc | quote }}
  RABBITMQ_TLS_VERSION: {{ .Values.rabbitmq.tlsVersion | default "TLSv1.3" | b64enc | quote }}
{{- end }}

{{- /* Generate S3 storage credentials if enabled */ -}}
{{- if .Values.ocrService.generateS3Secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ocr-service.fullname" . }}-s3-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ocr-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
  annotations:
    secret.kubernetes.io/version: "1.0.0"
    secret.kubernetes.io/created-at: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
    encryption.kubernetes.io/encryption-provider: aes-gcm
    security.dollarfunding.com/encryption-standard: "AES-256"
    {{- if .Values.global }}
    {{- if .Values.global.environment }}
    environment.dollarfunding.com/name: {{ .Values.global.environment }}
    {{- end }}
    {{- end }}
type: Opaque
data:
  # S3 storage credentials as specified in section 0.2.5 and 3.8.2
  S3_ENDPOINT: {{ .Values.s3.endpoint | default "s3.amazonaws.com" | b64enc | quote }}
  S3_REGION: {{ .Values.s3.region | default "us-east-1" | b64enc | quote }}
  S3_ACCESS_KEY: {{ .Values.s3.accessKey | default "" | b64enc | quote }}
  S3_SECRET_KEY: {{ .Values.s3.secretKey | default "" | b64enc | quote }}
  # Bucket names based on environment as specified in section 0.2.5
  {{- if .Values.global }}
  {{- if eq .Values.global.environment "production" }}
  S3_BUCKET_NAME: {{ .Values.s3.bucketName | default "mca-documents-production" | b64enc | quote }}
  {{- else if eq .Values.global.environment "staging" }}
  S3_BUCKET_NAME: {{ .Values.s3.bucketName | default "mca-documents-staging" | b64enc | quote }}
  {{- else }}
  S3_BUCKET_NAME: {{ .Values.s3.bucketName | default "mca-documents-development" | b64enc | quote }}
  {{- end }}
  {{- else }}
  S3_BUCKET_NAME: {{ .Values.s3.bucketName | default "mca-documents" | b64enc | quote }}
  {{- end }}
  # Encryption settings as specified in section 0.2.5 and 3.8.2
  S3_USE_SSL: {{ .Values.s3.useSsl | default "true" | b64enc | quote }}
  S3_ENCRYPTION: {{ .Values.s3.encryption | default "AES256" | b64enc | quote }}
  # OCR-specific S3 folder configuration
  S3_OCR_RESULTS_FOLDER: {{ .Values.s3.ocrResultsFolder | default "ocr-results" | b64enc | quote }}
  S3_PROCESSED_DOCUMENTS_FOLDER: {{ .Values.s3.processedDocumentsFolder | default "processed-documents" | b64enc | quote }}
{{- end }}