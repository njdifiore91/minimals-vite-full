{{- /*
OCR Service Secret template

This template extends the common secret template with OCR Service specific sensitive configuration data,
including RabbitMQ authentication, S3 access keys, and API tokens. It ensures that sensitive
configuration is securely stored and accessible to the OCR Service.

Features:
- RabbitMQ authentication credentials for message processing
- S3 access keys for document storage with AES-256 encryption
- TensorFlow API keys for model access (if applicable)
- API tokens for external OCR services (if applicable)
- Proper data encoding and security measures

Security considerations:
- AES-256 encryption for sensitive data as specified in section 0.2.6
- Secure storage of credentials in Kubernetes Secrets
- Field-level encryption for any PII data
*/ -}}

{{- /* Define OCR Service specific secrets */ -}}
{{- $ocrServiceSecrets := list -}}

{{- /* Main OCR Service secrets */ -}}
{{- $mainSecret := dict -}}
{{- $_ := set $mainSecret "name" "ocr-service-secrets" -}}
{{- $_ := set $mainSecret "type" "Opaque" -}}
{{- $_ := set $mainSecret "serviceType" "ocr-service" -}}
{{- $_ := set $mainSecret "annotations" (dict "version" "1.0.0") -}}

{{- /* Set data for the main secret */ -}}
{{- $secretData := dict -}}

{{- /* RabbitMQ authentication credentials */ -}}
{{- $_ := set $secretData "rabbitmq.username" ($.Values.rabbitmq.username | default "ocr_service") -}}
{{- $_ := set $secretData "rabbitmq.password" ($.Values.rabbitmq.password | default (randAlphaNum 16)) -}}

{{- /* S3 access keys for document storage */ -}}
{{- $_ := set $secretData "s3.accessKey" ($.Values.s3.accessKey | default "") -}}
{{- $_ := set $secretData "s3.secretKey" ($.Values.s3.secretKey | default "") -}}

{{- /* TensorFlow API keys if applicable */ -}}
{{- if $.Values.tensorflow -}}
{{- if $.Values.tensorflow.apiKey -}}
{{- $_ := set $secretData "tensorflow.apiKey" $.Values.tensorflow.apiKey -}}
{{- end -}}
{{- end -}}

{{- /* External OCR service API tokens if applicable */ -}}
{{- if $.Values.externalOcr -}}
{{- if $.Values.externalOcr.apiKey -}}
{{- $_ := set $secretData "externalOcr.apiKey" $.Values.externalOcr.apiKey -}}
{{- end -}}
{{- end -}}

{{- /* Add data to the main secret */ -}}
{{- $_ := set $mainSecret "data" $secretData -}}

{{- /* Add the main secret to the list */ -}}
{{- $ocrServiceSecrets = append $ocrServiceSecrets $mainSecret -}}

{{- /* Model access secret if applicable */ -}}
{{- if $.Values.modelAccess -}}
{{- $modelSecret := dict -}}
{{- $_ := set $modelSecret "name" "ocr-model-access-secrets" -}}
{{- $_ := set $modelSecret "type" "Opaque" -}}
{{- $_ := set $modelSecret "serviceType" "ocr-service" -}}
{{- $_ := set $modelSecret "annotations" (dict "version" "1.0.0") -}}

{{- /* Set data for the model access secret */ -}}
{{- $modelSecretData := dict -}}
{{- $_ := set $modelSecretData "model.accessKey" ($.Values.modelAccess.accessKey | default "") -}}
{{- $_ := set $modelSecretData "model.secretKey" ($.Values.modelAccess.secretKey | default "") -}}

{{- /* Add data to the model access secret */ -}}
{{- $_ := set $modelSecret "data" $modelSecretData -}}

{{- /* Add the model access secret to the list */ -}}
{{- $ocrServiceSecrets = append $ocrServiceSecrets $modelSecret -}}
{{- end -}}

{{- /* Set the secrets in Values for use by the common secret template */ -}}
{{- $_ := set $.Values "secrets" $ocrServiceSecrets -}}

{{- /* Include the common secret template */ -}}
{{- include "common.secret" . -}}

{{- /* Generate RabbitMQ credentials if enabled */ -}}
{{- if not $.Values.generateRabbitMQSecrets -}}
{{- $_ := set $.Values "generateRabbitMQSecrets" true -}}
{{- include "common.secret.rabbitmq" . -}}
{{- end -}}

{{- /* Generate S3 storage credentials if enabled */ -}}
{{- if not $.Values.generateS3Secrets -}}
{{- $_ := set $.Values "generateS3Secrets" true -}}
{{- include "common.secret.s3" . -}}
{{- end -}}