{{- /*
Data Service Secret template for MCA Application Processing System.

This template creates Kubernetes Secrets for the Data Service, storing sensitive configuration data
such as database credentials, API keys, encryption keys, and JWT authentication parameters.
It includes PostgreSQL credentials, Redis authentication, RabbitMQ credentials, encryption keys
for field-level encryption of PII, and JWT authentication parameters.

Features:
- PostgreSQL database credentials
- Redis authentication information
- RabbitMQ credentials
- AES-256 encryption keys for sensitive data
- JWT authentication parameters (RS256 algorithm)
- Proper data encoding and security measures
- Environment-specific configuration

Usage:
```yaml
# values.yaml
dataService:
  secrets:
    postgresql:
      username: "mca_app_user"
      password: "your-secure-password"
    redis:
      password: "your-redis-password"
    rabbitmq:
      username: "data-service"
      password: "your-rabbitmq-password"
    jwt:
      secret: "your-jwt-secret-key"
    encryption:
      key: "your-encryption-key"
      salt: "your-encryption-salt"
```
*/ -}}

{{- $fullName := include "data-service.fullname" . -}}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-service
  annotations:
    # Add version tracking for secret rotation
    secret.kubernetes.io/version: {{ .Values.dataService.secrets.version | default "1.0.0" | quote }}
    # Add timestamp for auditing
    secret.kubernetes.io/created-at: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
    # Add encryption annotation for sensitive data (AES-256 as specified in section 0.2.6)
    encryption.kubernetes.io/encryption-provider: aes-gcm
    security.dollarfunding.com/encryption-standard: "AES-256"
    # Add environment indicator
    {{- if .Values.global }}
    {{- if .Values.global.environment }}
    environment.dollarfunding.com/name: {{ .Values.global.environment }}
    {{- end }}
    {{- end }}
type: Opaque
data:
  # PostgreSQL database credentials as specified in section 0.1.2
  postgresql-username: {{ .Values.dataService.secrets.postgresql.username | default "mca_app_user" | b64enc | quote }}
  postgresql-password: {{ .Values.dataService.secrets.postgresql.password | b64enc | quote }}
  
  # Redis authentication information as specified in section 3.8.4
  redis-password: {{ .Values.dataService.secrets.redis.password | b64enc | quote }}
  
  # RabbitMQ credentials as specified in section 3.8.4
  rabbitmq-username: {{ .Values.dataService.secrets.rabbitmq.username | default "data-service" | b64enc | quote }}
  rabbitmq-password: {{ .Values.dataService.secrets.rabbitmq.password | b64enc | quote }}
  
  # JWT authentication parameters as specified in section 0.1.3
  # RS256 algorithm, Token expiry: 60 minutes, Refresh token: 7 days
  # Note: The actual token expiry is configured in the deployment.yaml
  jwt-secret: {{ .Values.dataService.secrets.jwt.secret | b64enc | quote }}
  jwt-private-key: {{ .Values.dataService.secrets.jwt.privateKey | default "" | b64enc | quote }}
  jwt-public-key: {{ .Values.dataService.secrets.jwt.publicKey | default "" | b64enc | quote }}
  
  # Encryption keys for field-level encryption of PII as specified in section 3.8.2
  # AES-256 encryption for sensitive data
  encryption-key: {{ .Values.dataService.secrets.encryption.key | b64enc | quote }}
  encryption-salt: {{ .Values.dataService.secrets.encryption.salt | b64enc | quote }}
  
  # S3 storage credentials for document access as specified in section 3.8.2
  s3-access-key: {{ .Values.dataService.secrets.s3.accessKey | default "" | b64enc | quote }}
  s3-secret-key: {{ .Values.dataService.secrets.s3.secretKey | default "" | b64enc | quote }}
  
  # API keys for external services (if needed)
  {{- if .Values.dataService.secrets.apiKeys }}
  {{- range $key, $value := .Values.dataService.secrets.apiKeys }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}

{{- /* Include common secrets if enabled */ -}}
{{- if .Values.includeCommonSecrets }}
{{- include "common.secrets" . }}
{{- end }}