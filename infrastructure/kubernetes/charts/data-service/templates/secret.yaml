{{- /*
Data Service Secret template for MCA Application Processing System.

This template creates Kubernetes Secrets specifically for the Data Service,
which is a Java Spring Boot service that manages application data and business logic.
It includes database credentials, Redis authentication, RabbitMQ credentials,
encryption keys for field-level encryption of PII, and JWT authentication parameters.

Features:
- PostgreSQL database credentials
- Redis authentication for caching
- RabbitMQ credentials for messaging
- Encryption keys for field-level encryption of PII (AES-256)
- JWT authentication parameters (RS256, 60 minutes token expiry, 7 days refresh token)

Usage:
```yaml
# values.yaml
dataService:
  secrets:
    # Database credentials
    database:
      username: "mca_app_user"
      password: "secure-password"
      name: "mca_application"
      host: "postgresql.database"
      port: "5432"
    
    # Redis authentication
    redis:
      host: "redis.cache"
      port: "6379"
      password: "redis-password"
      ttl:
        applicationData: "900"  # 15 minutes in seconds
        userSessions: "86400"  # 24 hours in seconds
    
    # RabbitMQ credentials
    rabbitmq:
      host: "rabbitmq.messaging"
      port: "5672"
      username: "mca_app_user"
      password: "rabbitmq-password"
      vhost: "/mca"
      exchange: "mca.documents"
      queues:
        documentProcessing: "document-processing"
        dataExtraction: "data-extraction"
        notification: "notification"
    
    # Encryption keys
    encryption:
      aesKey: "32-byte-aes-256-encryption-key-here"
      aesIv: "16-byte-iv-vector-for-aes-encryption"
    
    # JWT authentication
    jwt:
      privateKey: |
        -----BEGIN RSA PRIVATE KEY-----
        [Your RSA private key here]
        -----END RSA PRIVATE KEY-----
      publicKey: |
        -----BEGIN PUBLIC KEY-----
        [Your RSA public key here]
        -----END PUBLIC KEY-----
      algorithm: "RS256"
      tokenExpiry: "3600"  # 60 minutes in seconds
      refreshTokenExpiry: "604800"  # 7 days in seconds
```
*/ -}}

{{- $fullName := include "data-service.fullname" . -}}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-db-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    secret.kubernetes.io/version: "1.0.0"
    secret.kubernetes.io/created-at: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
    encryption.kubernetes.io/encryption-provider: aes-gcm
    security.dollarfunding.com/encryption-standard: "AES-256"
    security.dollarfunding.com/contains-pii: "false"
    {{- if .Values.global }}
    {{- if .Values.global.environment }}
    environment.dollarfunding.com/name: {{ .Values.global.environment }}
    {{- end }}
    {{- end }}
type: Opaque
data:
  # PostgreSQL credentials as specified in section 0.2.1
  SPRING_DATASOURCE_USERNAME: {{ .Values.dataService.secrets.database.username | default "mca_app_user" | b64enc | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.dataService.secrets.database.password | default (randAlphaNum 16) | b64enc | quote }}
  SPRING_DATASOURCE_DATABASE: {{ .Values.dataService.secrets.database.name | default "mca_application" | b64enc | quote }}
  SPRING_DATASOURCE_HOST: {{ .Values.dataService.secrets.database.host | default (printf "%s-postgresql" .Release.Name) | b64enc | quote }}
  SPRING_DATASOURCE_PORT: {{ .Values.dataService.secrets.database.port | default "5432" | b64enc | quote }}
  # Connection string for Spring Boot
  SPRING_DATASOURCE_URL: {{ printf "jdbc:postgresql://%s:%s/%s" (.Values.dataService.secrets.database.host | default (printf "%s-postgresql" .Release.Name)) (.Values.dataService.secrets.database.port | default "5432") (.Values.dataService.secrets.database.name | default "mca_application") | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-redis-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
  annotations:
    secret.kubernetes.io/version: "1.0.0"
    secret.kubernetes.io/created-at: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
    encryption.kubernetes.io/encryption-provider: aes-gcm
    security.dollarfunding.com/encryption-standard: "AES-256"
    {{- if .Values.global }}
    {{- if .Values.global.environment }}
    environment.dollarfunding.com/name: {{ .Values.global.environment }}
    {{- end }}
    {{- end }}
type: Opaque
data:
  # Redis credentials as specified in section 0.2.3 and 3.5.2
  SPRING_REDIS_HOST: {{ .Values.dataService.secrets.redis.host | default (printf "%s-redis" .Release.Name) | b64enc | quote }}
  SPRING_REDIS_PORT: {{ .Values.dataService.secrets.redis.port | default "6379" | b64enc | quote }}
  SPRING_REDIS_PASSWORD: {{ .Values.dataService.secrets.redis.password | default "" | b64enc | quote }}
  # TTL settings as specified in section 0.2.5 and 3.5.2
  SPRING_REDIS_TTL_APPLICATION_DATA: {{ .Values.dataService.secrets.redis.ttl.applicationData | default "900" | b64enc | quote }}  # 15 minutes in seconds
  SPRING_REDIS_TTL_USER_SESSIONS: {{ .Values.dataService.secrets.redis.ttl.userSessions | default "86400" | b64enc | quote }}  # 24 hours in seconds

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-rabbitmq-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: messaging
  annotations:
    secret.kubernetes.io/version: "1.0.0"
    secret.kubernetes.io/created-at: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
    encryption.kubernetes.io/encryption-provider: aes-gcm
    security.dollarfunding.com/encryption-standard: "AES-256"
    {{- if .Values.global }}
    {{- if .Values.global.environment }}
    environment.dollarfunding.com/name: {{ .Values.global.environment }}
    {{- end }}
    {{- end }}
type: Opaque
data:
  # RabbitMQ credentials as specified in section 0.1.4 and 3.5.2
  SPRING_RABBITMQ_HOST: {{ .Values.dataService.secrets.rabbitmq.host | default (printf "%s-rabbitmq" .Release.Name) | b64enc | quote }}
  SPRING_RABBITMQ_PORT: {{ .Values.dataService.secrets.rabbitmq.port | default "5672" | b64enc | quote }}
  SPRING_RABBITMQ_USERNAME: {{ .Values.dataService.secrets.rabbitmq.username | default "guest" | b64enc | quote }}
  SPRING_RABBITMQ_PASSWORD: {{ .Values.dataService.secrets.rabbitmq.password | default "guest" | b64enc | quote }}
  SPRING_RABBITMQ_VIRTUAL_HOST: {{ .Values.dataService.secrets.rabbitmq.vhost | default "/" | b64enc | quote }}
  # Exchange and queue configuration as specified in section 0.1.4
  MCA_RABBITMQ_EXCHANGE: {{ .Values.dataService.secrets.rabbitmq.exchange | default "mca.documents" | b64enc | quote }}
  MCA_RABBITMQ_QUEUE_DOCUMENT_PROCESSING: {{ .Values.dataService.secrets.rabbitmq.queues.documentProcessing | default "document-processing" | b64enc | quote }}
  MCA_RABBITMQ_QUEUE_DATA_EXTRACTION: {{ .Values.dataService.secrets.rabbitmq.queues.dataExtraction | default "data-extraction" | b64enc | quote }}
  MCA_RABBITMQ_QUEUE_NOTIFICATION: {{ .Values.dataService.secrets.rabbitmq.queues.notification | default "notification" | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-encryption-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: security
  annotations:
    secret.kubernetes.io/version: "1.0.0"
    secret.kubernetes.io/created-at: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
    encryption.kubernetes.io/encryption-provider: aes-gcm
    security.dollarfunding.com/encryption-standard: "AES-256"
    security.dollarfunding.com/contains-pii: "false"
    security.dollarfunding.com/field-level-encryption: "true"
    {{- if .Values.global }}
    {{- if .Values.global.environment }}
    environment.dollarfunding.com/name: {{ .Values.global.environment }}
    {{- end }}
    {{- end }}
type: Opaque
data:
  # Encryption keys for field-level encryption of PII as specified in section 0.2.6 and 3.8.2
  MCA_ENCRYPTION_AES_KEY: {{ .Values.dataService.secrets.encryption.aesKey | default (randAlphaNum 32) | b64enc | quote }}
  MCA_ENCRYPTION_AES_IV: {{ .Values.dataService.secrets.encryption.aesIv | default (randAlphaNum 16) | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-jwt-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: authentication
  annotations:
    secret.kubernetes.io/version: "1.0.0"
    secret.kubernetes.io/created-at: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
    encryption.kubernetes.io/encryption-provider: aes-gcm
    security.dollarfunding.com/encryption-standard: "AES-256"
    security.dollarfunding.com/contains-pii: "false"
    {{- if .Values.global }}
    {{- if .Values.global.environment }}
    environment.dollarfunding.com/name: {{ .Values.global.environment }}
    {{- end }}
    {{- end }}
type: Opaque
data:
  # JWT authentication parameters as specified in section 0.1.3 and 3.8.1
  MCA_JWT_PRIVATE_KEY: {{ .Values.dataService.secrets.jwt.privateKey | default "" | b64enc | quote }}
  MCA_JWT_PUBLIC_KEY: {{ .Values.dataService.secrets.jwt.publicKey | default "" | b64enc | quote }}
  MCA_JWT_ALGORITHM: {{ .Values.dataService.secrets.jwt.algorithm | default "RS256" | b64enc | quote }}
  MCA_JWT_TOKEN_EXPIRY: {{ .Values.dataService.secrets.jwt.tokenExpiry | default "3600" | b64enc | quote }}  # 60 minutes in seconds
  MCA_JWT_REFRESH_TOKEN_EXPIRY: {{ .Values.dataService.secrets.jwt.refreshTokenExpiry | default "604800" | b64enc | quote }}  # 7 days in seconds