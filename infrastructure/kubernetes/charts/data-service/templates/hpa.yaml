apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "data-service.fullname" . }}
  labels:
    {{- include "data-service.labels" . | nindent 4 }}
  annotations:
    description: "Horizontal Pod Autoscaler for the Data Service"
    kubernetes.io/description: "Automatically scales the Data Service based on CPU and memory utilization to handle varying loads efficiently"
    app.kubernetes.io/component: "data-service"
    app.kubernetes.io/part-of: "mca-application-processing-system"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "data-service.fullname" . }}
  # Ensure high availability with minimum 2 replicas in production
  # This supports the 99.9% system uptime requirement
  minReplicas: {{ .Values.autoscaling.minReplicas | default 2 }}
  # Allow scaling up to 10 replicas to handle peak loads
  maxReplicas: {{ .Values.autoscaling.maxReplicas | default 10 }}
  # Define metrics that trigger scaling events
  metrics:
    # Primary scaling metric: CPU utilization
    # Target 75% utilization to leave headroom for traffic spikes
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage | default 75 }}
    # Secondary scaling metric: Memory utilization
    # Important for Java applications which are memory-intensive
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage | default 80 }}
  # Advanced scaling behavior configuration
  # This prevents thrashing and ensures stable scaling operations
  behavior:
    # Scale down configuration - conservative approach to prevent premature scaling
    scaleDown:
      # Wait 5 minutes before scaling down to avoid thrashing during temporary traffic drops
      stabilizationWindowSeconds: {{ .Values.autoscaling.scaleDown.stabilizationWindowSeconds | default 300 }}
      policies:
      # Scale down by at most 10% of current pods per minute
      - type: Percent
        value: {{ .Values.autoscaling.scaleDown.percentValue | default 10 }}
        periodSeconds: {{ .Values.autoscaling.scaleDown.periodSeconds | default 60 }}
      # Scale down by at most 2 pods per minute
      - type: Pods
        value: {{ .Values.autoscaling.scaleDown.podsValue | default 2 }}
        periodSeconds: {{ .Values.autoscaling.scaleDown.periodSeconds | default 60 }}
      # Use the more conservative policy (Min) when scaling down
      selectPolicy: {{ .Values.autoscaling.scaleDown.selectPolicy | default "Min" }}
    # Scale up configuration - aggressive approach to handle traffic spikes quickly
    scaleUp:
      # No delay when scaling up to handle traffic spikes immediately
      stabilizationWindowSeconds: {{ .Values.autoscaling.scaleUp.stabilizationWindowSeconds | default 0 }}
      policies:
      # Scale up by 100% of current pods if needed (double the pods)
      - type: Percent
        value: {{ .Values.autoscaling.scaleUp.percentValue | default 100 }}
        periodSeconds: {{ .Values.autoscaling.scaleUp.periodSeconds | default 15 }}
      # Scale up by at most 4 pods per 15 seconds
      - type: Pods
        value: {{ .Values.autoscaling.scaleUp.podsValue | default 4 }}
        periodSeconds: {{ .Values.autoscaling.scaleUp.periodSeconds | default 15 }}
      # Use the more aggressive policy (Max) when scaling up
      selectPolicy: {{ .Values.autoscaling.scaleUp.selectPolicy | default "Max" }}