apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-service.fullname" . }}
  labels:
    {{- include "data-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "data-service.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "data-service.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "data-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Database configuration
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://{{ .Values.postgresql.host }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-service.fullname" . }}
                  key: postgresql-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-service.fullname" . }}
                  key: postgresql-password
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: org.postgresql.Driver
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "{{ .Values.postgresql.maxPoolSize }}"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "{{ .Values.postgresql.minIdle }}"
            
            # Redis configuration
            - name: SPRING_REDIS_HOST
              value: {{ .Values.redis.host }}
            - name: SPRING_REDIS_PORT
              value: "{{ .Values.redis.port }}"
            - name: SPRING_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-service.fullname" . }}
                  key: redis-password
            - name: SPRING_CACHE_REDIS_TIME_TO_LIVE
              value: "{{ .Values.redis.ttl.data }}"
            - name: SPRING_SESSION_REDIS_TIMEOUT
              value: "{{ .Values.redis.ttl.session }}"
            
            # RabbitMQ configuration
            - name: SPRING_RABBITMQ_HOST
              value: {{ .Values.rabbitmq.host }}
            - name: SPRING_RABBITMQ_PORT
              value: "{{ .Values.rabbitmq.port }}"
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-service.fullname" . }}
                  key: rabbitmq-username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-service.fullname" . }}
                  key: rabbitmq-password
            - name: SPRING_RABBITMQ_VIRTUAL_HOST
              value: {{ .Values.rabbitmq.vhost }}
            
            # Application configuration
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.environment }}
            - name: SERVER_PORT
              value: "8080"
            - name: MANAGEMENT_SERVER_PORT
              value: "8081"
            - name: JAVA_OPTS
              value: >-
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=200
                -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/tmp/heapdump.hprof
                -XX:+UseStringDeduplication
                -Djava.security.egd=file:/dev/./urandom
                -Dspring.output.ansi.enabled=ALWAYS
                {{ .Values.javaOpts }}
            
            # Security configuration
            - name: SPRING_SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-service.fullname" . }}
                  key: jwt-secret
            - name: SPRING_SECURITY_JWT_EXPIRATION
              value: "{{ .Values.security.jwt.expiration }}"
            - name: SPRING_SECURITY_JWT_REFRESH_EXPIRATION
              value: "{{ .Values.security.jwt.refreshExpiration }}"
            
            # Encryption configuration for PII
            - name: APP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-service.fullname" . }}
                  key: encryption-key
            
            # Logging configuration
            - name: LOGGING_LEVEL_ROOT
              value: {{ .Values.logging.level.root }}
            - name: LOGGING_LEVEL_COM_DOLLARFUNDING_MCA
              value: {{ .Values.logging.level.application }}
          
          # Resource limits and requests
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
          
          # Liveness probe - checks if the application is running
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          # Readiness probe - checks if the application is ready to serve traffic
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          
          # Startup probe - gives the application time to bootstrap
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12 # Allow 2 minutes (12 * 10s) for startup
          
          # Volume mounts
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
            - name: secrets-volume
              mountPath: /app/secrets
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
      
      # Volumes
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "data-service.fullname" . }}
        - name: secrets-volume
          secret:
            secretName: {{ include "data-service.fullname" . }}
        - name: tmp-volume
          emptyDir: {}
      
      # Node affinity - prefer nodes optimized for Java applications
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - java-optimized
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - {{ include "data-service.name" . }}
                topologyKey: "kubernetes.io/hostname"
      
      # Topology spread constraints - distribute pods across zones
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "data-service.selectorLabels" . | nindent 14 }}
      
      # Termination grace period - allow time for graceful shutdown
      terminationGracePeriodSeconds: 60