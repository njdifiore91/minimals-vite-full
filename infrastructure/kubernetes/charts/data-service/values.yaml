# Default values for data-service Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Replicaset configuration
replicaCount: 2

# Image configuration
# Java Spring Boot service as specified in section 0.1.2
image:
  repository: dollarfunding/data-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: true

# Pod security context
# Security best practices with non-root user execution as specified in section 8.5.4
podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true

# Container security context
# Security best practices with non-root user execution as specified in section 8.5.4
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

# Service configuration
service:
  type: ClusterIP
  port: 8080
  metricsPort: 8081

# Ingress configuration
ingress:
  enabled: false

# Resource requirements
# Appropriate for Java application as specified in section 8.5.4
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

# Autoscaling configuration
# Horizontal pod autoscaling based on CPU and memory metrics
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Liveness probe configuration
# Spring Boot actuator health endpoint for Kubernetes probes
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# Readiness probe configuration
# Spring Boot actuator health endpoint for Kubernetes probes
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# Java specific configuration
# JVM settings for Spring Boot application as specified in section 0.1.2
java:
  # JVM memory settings
  memory:
    # Initial heap size
    xms: "512m"
    # Maximum heap size
    xmx: "1536m"
    # Maximum metaspace size
    maxMetaspaceSize: "256m"
    # Reserved code cache size
    reservedCodeCacheSize: "256m"
  # JVM options
  options:
    - "-XX:+UseG1GC"
    - "-XX:+HeapDumpOnOutOfMemoryError"
    - "-XX:HeapDumpPath=/tmp/heapdump.hprof"
    - "-XX:+UseStringDeduplication"
    - "-Djava.security.egd=file:/dev/./urandom"
    - "-Dspring.output.ansi.enabled=ALWAYS"
    - "-Dfile.encoding=UTF-8"
    - "-Duser.timezone=UTC"

# Environment variables
env:
  # Application configuration
  APP_NAME: "data-service"
  SPRING_PROFILES_ACTIVE: "production"
  LOG_LEVEL: "INFO"
  SERVER_PORT: "8080"
  MANAGEMENT_SERVER_PORT: "8081"
  
  # Spring Boot configuration
  SPRING_APPLICATION_NAME: "data-service"
  SPRING_MAIN_BANNER_MODE: "off"
  SPRING_JPA_OPEN_IN_VIEW: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.PostgreSQL10Dialect"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
  SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_SIZE: "50"
  SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_INSERTS: "true"
  SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_UPDATES: "true"

# PostgreSQL configuration
# Primary-replica configuration as specified in section 0.1.3
postgresql:
  enabled: true
  host: "postgresql.database.svc.cluster.local"
  port: "5432"
  database: "mca_data"
  schema: "public"
  readReplicas:
    enabled: true
    count: 2
  auth:
    username: "data_service"
    existingSecret: "data-service-postgresql-credentials"
    existingSecretKey: "postgresql-password"
  connection:
    poolSize: 20
    maxLifetime: 1800000
    connectionTimeout: 30000
    idleTimeout: 600000
    leakDetectionThreshold: 60000

# RabbitMQ configuration
# Message queue system for service communication as specified in section 0.1.3
rabbitmq:
  host: "rabbitmq.messaging.svc.cluster.local"
  port: "5672"
  exchanges:
    - name: "mca.documents"
      type: "fanout"
      durable: true
      autoDelete: false
  queues:
    - name: "data-extraction"
      durable: true
      exclusive: false
      autoDelete: false
    - name: "notification"
      durable: true
      exclusive: false
      autoDelete: false
  vhost: "/"
  tls:
    enabled: true
    verify: true
  auth:
    username: "data_service"
    existingSecret: "data-service-rabbitmq-credentials"
    existingSecretKey: "rabbitmq-password"

# Redis configuration
# Caching layer with 15-minute TTL for application data as specified in section 0.2.5
redis:
  enabled: true
  host: "redis.cache.svc.cluster.local"
  port: "6379"
  # 15 minutes TTL for application data as specified in section 0.2.5
  ttl: "900"
  # 24 hours TTL for user sessions as specified in section 0.2.5
  sessionTtl: "86400"
  auth:
    enabled: true
    existingSecret: "data-service-redis-credentials"
    existingSecretKey: "redis-password"

# Network policy configuration
networkPolicy:
  enabled: true
  ingressRules:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocr-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notification-service
  egressRules:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
          namespaceSelector:
            matchLabels:
              name: database
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
          namespaceSelector:
            matchLabels:
              name: messaging
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
          namespaceSelector:
            matchLabels:
              name: cache

# Volume mounts for configuration and data
volumeMounts:
  - name: tmp-data
    mountPath: /tmp
  - name: config-volume
    mountPath: /app/config
    readOnly: true

# Volumes configuration
volumes:
  - name: tmp-data
    emptyDir: {}
  - name: config-volume
    configMap:
      name: data-service-config

# Flyway database migration configuration
flyway:
  enabled: true
  locations:
    - "classpath:db/migration"
  baselineOnMigrate: true
  validateOnMigrate: true
  outOfOrder: false
  cleanDisabled: true

# Field-level encryption for PII as specified in section 0.2.6
encryption:
  enabled: true
  algorithm: "AES-256"
  secretKey:
    existingSecret: "data-service-encryption-keys"
    existingSecretKey: "encryption-key"

# JWT authentication parameters as specified in section 0.1.3
jwt:
  algorithm: "RS256"
  tokenExpiry: 3600
  refreshTokenExpiry: 604800
  issuer: "dollarfunding-mca"
  audience: "mca-api"
  secretKey:
    existingSecret: "data-service-jwt-keys"
    existingSecretKey: "jwt-private-key"