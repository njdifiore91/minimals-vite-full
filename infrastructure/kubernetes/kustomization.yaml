# Root kustomization.yaml for MCA Application Processing System
# This file orchestrates the deployment of all Kubernetes resources for the
# Merchant Cash Advance (MCA) Application Processing System.
#
# This is the base configuration that will be extended by environment-specific overlays.
# It defines common resources, labels, annotations, and configurations that apply to all environments.
#
# The deployment follows the environment promotion flow described in section 8.2.2 of the technical specification:
# Development -> Staging -> Production
#
# Each environment has its own overlay that extends this base configuration with environment-specific settings.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Common labels applied to all resources
# These labels help with resource organization, filtering, and management
commonLabels:
  app.kubernetes.io/part-of: mca-application-system
  app.kubernetes.io/managed-by: kustomize
  app.dollarfunding.com/system: mca-processing
  app.dollarfunding.com/component: infrastructure

# Common annotations applied to all resources
# These annotations provide additional metadata for resources
commonAnnotations:
  app.kubernetes.io/version: "1.0.0"
  app.dollarfunding.com/system: "mca-processing"
  app.dollarfunding.com/contact: "devops@dollarfunding.com"
  app.dollarfunding.com/documentation: "https://github.com/dollarfunding/mca-application-system/docs"

# Resources to be applied
resources:
  # Namespace definitions - must be created first
  - namespaces/production-namespace.yaml
  - namespaces/resource-quotas.yaml
  - namespaces/rbac.yaml
  
  # Infrastructure components
  - infrastructure/rabbitmq-cluster.yaml
  - infrastructure/redis-cluster.yaml
  - infrastructure/minio-instance.yaml
  
  # Application services - defined in Helm charts
  # These will be deployed using Helm in the environment-specific overlays
  # See infrastructure/kubernetes/charts directory for the Helm charts

# Configure namespace for all resources
namespace: mca-system

# Resource ordering to ensure dependencies are created in the correct sequence
# Namespaces must be created before other resources
# Infrastructure components must be created before application services
priority:
  - pattern: "*/namespace.yaml"
    group: 0
  - pattern: "*/rbac.yaml"
    group: 1
  - pattern: "infrastructure/*.yaml"
    group: 2
  - pattern: "*/*.yaml"
    group: 3

# Configuration for environment-specific values
# These will be overridden by environment-specific overlays
configMapGenerator:
  - name: mca-system-config
    behavior: create
    literals:
      - ENVIRONMENT=base
      - LOG_LEVEL=info
      - ENABLE_MONITORING=false
      - ENABLE_GPU=false

# Reference to environment-specific configuration values
# These values are defined in the environment-specific overlays
# Each environment (development, staging, production) has its own values file
# in the config directory: values-development.yaml, values-staging.yaml, values-production.yaml

# Note: Environment-specific overlays are located in:
# - overlays/development/kustomization.yaml
# - overlays/staging/kustomization.yaml
# - overlays/production/kustomization.yaml

# Deployment instructions:
# To deploy to a specific environment, use the following command:
# kubectl apply -k overlays/{environment}
#
# For example, to deploy to the development environment:
# kubectl apply -k overlays/development
#
# To deploy to the staging environment:
# kubectl apply -k overlays/staging
#
# To deploy to the production environment:
# kubectl apply -k overlays/production