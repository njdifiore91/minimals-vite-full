# Frontend UI Build Workflow
# This workflow handles the build process for the Merchant Cash Advance (MCA) Application UI
# It performs dependency installation, code quality checks, type validation, and production builds
# Uses Vite 6.2.3 with SWC for optimized compilation and faster builds

name: UI Build

on:
  push:
    branches: [main, development]
    paths:
      - 'frontend/**'
      - '.github/workflows/ui-build.yml'
      - 'infrastructure/ci/ui/build.yml'
  pull_request:
    branches: [main, development]
    paths:
      - 'frontend/**'
      - '.github/workflows/ui-build.yml'
      - 'infrastructure/ci/ui/build.yml'
  workflow_dispatch: # Allow manual triggering

jobs:
  build:
    name: Build UI
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x] # Test with multiple Node.js versions
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
      
      - name: Setup Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version
      
      - name: Get Yarn Cache Directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      
      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.yarn-cache-dir.outputs.dir }}
            **/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
        # Do not use --ignore-optional flag as it can cause silent errors with SWC + plugins
      
      - name: Lint Code
        run: yarn lint
        env:
          ESLINT_CONFIG_PATH: eslint.config.mjs
          ESLINT_VERSION: 9.23.0
      
      - name: Type Check
        run: yarn typecheck
        env:
          TS_VERSION: 5.8.2
          TS_NODE_PROJECT: tsconfig.json
      
      - name: Build UI
        run: yarn build
        env:
          VITE_VERSION: 6.2.3
          NODE_ENV: production
          # Ensure SWC is used for production builds with proper configuration
          VITE_USE_SWC: true
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-build-${{ matrix.node-version }}
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error
      
      - name: Generate Build Report
        run: |
          echo "Build Summary" > build-report.txt
          echo "Node.js Version: ${{ matrix.node-version }}" >> build-report.txt
          echo "Yarn Version: 1.22.22" >> build-report.txt
          echo "ESLint Version: 9.23.0" >> build-report.txt
          echo "TypeScript Version: 5.8.2" >> build-report.txt
          echo "Vite Version: 6.2.3" >> build-report.txt
          echo "Build Date: $(date)" >> build-report.txt
          echo "Commit: ${{ github.sha }}" >> build-report.txt
          ls -la dist >> build-report.txt
      
      - name: Upload Build Report
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ matrix.node-version }}
          path: frontend/build-report.txt
          retention-days: 7

  validate-build:
    name: Validate Build
    needs: build
    runs-on: ubuntu-latest
    # This job validates the build output to ensure it meets requirements
    
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ui-build-20.x
          path: dist
      
      - name: Verify Build Structure
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Error: index.html not found in build output"
            exit 1
          fi
          
          if [ ! -d "dist/assets" ]; then
            echo "Error: assets directory not found in build output"
            exit 1
          fi
          
          echo "Build validation successful"
          ls -la dist
      
      - name: Check Build Size
        run: |
          TOTAL_SIZE=$(du -s -b dist | cut -f1)
          echo "Total build size: $TOTAL_SIZE bytes"
          
          # Alert if build size exceeds 5MB
          if [ $TOTAL_SIZE -gt 5242880 ]; then
            echo "Warning: Build size exceeds 5MB. Consider optimizing assets."
          fi