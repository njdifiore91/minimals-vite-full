# Production Environment Configuration for UI CI/CD Pipeline
# This file defines the configuration for the UI component's CI/CD pipeline in the production environment.
# It includes API endpoints, feature flags, resource allocations, and deployment settings specific to production.

# API Configuration
api:
  gateway_url: https://api-gateway.dollarfunding.com
  timeout_ms: 20000  # Shorter timeout for production performance
  retry_attempts: 2  # Fewer retry attempts for production reliability
  cache_ttl_minutes: 30  # Longer cache TTL for production performance

# Feature Flags (only stable features enabled for production)
feature_flags:
  automated_document_processing: true
  advanced_ocr_extraction: true
  webhook_notifications: true
  real_time_updates: true
  experimental_features: false  # Disabled in production
  beta_features: false  # Disabled in production
  debug_tools: false  # Disabled in production

# Resource Allocations (optimal for production with redundancy)
resources:
  cpu: 4
  memory: 8Gi
  storage: 20Gi
  replicas: 3  # Multiple replicas for high availability
  autoscaling:
    enabled: true
    min_replicas: 3
    max_replicas: 10
    target_cpu_utilization: 60  # Lower threshold for faster scaling

# Deployment Configuration
deployment:
  platform: vercel
  target: app.dollarfunding.com
  build_command: yarn build
  output_directory: dist
  node_version: 20.0.0
  environment_variables:
    NODE_ENV: production
    VITE_SERVER_URL: https://api-gateway.dollarfunding.com
    VITE_APP_NAME: Dollar Funding MCA
    VITE_APP_VERSION: ${APP_VERSION}
    VITE_ASSETS_DIR: /assets
  deployment_protection:
    enabled: true
    require_approval: true  # Manual approval required for production
    require_integration_tests: true

# Authentication Configuration
authentication:
  method: jwt
  jwt:
    algorithm: RS256  # As specified in technical requirements
    token_expiry_minutes: 60  # As specified in technical requirements
    refresh_token_days: 7  # As specified in technical requirements
    issuer: dollarfunding-auth
    audience: mca-application
  session_storage: sessionStorage  # As specified in technical requirements
  persistent_login: false  # Disabled for security in production

# Logging Configuration (minimal for production - ERROR and WARN only)
logging:
  level: warn
  enabled_levels:
    - error
    - warn
  disabled_levels:
    - info
    - debug
    - trace
  log_to_console: false  # Disable console logging in production
  log_to_service: true
  service_endpoint: https://logging.dollarfunding.com/api/logs

# Performance Monitoring
monitoring:
  enabled: true
  datadog:
    api_key: ${DATADOG_API_KEY}
    app_key: ${DATADOG_APP_KEY}
    service_name: mca-ui
    environment: production
  metrics:
    - response_time
    - error_rate
    - user_interactions
    - page_load_time
    - api_call_duration
    - feature_flag_usage
  alerts:
    - type: error_rate
      threshold: 0.01  # 1% error rate threshold
      window_minutes: 5
    - type: response_time
      threshold: 1000  # 1000ms response time threshold
      window_minutes: 5
    - type: availability
      threshold: 0.999  # 99.9% availability as specified in requirements
      window_minutes: 15

# UI Display Configuration
ui:
  screen_sizes:
    desktop:
      - 1920x1080
      - 1440x900
    tablet:
      - 1024x768
      - 768x1024
    mobile:
      - 375x667
      - 414x896
  theme:
    primary_color: '#0052CC'
    secondary_color: '#00875A'
    funding_colors:
      alpha:
        primary: '#0052CC'
        secondary: '#00875A'
      beta:
        primary: '#6E44FF'
        secondary: '#FF5630'
      gamma:
        primary: '#006644'
        secondary: '#DE350B'

# Approval Workflow
approval:
  required: true  # Required for production
  approvers_required: 2  # Two approvers required for production
  timeout_hours: 48
  auto_expire: true
  notify_channels:
    - email:production-team@dollarfunding.com
    - slack:#production-deployments

# Health Checks
health_checks:
  enabled: true
  endpoints:
    - path: /health
      expected_status: 200
      timeout_ms: 3000  # Shorter timeout for production
    - path: /api/status
      expected_status: 200
      timeout_ms: 3000  # Shorter timeout for production
  interval_seconds: 15  # More frequent checks in production
  failure_threshold: 2  # Lower failure threshold for production
  success_threshold: 2  # Higher success threshold for production

# Rollback Configuration
rollback:
  automatic: true  # Automatic rollback in production
  on_health_check_failure: true
  on_error_threshold: 0.05  # 5% error threshold for rollback
  max_deployment_time_minutes: 10  # Shorter deployment time for production
  notify_on_rollback: true

# Integration Tests
integration_tests:
  required: true  # Required in production
  timeout_minutes: 20
  test_command: yarn test:integration
  fail_on_error: true  # Fail on error in production
  environments:
    - staging  # Run tests in staging before production deployment
  notify_on_failure: true

# Feature Flag Gradual Rollout
feature_rollout:
  enabled: true
  strategies:
    - name: percentage_rollout
      default: true
    - name: user_targeting
      enabled: true
    - name: a_b_testing
      enabled: false  # A/B testing disabled in production
  default_rollout_percentage: 10  # Conservative default rollout percentage
  monitoring_enabled: true

# Security Configuration
security:
  content_security_policy: true
  strict_transport_security: true
  x_content_type_options: true
  x_frame_options: DENY
  referrer_policy: strict-origin-when-cross-origin
  cors:
    allowed_origins:
      - https://app.dollarfunding.com
    allowed_methods:
      - GET
      - POST
      - PUT
      - DELETE
    allowed_headers:
      - Content-Type
      - Authorization
    expose_headers:
      - Content-Length
      - X-Request-ID
    max_age_seconds: 86400
    allow_credentials: true
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    burst: 100

# Compliance and Auditing
compliance:
  audit_logging: true
  user_action_tracking: true
  sensitive_data_handling: true
  retention_period_days: 2555  # 7 years retention for financial data
  data_encryption: true