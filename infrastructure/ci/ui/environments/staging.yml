# Staging Environment Configuration for UI CI/CD Pipeline
# This file defines the configuration for the UI component's CI/CD pipeline in the staging environment.
# It includes API endpoints, feature flags, resource allocations, and deployment settings specific to staging.

# API Configuration
api:
  gateway_url: https://api-gateway.staging.dollarfunding.com
  timeout_ms: 30000
  retry_attempts: 3
  cache_ttl_minutes: 15

# Feature Flags (selected features enabled for pre-production validation)
feature_flags:
  automated_document_processing: true
  advanced_ocr_extraction: true
  webhook_notifications: true
  real_time_updates: true
  experimental_features: true
  beta_features: true
  debug_tools: true

# Resource Allocations (moderate for staging)
resources:
  cpu: 2
  memory: 4Gi
  storage: 10Gi
  replicas: 2
  autoscaling:
    enabled: true
    min_replicas: 2
    max_replicas: 5
    target_cpu_utilization: 70

# Deployment Configuration
deployment:
  platform: vercel
  target: dollarfunding-staging.vercel.app
  build_command: yarn build
  output_directory: dist
  node_version: 20.0.0
  environment_variables:
    NODE_ENV: staging
    VITE_SERVER_URL: https://api-gateway.staging.dollarfunding.com
    VITE_APP_NAME: Dollar Funding MCA (Staging)
    VITE_APP_VERSION: ${APP_VERSION}
    VITE_ASSETS_DIR: /assets
  deployment_protection:
    enabled: true
    require_approval: false
    require_integration_tests: true

# Authentication Configuration
authentication:
  method: jwt
  jwt:
    algorithm: RS256
    token_expiry_minutes: 60
    refresh_token_days: 7
    issuer: dollarfunding-auth-staging
    audience: mca-application-staging
  session_storage: sessionStorage
  persistent_login: false

# Logging Configuration (standard for staging)
logging:
  level: info
  enabled_levels:
    - error
    - warn
    - info
  disabled_levels:
    - debug
    - trace
  log_to_console: true
  log_to_service: true
  service_endpoint: https://logging.staging.dollarfunding.com/api/logs

# Performance Monitoring
monitoring:
  enabled: true
  datadog:
    api_key: ${DATADOG_API_KEY}
    app_key: ${DATADOG_APP_KEY}
    service_name: mca-ui
    environment: staging
  metrics:
    - response_time
    - error_rate
    - user_interactions
    - page_load_time
    - api_call_duration
    - feature_flag_usage

# UI Display Configuration
ui:
  screen_sizes:
    desktop:
      - 1920x1080
      - 1440x900
    tablet:
      - 1024x768
      - 768x1024
    mobile:
      - 375x667
      - 414x896
  theme:
    primary_color: '#0052CC'
    secondary_color: '#00875A'
    funding_colors:
      alpha:
        primary: '#0052CC'
        secondary: '#00875A'
      beta:
        primary: '#6E44FF'
        secondary: '#FF5630'
      gamma:
        primary: '#006644'
        secondary: '#DE350B'

# Approval Workflow
approval:
  required: false
  approvers_required: 1
  timeout_hours: 24
  auto_expire: true
  notify_channels:
    - email:staging-team@dollarfunding.com
    - slack:#staging-deployments

# Health Checks
health_checks:
  enabled: true
  endpoints:
    - path: /health
      expected_status: 200
      timeout_ms: 5000
    - path: /api/status
      expected_status: 200
      timeout_ms: 5000
  interval_seconds: 30
  failure_threshold: 3
  success_threshold: 1

# Rollback Configuration
rollback:
  automatic: true
  on_health_check_failure: true
  on_error_threshold: 0.1
  max_deployment_time_minutes: 15
  notify_on_rollback: true

# Integration Tests
integration_tests:
  required: true
  timeout_minutes: 30
  test_command: yarn test:integration
  fail_on_error: true
  environments:
    - staging
  notify_on_failure: true

# Feature Flag Gradual Rollout
feature_rollout:
  enabled: true
  strategies:
    - name: percentage_rollout
      default: true
    - name: user_targeting
      enabled: true
    - name: a_b_testing
      enabled: true
  default_rollout_percentage: 50
  monitoring_enabled: true