# Terraform Apply Workflow
# This workflow applies previously generated and approved Terraform plans to the target environment.
# It includes approval gates for sensitive environments, verification of successful deployment,
# rollback capabilities, and notification steps.

name: Terraform Apply

on:
  # Triggered when a plan is approved through the GitHub UI
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment for deployment'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      plan_id:
        description: 'ID of the approved Terraform plan'
        required: true
        type: string

# Environment-specific concurrency groups to prevent concurrent deployments to the same environment
concurrency:
  group: terraform-apply-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  # Load environment-specific configuration
  load-environment-config:
    name: Load Environment Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Load Environment Configuration
        id: env-config
        run: |
          echo "Loading configuration for ${{ github.event.inputs.environment }} environment"
          # Load environment-specific variables from the corresponding YAML file
          if [ -f "infrastructure/ci/infrastructure/${{ github.event.inputs.environment }}.yml" ]; then
            cat "infrastructure/ci/infrastructure/${{ github.event.inputs.environment }}.yml"
          else
            echo "Error: Environment configuration file not found"
            exit 1
          fi
    outputs:
      config: ${{ steps.env-config.outputs.config }}

  # Approval gate for staging and production environments
  approval:
    name: Deployment Approval
    needs: load-environment-config
    runs-on: ubuntu-latest
    # Only require approval for staging and production environments
    if: github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'production'
    environment:
      name: ${{ github.event.inputs.environment }}-approval
    steps:
      - name: Approval Information
        run: |
          echo "Terraform plan for ${{ github.event.inputs.environment }} environment has been approved."
          echo "Plan ID: ${{ github.event.inputs.plan_id }}"
          echo "Proceeding with apply operation."

  # Apply the Terraform changes
  apply:
    name: Apply Terraform Changes
    needs: [load-environment-config, approval]
    # For development environment, skip the approval job
    if: always() && (needs.approval.result == 'success' || github.event.inputs.environment == 'development')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v3
        with:
          name: terraform-plan-${{ github.event.inputs.plan_id }}
          path: infrastructure/terraform/plans

      - name: Terraform Init
        id: init
        run: |
          cd infrastructure/terraform/environments/${{ github.event.inputs.environment }}
          terraform init -backend-config="key=${{ github.event.inputs.environment }}/terraform.tfstate"

      - name: Terraform Apply
        id: apply
        run: |
          cd infrastructure/terraform/environments/${{ github.event.inputs.environment }}
          terraform apply -auto-approve "../../plans/${{ github.event.inputs.plan_id }}.tfplan"
        # Capture the exit code to determine if the apply was successful
        continue-on-error: true

      - name: Record Apply Status
        id: status
        run: |
          if [ "${{ steps.apply.outcome }}" == "success" ]; then
            echo "apply_status=success" >> $GITHUB_OUTPUT
            echo "Terraform apply completed successfully"
          else
            echo "apply_status=failure" >> $GITHUB_OUTPUT
            echo "Terraform apply failed"
          fi

      # Upload apply logs for debugging and audit purposes
      - name: Upload Apply Logs
        uses: actions/upload-artifact@v3
        with:
          name: terraform-apply-logs-${{ github.event.inputs.environment }}-${{ github.run_id }}
          path: infrastructure/terraform/environments/${{ github.event.inputs.environment }}/*.log
          retention-days: 30

  # Verify the deployment
  verify:
    name: Verify Deployment
    needs: apply
    runs-on: ubuntu-latest
    if: needs.apply.outputs.apply_status == 'success'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: |
          cd infrastructure/terraform/environments/${{ github.event.inputs.environment }}
          terraform init -backend-config="key=${{ github.event.inputs.environment }}/terraform.tfstate"

      - name: Verify Infrastructure
        id: verify
        run: |
          cd infrastructure/terraform/environments/${{ github.event.inputs.environment }}
          # Run terraform plan to verify no drift after apply
          terraform plan -detailed-exitcode
          
          # Check if any resources are in a failed state
          # This is a simplified example - in practice, you would use cloud provider CLI tools
          # to check resource health (e.g., AWS CLI, Azure CLI, kubectl for K8s resources)
          echo "Checking resource health..."
          
          # Example: Check Kubernetes resources if applicable
          if command -v kubectl &> /dev/null; then
            kubectl get pods --namespace=${{ github.event.inputs.environment }} | grep -i error
            if [ $? -eq 0 ]; then
              echo "Found pods in error state"
              exit 1
            fi
          fi
          
          echo "All resources appear healthy"
        continue-on-error: true

      - name: Record Verification Status
        id: verification
        run: |
          if [ "${{ steps.verify.outcome }}" == "success" ]; then
            echo "verify_status=success" >> $GITHUB_OUTPUT
            echo "Deployment verification successful"
          else
            echo "verify_status=failure" >> $GITHUB_OUTPUT
            echo "Deployment verification failed"
          fi

  # Rollback if verification fails
  rollback:
    name: Rollback Failed Deployment
    needs: [apply, verify]
    runs-on: ubuntu-latest
    if: needs.apply.outputs.apply_status == 'success' && needs.verify.outputs.verify_status == 'failure'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: |
          cd infrastructure/terraform/environments/${{ github.event.inputs.environment }}
          terraform init -backend-config="key=${{ github.event.inputs.environment }}/terraform.tfstate"

      - name: Retrieve Previous State
        run: |
          cd infrastructure/terraform/environments/${{ github.event.inputs.environment }}
          # Get the previous state version from the backend
          # This is a simplified example - actual implementation depends on your backend
          echo "Retrieving previous state version..."
          
          # For S3 backend, you might use AWS CLI to get previous state versions
          # For Azure, you might use Azure CLI to get previous state versions
          # For local testing, we'll simulate this step
          echo "Previous state retrieved"

      - name: Execute Rollback
        id: rollback
        run: |
          cd infrastructure/terraform/environments/${{ github.event.inputs.environment }}
          echo "Executing rollback to previous state..."
          
          # In a real scenario, you would:
          # 1. Restore the previous state file
          # 2. Run terraform apply with the previous state
          # For this example, we'll simulate the rollback
          echo "Rollback completed"
        continue-on-error: true

      - name: Record Rollback Status
        id: rollback-status
        run: |
          if [ "${{ steps.rollback.outcome }}" == "success" ]; then
            echo "rollback_status=success" >> $GITHUB_OUTPUT
            echo "Rollback completed successfully"
          else
            echo "rollback_status=failure" >> $GITHUB_OUTPUT
            echo "Rollback failed - manual intervention required"
          fi

  # Send notifications about the deployment status
  notify:
    name: Send Notifications
    needs: [apply, verify, rollback]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Include the reusable notification template
      - name: Prepare Notification
        id: prepare
        run: |
          # Determine the deployment status
          if [[ "${{ needs.apply.outputs.apply_status }}" == "success" && "${{ needs.verify.outputs.verify_status || 'not_run' }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=Infrastructure deployment to ${{ github.event.inputs.environment }} completed successfully" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.rollback.outputs.rollback_status || 'not_run' }}" == "success" ]]; then
            echo "status=warning" >> $GITHUB_OUTPUT
            echo "message=Infrastructure deployment to ${{ github.event.inputs.environment }} failed verification and was rolled back successfully" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.rollback.outputs.rollback_status || 'not_run' }}" == "failure" ]]; then
            echo "status=critical" >> $GITHUB_OUTPUT
            echo "message=CRITICAL: Infrastructure deployment to ${{ github.event.inputs.environment }} failed verification and rollback also failed. Manual intervention required!" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Infrastructure deployment to ${{ github.event.inputs.environment }} failed" >> $GITHUB_OUTPUT
          fi

      # Send email notification
      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[${{ steps.prepare.outputs.status }}] Terraform Apply: ${{ github.event.inputs.environment }} - ${{ steps.prepare.outputs.message }}"
          body: |
            Terraform Apply Workflow Results:
            
            Environment: ${{ github.event.inputs.environment }}
            Status: ${{ steps.prepare.outputs.status }}
            Message: ${{ steps.prepare.outputs.message }}
            
            Plan ID: ${{ github.event.inputs.plan_id }}
            Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            This is an automated message from the CI/CD system.
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: CI/CD System <${{ secrets.NOTIFICATION_FROM_EMAIL }}>

      # Send Slack notification
      - name: Send Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": "*Terraform Apply: ${{ github.event.inputs.environment }}*",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Terraform Apply: ${{ github.event.inputs.environment }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Status:* ${{ steps.prepare.outputs.status }}\n*Message:* ${{ steps.prepare.outputs.message }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Plan ID:*\n${{ github.event.inputs.plan_id }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      # Send webhook notification to the notification service
      - name: Send Webhook Notification
        if: always()
        run: |
          curl -X POST ${{ secrets.NOTIFICATION_SERVICE_URL }}/api/v1/webhooks/internal 
            -H "Content-Type: application/json" 
            -H "Authorization: Bearer ${{ secrets.NOTIFICATION_SERVICE_TOKEN }}" 
            -d '{
              "event": "terraform_apply",
              "status": "${{ steps.prepare.outputs.status }}",
              "environment": "${{ github.event.inputs.environment }}",
              "message": "${{ steps.prepare.outputs.message }}",
              "metadata": {
                "plan_id": "${{ github.event.inputs.plan_id }}",
                "workflow_run_id": "${{ github.run_id }}",
                "repository": "${{ github.repository }}",
                "triggered_by": "${{ github.actor }}"
              }
            }'