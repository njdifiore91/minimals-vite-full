# Production Environment Configuration for Terraform Workflows
# This file defines the production-specific settings for infrastructure deployments
# for the Merchant Cash Advance (MCA) Application Processing System

name: "MCA Production Infrastructure Deployment"

# Environment identification
environment:
  name: "production"
  display_name: "Production"
  description: "Live production environment with high-availability configuration for MCA Application Processing System"
  priority: "critical"
  tags:
    Environment: "Production"
    Application: "MCA"
    CostCenter: "FIN-123"
    DataClassification: "Confidential"
    BusinessUnit: "Funding"
  performance_requirements:
    application_processing_time_seconds: 300 # 5 minutes
    automation_rate_percentage: 93
    data_extraction_accuracy_percentage: 99
    system_uptime_percentage: 99.9

# Backend state configuration
backend:
  type: "s3"
  config:
    bucket: "mca-terraform-state-production"
    key: "infrastructure/terraform.tfstate"
    region: "us-east-1"
    encrypt: true
    dynamodb_table: "mca-terraform-locks-production"
    role_arn: "arn:aws:iam::123456789012:role/TerraformProductionRole"
    # Strict state locking to prevent concurrent modifications
    lock_timeout: 1800 # 30 minutes

# Resource sizing for production workloads
resource_sizing:
  # PostgreSQL 14 database configuration
  database:
    engine: "postgres"
    engine_version: "14"
    instance_class: "db.m5.2xlarge"
    storage_gb: 500
    read_replicas: 2
    multi_az: true
    backup_retention_days: 30
    deletion_protection: true
    performance_insights_enabled: true
    performance_insights_retention_period: 7
  
  # Redis 7.0 configuration
  redis:
    engine_version: "7.0"
    node_type: "cache.m5.large"
    num_shards: 3
    replicas_per_shard: 2
    automatic_failover: true
    multi_az: true
    transit_encryption_enabled: true
    at_rest_encryption_enabled: true
    ttl_settings:
      application_data_minutes: 15
      user_sessions_hours: 24
  
  # RabbitMQ configuration
  rabbitmq:
    instance_type: "mq.m5.large"
    deployment_mode: "CLUSTER_MULTI_AZ"
    engine_version: "3.10.20"
    nodes: 3
    storage_type: "EBS"
    message_exchanges:
      - name: "mca.documents"
        type: "fanout"
    message_queues:
      - name: "document-processing"
        durable: true
      - name: "data-extraction"
        durable: true
      - name: "notification"
        durable: true
  
  # Kubernetes configuration
  kubernetes:
    version: "1.26"
    node_groups:
      standard:
        instance_type: "m5.2xlarge"
        min_size: 3
        max_size: 10
        desired_size: 5
      gpu:
        # GPU-enabled nodes for OCR service
        instance_type: "g4dn.xlarge"
        min_size: 2
        max_size: 5
        desired_size: 2
    namespaces:
      - name: "production"
        resource_quota:
          cpu: "80"
          memory: "160Gi"
          pods: "100"
        limit_ranges:
          default_request:
            cpu: "100m"
            memory: "256Mi"
          default_limit:
            cpu: "1000m"
            memory: "1Gi"

# Approval process configuration
approval:
  required: true
  approvers_required: 2
  approver_groups:
    - "infrastructure-admins"
    - "security-team"
    - "release-managers"
  timeout_minutes: 1440 # 24 hours
  auto_expire: true
  approval_policy:
    enforce_separation_of_duties: true
    require_security_review: true
    require_compliance_check: true

# Security settings
security:
  encryption:
    kms_key_id: "arn:aws:kms:us-east-1:123456789012:key/abcd1234-ef56-gh78-ij90-klmnopqrstuv"
    encrypt_all_volumes: true
    encrypt_all_s3_buckets: true
    encryption_algorithm: "AES-256"
    field_level_encryption_enabled: true
  network:
    vpc_flow_logs_enabled: true
    waf_enabled: true
    ddos_protection: true
    cors_configuration:
      allowed_origins:
        - "https://app.dollarfunding.com"
      allowed_methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "OPTIONS"
      allowed_headers:
        - "Authorization"
        - "Content-Type"
      expose_headers:
        - "Content-Length"
        - "X-Request-Id"
      max_age_seconds: 3600
  compliance:
    enable_cloudtrail: true
    enable_config: true
    enable_guardduty: true
    enable_security_hub: true
    data_retention_years: 7
  access_control:
    enforce_mfa: true
    enforce_iam_permissions_boundary: true
    restrict_public_access: true
    jwt_authentication:
      algorithm: "RS256"
      token_expiry_minutes: 60
      refresh_token_expiry_days: 7
    rate_limiting:
      enabled: true
      requests_per_minute: 300
      burst: 500

# Validation steps
validation:
  pre_apply:
    - name: "terraform-validate"
      timeout_minutes: 10
      required: true
    - name: "tfsec-security-scan"
      timeout_minutes: 15
      required: true
      fail_on_severity: "HIGH"
    - name: "cost-estimation"
      timeout_minutes: 10
      threshold_percentage: 10
      required: true
    - name: "policy-compliance-check"
      timeout_minutes: 15
      required: true
    - name: "terraform-plan-review"
      timeout_minutes: 60
      required: true
      approvers_required: 2
  
  post_apply:
    - name: "infrastructure-tests"
      timeout_minutes: 30
      required: true
    - name: "connectivity-tests"
      timeout_minutes: 15
      required: true
      services_to_check:
        - "postgresql"
        - "rabbitmq"
        - "redis"
        - "s3"
    - name: "security-scan"
      timeout_minutes: 20
      required: true
      scan_types:
        - "network"
        - "iam"
        - "encryption"
    - name: "performance-baseline"
      timeout_minutes: 45
      required: true
      metrics_to_capture:
        - "database_connection_time"
        - "api_response_time"
        - "message_processing_time"
    - name: "smoke-tests"
      timeout_minutes: 30
      required: true
      test_paths:
        - "infrastructure/tests/smoke/production/"

# Notification channels
notifications:
  channels:
    - type: "email"
      recipients:
        - "infrastructure-team@dollarfunding.com"
        - "security-team@dollarfunding.com"
        - "operations@dollarfunding.com"
    - type: "slack"
      channel: "#prod-infrastructure-alerts"
    - type: "pagerduty"
      service_id: "P123456"
      escalation_policy: "EP123456"
  
  events:
    - name: "plan_created"
      channels: ["slack"]
      priority: "info"
    - name: "approval_required"
      channels: ["email", "slack"]
      priority: "high"
    - name: "approval_timeout_warning"
      channels: ["email", "slack"]
      priority: "high"
    - name: "apply_started"
      channels: ["slack"]
      priority: "info"
    - name: "apply_completed"
      channels: ["email", "slack"]
      priority: "normal"
    - name: "apply_failed"
      channels: ["email", "slack", "pagerduty"]
      priority: "critical"
    - name: "validation_failed"
      channels: ["email", "slack", "pagerduty"]
      priority: "critical"

# Disaster recovery configuration
disaster_recovery:
  state_backup:
    enabled: true
    frequency: "daily"
    retention_days: 90
  cross_region_replication:
    enabled: true
    regions:
      - "us-west-2"
  recovery_time_objective_minutes: 30
  recovery_point_objective_minutes: 15
  database_recovery:
    point_in_time_recovery_enabled: true
    automated_snapshots_enabled: true
    snapshot_frequency_hours: 4
  s3_buckets:
    - name: "mca-documents-production"
      versioning_enabled: true
      replication_enabled: true
      lifecycle_rules:
        transition_to_ia_days: 90
        transition_to_glacier_days: 365
        expiration_days: 2555 # 7 years retention

# Monitoring and observability with Datadog
monitoring:
  provider: "datadog"
  metrics_namespace: "MCA/Production/Infrastructure"
  dashboard_name: "MCA-Production-Infrastructure"
  metrics_collection_interval: 10
  log_retention_days: 30
  apm_enabled: true
  custom_metrics:
    - name: "application_processing_time"
      unit: "Seconds"
      description: "Time to process an application end-to-end"
    - name: "ocr_accuracy"
      unit: "Percent"
      description: "Accuracy of OCR data extraction"
    - name: "queue_depth"
      unit: "Count"
      description: "Number of messages in processing queues"
    - name: "api_response_time"
      unit: "Milliseconds"
      description: "API response time for requests"
  alarms:
    - name: "HighCpuUtilization"
      threshold: 80
      evaluation_periods: 3
      period_seconds: 60
      statistic: "Average"
      comparison_operator: "GreaterThanThreshold"
      treat_missing_data: "missing"
      alarm_actions: ["slack", "pagerduty"]
    - name: "HighDatabaseConnections"
      threshold: 90
      evaluation_periods: 3
      period_seconds: 60
      statistic: "Average"
      comparison_operator: "GreaterThanThreshold"
      treat_missing_data: "missing"
      alarm_actions: ["slack", "pagerduty"]

# Deployment windows
deployment_windows:
  allowed_days:
    - "Monday"
    - "Tuesday"
    - "Wednesday"
    - "Thursday"
  allowed_hours:
    start: "09:00"
    end: "16:00"
  timezone: "America/New_York"
  blackout_dates:
    - "2025-01-01" # New Year's Day
    - "2025-12-25" # Christmas
    - "2025-12-26" # Day after Christmas
  emergency_override_requires_approval: true
  emergency_approvers_required: 3
  change_freeze_periods:
    - name: "End of Year"
      start_date: "2025-12-15"
      end_date: "2026-01-05"
    - name: "Financial Quarter End"
      start_date: "2025-03-25"
      end_date: "2025-04-05"
      start_date: "2025-06-25"
      end_date: "2025-07-05"
      start_date: "2025-09-25"
      end_date: "2025-10-05"
  notification_before_window_closes_minutes: 60