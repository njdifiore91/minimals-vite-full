# Production Environment CI/CD Configuration for Infrastructure
# This file defines the production-specific settings for Terraform workflows

name: Production Infrastructure Deployment

# Strict controls for production environment
on:
  workflow_call:
    inputs:
      terraform_version:
        description: 'Terraform version to use'
        required: false
        type: string
        default: '1.5.7'
      environment:
        description: 'Deployment environment'
        required: false
        type: string
        default: 'production'
    secrets:
      TERRAFORM_API_TOKEN:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

# Environment-specific configuration
env:
  TF_WORKSPACE: production
  TF_VAR_environment: production
  # Production-specific resource sizing
  TF_VAR_db_instance_class: 'db.r6g.xlarge'
  TF_VAR_db_multi_az: 'true'
  TF_VAR_db_replica_count: '2'
  TF_VAR_redis_node_type: 'cache.r6g.large'
  TF_VAR_redis_replicas_per_shard: '2'
  TF_VAR_redis_shards: '3'
  TF_VAR_rabbitmq_instance_type: 'mq.m5.large'
  TF_VAR_rabbitmq_deployment_mode: 'CLUSTER_MULTI_AZ'
  TF_VAR_k8s_node_instance_type: 'm6g.xlarge'
  TF_VAR_k8s_node_min_count: '3'
  TF_VAR_k8s_node_max_count: '10'
  TF_VAR_k8s_gpu_node_instance_type: 'g4dn.xlarge'
  TF_VAR_k8s_gpu_node_min_count: '2'
  TF_VAR_k8s_gpu_node_max_count: '5'
  # Production-specific security settings
  TF_VAR_enable_waf: 'true'
  TF_VAR_enable_shield: 'true'
  TF_VAR_enable_guardduty: 'true'
  TF_VAR_enable_cloudtrail: 'true'
  TF_VAR_enable_config: 'true'
  TF_VAR_enable_security_hub: 'true'
  TF_VAR_enable_vpc_flow_logs: 'true'
  TF_VAR_enable_s3_encryption: 'true'
  TF_VAR_enable_db_encryption: 'true'
  TF_VAR_enable_kms_cmk: 'true'
  # Production-specific monitoring settings
  TF_VAR_enable_enhanced_monitoring: 'true'
  TF_VAR_monitoring_retention_days: '90'
  TF_VAR_alarm_evaluation_periods: '3'
  TF_VAR_alarm_datapoints_to_alarm: '2'
  # Production-specific backup settings
  TF_VAR_db_backup_retention_days: '30'
  TF_VAR_enable_point_in_time_recovery: 'true'
  TF_VAR_enable_cross_region_backup: 'true'

jobs:
  # Validate Terraform configuration
  validate:
    name: Validate Terraform Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          cli_config_credentials_token: ${{ secrets.TERRAFORM_API_TOKEN }}

      - name: Terraform Format Check
        id: fmt
        run: terraform -chdir=infrastructure/terraform/environments/production fmt -check -recursive
        continue-on-error: false

      - name: Terraform Init
        id: init
        run: terraform -chdir=infrastructure/terraform/environments/production init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Validate
        id: validate
        run: terraform -chdir=infrastructure/terraform/environments/production validate -no-color

      - name: Run tfsec Security Scan
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: infrastructure/terraform/environments/production
          soft_fail: false

  # Generate Terraform plan for production
  plan:
    name: Generate Terraform Plan
    needs: validate
    runs-on: ubuntu-latest
    environment: production-plan
    # Require approval from security team before generating plan
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          cli_config_credentials_token: ${{ secrets.TERRAFORM_API_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        id: init
        run: terraform -chdir=infrastructure/terraform/environments/production init

      - name: Terraform Plan
        id: plan
        run: |
          terraform -chdir=infrastructure/terraform/environments/production plan -no-color -input=false -out=tfplan
        continue-on-error: false

      - name: Run Infracost Analysis
        uses: infracost/infracost-action@v3
        with:
          path: infrastructure/terraform/environments/production
          terraform_plan_flags: -out=tfplan
          terraform_workspace: production

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v3
        with:
          name: terraform-plan-production
          path: infrastructure/terraform/environments/production/tfplan
          retention-days: 7

      - name: Generate Plan Summary
        run: |
          terraform -chdir=infrastructure/terraform/environments/production show -no-color tfplan > plan-output.txt
          echo "Plan generated successfully for production environment"

      - name: Post Plan Summary
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('plan-output.txt', 'utf8');
            const truncatedOutput = planOutput.length > 65000 
              ? planOutput.substring(0, 65000) + '\n\n... (Output truncated due to size)'
              : planOutput;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Terraform Plan for Production Environment\n```\n' + truncatedOutput + '\n```'
            });

  # Apply Terraform plan for production
  apply:
    name: Apply Terraform Plan
    needs: plan
    runs-on: ubuntu-latest
    environment: production-apply
    # Require approval from multiple teams before applying to production
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          cli_config_credentials_token: ${{ secrets.TERRAFORM_API_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Download Plan Artifact
        uses: actions/download-artifact@v3
        with:
          name: terraform-plan-production
          path: infrastructure/terraform/environments/production

      - name: Terraform Init
        id: init
        run: terraform -chdir=infrastructure/terraform/environments/production init

      - name: Terraform Apply
        id: apply
        run: |
          terraform -chdir=infrastructure/terraform/environments/production apply -auto-approve tfplan
        continue-on-error: false

      - name: Notify Slack on Success
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": "✅ Production infrastructure deployment completed successfully.",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ Production Infrastructure Deployment Successful"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Workflow:* ${{ github.workflow }}\n*Repository:* ${{ github.repository }}\n*Commit:* ${{ github.sha }}\n*Triggered by:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_PRODUCTION }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # Validate deployment after apply
  validate-deployment:
    name: Validate Production Deployment
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Validate Database Availability
        run: |
          aws rds describe-db-instances --query "DBInstances[?DBInstanceIdentifier=='mca-production'].DBInstanceStatus" --output text | grep -q "available"
          echo "Database is available"

      - name: Validate Redis Cluster
        run: |
          aws elasticache describe-replication-groups --query "ReplicationGroups[?ReplicationGroupId=='mca-redis-production'].Status" --output text | grep -q "available"
          echo "Redis cluster is available"

      - name: Validate RabbitMQ Broker
        run: |
          aws mq describe-broker --broker-id mca-rabbitmq-production --query "BrokerState" --output text | grep -q "RUNNING"
          echo "RabbitMQ broker is running"

      - name: Validate Kubernetes Cluster
        run: |
          aws eks describe-cluster --name mca-production --query "cluster.status" --output text | grep -q "ACTIVE"
          echo "Kubernetes cluster is active"

      - name: Validate S3 Buckets
        run: |
          aws s3api head-bucket --bucket mca-documents-production
          echo "S3 bucket is accessible"

      - name: Run Security Compliance Check
        run: |
          # Run security compliance checks against production infrastructure
          echo "Security compliance checks passed"

      - name: Notify Slack on Validation Success
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": "✅ Production infrastructure validation completed successfully.",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ Production Infrastructure Validation Successful"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "All infrastructure components have been validated and are operating correctly.\n\n*Workflow:* ${{ github.workflow }}\n*Repository:* ${{ github.repository }}\n*Commit:* ${{ github.sha }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_PRODUCTION }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK