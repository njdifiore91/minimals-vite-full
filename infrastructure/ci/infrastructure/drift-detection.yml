# Drift Detection Workflow
# 
# This workflow runs scheduled Terraform plan operations across all environments
# to detect infrastructure drift - differences between the desired state (defined in code)
# and the actual state of the infrastructure. It helps identify unauthorized manual changes,
# ensures infrastructure integrity, and validates compliance with security baselines.
#
# Schedule: Runs monthly and can be triggered manually
# Environments: Development, Staging, Production
# Notifications: Alerts for detected drift via email, Slack, and webhooks
# Remediation: Options for automatic or manual correction of drift

name: Infrastructure Drift Detection

on:
  # Run monthly on the 1st at 2:00 AM UTC
  schedule:
    - cron: '0 2 1 * *'
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check for drift'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - development
          - staging
          - production
      auto_remediate:
        description: 'Automatically remediate detected drift'
        required: false
        default: false
        type: boolean

# Use concurrency to prevent multiple drift detection runs
concurrency:
  group: drift-detection-${{ github.event.inputs.environment || 'scheduled' }}
  cancel-in-progress: false

env:
  TF_LOG: INFO
  DRIFT_REPORT_DIR: drift-reports

jobs:
  # Prepare the drift detection process
  prepare:
    name: Prepare Drift Detection
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.set-environments.outputs.environments }}
      timestamp: ${{ steps.set-timestamp.outputs.timestamp }}
    
    steps:
      - name: Determine environments to check
        id: set-environments
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "all" || "${{ github.event.inputs.environment }}" == "" ]]; then
            echo "environments=[\"development\", \"staging\", \"production\"]" >> $GITHUB_OUTPUT
          else
            echo "environments=[\"${{ github.event.inputs.environment }}\"]" >> $GITHUB_OUTPUT
          fi
      
      - name: Set timestamp for reports
        id: set-timestamp
        run: echo "timestamp=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

  # Detect drift in each environment
  detect-drift:
    name: Detect Drift - ${{ matrix.environment }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ${{ fromJson(needs.prepare.outputs.environments) }}
      # Don't fail the entire workflow if one environment fails
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      
      - name: Load environment configuration
        uses: ./.github/actions/load-env-config
        with:
          environment: ${{ matrix.environment }}
      
      - name: Initialize Terraform
        id: init
        run: |
          cd infrastructure/terraform/environments/${{ matrix.environment }}
          terraform init -input=false
      
      - name: Run Terraform Plan for drift detection
        id: plan
        run: |
          mkdir -p ${{ env.DRIFT_REPORT_DIR }}
          cd infrastructure/terraform/environments/${{ matrix.environment }}
          
          # Run plan and capture output
          terraform plan -input=false -detailed-exitcode -out=tfplan > ../../${{ env.DRIFT_REPORT_DIR }}/${{ matrix.environment }}-plan.txt 2>&1
          PLAN_EXIT_CODE=$?
          
          # Check for drift based on exit code
          # 0 = No changes
          # 1 = Error
          # 2 = Changes present
          if [ $PLAN_EXIT_CODE -eq 0 ]; then
            echo "No drift detected in ${{ matrix.environment }} environment"
            echo "drift_detected=false" >> $GITHUB_OUTPUT
            echo "DRIFT_DETECTED=false" >> $GITHUB_ENV
          elif [ $PLAN_EXIT_CODE -eq 2 ]; then
            echo "Drift detected in ${{ matrix.environment }} environment"
            echo "drift_detected=true" >> $GITHUB_OUTPUT
            echo "DRIFT_DETECTED=true" >> $GITHUB_ENV
            
            # Generate JSON plan output for further analysis
            terraform show -json tfplan > ../../${{ env.DRIFT_REPORT_DIR }}/${{ matrix.environment }}-plan.json
          else
            echo "Error running Terraform plan for ${{ matrix.environment }} environment"
            exit 1
          fi
      
      - name: Run compliance checks
        if: steps.plan.outputs.drift_detected == 'true'
        id: compliance
        run: |
          cd infrastructure/terraform/environments/${{ matrix.environment }}
          
          # Run tfsec for security compliance checking
          tfsec . --format=json > ../../${{ env.DRIFT_REPORT_DIR }}/${{ matrix.environment }}-compliance.json
          
          # Check if any high severity issues were found
          HIGH_SEVERITY_COUNT=$(jq '.results | map(select(.severity == "HIGH" or .severity == "CRITICAL")) | length' ../../${{ env.DRIFT_REPORT_DIR }}/${{ matrix.environment }}-compliance.json)
          
          if [ $HIGH_SEVERITY_COUNT -gt 0 ]; then
            echo "High severity compliance issues detected in ${{ matrix.environment }} environment"
            echo "compliance_issues=true" >> $GITHUB_OUTPUT
            echo "COMPLIANCE_ISSUES=true" >> $GITHUB_ENV
          else
            echo "No high severity compliance issues detected in ${{ matrix.environment }} environment"
            echo "compliance_issues=false" >> $GITHUB_OUTPUT
            echo "COMPLIANCE_ISSUES=false" >> $GITHUB_ENV
          fi
      
      - name: Analyze drift changes
        if: steps.plan.outputs.drift_detected == 'true'
        id: analyze
        run: |
          cd ${{ env.DRIFT_REPORT_DIR }}
          
          # Extract resource changes from the plan JSON
          jq -r '.resource_changes | map({address: .address, action: .change.actions[]}) | group_by(.action) | map({action: .[0].action, count: length, resources: map(.address)})' ${{ matrix.environment }}-plan.json > ${{ matrix.environment }}-analysis.json
          
          # Determine if changes are critical
          # Consider changes to IAM, security groups, or database resources as critical
          CRITICAL_RESOURCES=$(jq -r '.resource_changes | map(select(.address | test("iam|security_group|database|rds|kms"))) | length' ${{ matrix.environment }}-plan.json)
          
          if [ $CRITICAL_RESOURCES -gt 0 ]; then
            echo "Critical resource changes detected in ${{ matrix.environment }} environment"
            echo "critical_changes=true" >> $GITHUB_OUTPUT
            echo "CRITICAL_CHANGES=true" >> $GITHUB_ENV
          else
            echo "No critical resource changes detected in ${{ matrix.environment }} environment"
            echo "critical_changes=false" >> $GITHUB_OUTPUT
            echo "CRITICAL_CHANGES=false" >> $GITHUB_ENV
          fi
      
      - name: Upload drift reports
        uses: actions/upload-artifact@v3
        with:
          name: drift-reports-${{ matrix.environment }}-${{ needs.prepare.outputs.timestamp }}
          path: ${{ env.DRIFT_REPORT_DIR }}
          retention-days: 90
      
      # Include the notification template for alerting
      - name: Send drift notification
        if: steps.plan.outputs.drift_detected == 'true'
        uses: ./.github/actions/notification
        with:
          template: drift-detection
          environment: ${{ matrix.environment }}
          severity: ${{ steps.analyze.outputs.critical_changes == 'true' && 'critical' || 'warning' }}
          title: "Infrastructure Drift Detected in ${{ matrix.environment }}"
          message: |
            Infrastructure drift has been detected in the ${{ matrix.environment }} environment.
            ${{ steps.analyze.outputs.critical_changes == 'true' && '⚠️ CRITICAL RESOURCES AFFECTED ⚠️' || 'Resources affected:' }}
            
            See the attached drift report for details.
          channels: email,slack,webhook
          recipients: infrastructure-team,security-team${{ steps.analyze.outputs.critical_changes == 'true' && ',management' || '' }}

  # Summarize drift detection results across all environments
  summarize:
    name: Summarize Drift Results
    needs: [prepare, detect-drift]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Download all drift reports
        uses: actions/download-artifact@v3
        with:
          path: ${{ env.DRIFT_REPORT_DIR }}
      
      - name: Generate summary report
        id: summary
        run: |
          echo "# Infrastructure Drift Detection Summary" > drift-summary.md
          echo "Run Date: $(date)" >> drift-summary.md
          echo "" >> drift-summary.md
          echo "## Environment Status" >> drift-summary.md
          echo "" >> drift-summary.md
          
          # Process each environment's results
          TOTAL_ENVIRONMENTS=0
          DRIFTED_ENVIRONMENTS=0
          CRITICAL_ENVIRONMENTS=0
          COMPLIANCE_ISSUES=0
          
          for ENV in ${{ join(fromJson(needs.prepare.outputs.environments), ' ') }}; do
            TOTAL_ENVIRONMENTS=$((TOTAL_ENVIRONMENTS + 1))
            
            # Check if drift was detected for this environment
            if [ -f "${{ env.DRIFT_REPORT_DIR }}/drift-reports-${ENV}-${{ needs.prepare.outputs.timestamp }}/${{ env.DRIFT_REPORT_DIR }}/${ENV}-plan.json" ]; then
              DRIFTED_ENVIRONMENTS=$((DRIFTED_ENVIRONMENTS + 1))
              
              # Check for critical changes
              if [ -f "${{ env.DRIFT_REPORT_DIR }}/drift-reports-${ENV}-${{ needs.prepare.outputs.timestamp }}/${{ env.DRIFT_REPORT_DIR }}/${ENV}-analysis.json" ]; then
                CRITICAL_COUNT=$(jq -r '.resource_changes | map(select(.address | test("iam|security_group|database|rds|kms"))) | length' "${{ env.DRIFT_REPORT_DIR }}/drift-reports-${ENV}-${{ needs.prepare.outputs.timestamp }}/${{ env.DRIFT_REPORT_DIR }}/${ENV}-plan.json" || echo "0")
                
                if [ "$CRITICAL_COUNT" -gt 0 ]; then
                  CRITICAL_ENVIRONMENTS=$((CRITICAL_ENVIRONMENTS + 1))
                  echo "### ${ENV} - ⚠️ DRIFT DETECTED WITH CRITICAL CHANGES ⚠️" >> drift-summary.md
                else
                  echo "### ${ENV} - ⚠️ DRIFT DETECTED" >> drift-summary.md
                fi
                
                # Add change summary
                echo "" >> drift-summary.md
                echo "Changes detected:" >> drift-summary.md
                jq -r '.[] | "- " + .action + ": " + (.count | tostring) + " resources"' "${{ env.DRIFT_REPORT_DIR }}/drift-reports-${ENV}-${{ needs.prepare.outputs.timestamp }}/${{ env.DRIFT_REPORT_DIR }}/${ENV}-analysis.json" >> drift-summary.md
                echo "" >> drift-summary.md
              else
                echo "### ${ENV} - ⚠️ DRIFT DETECTED (analysis unavailable)" >> drift-summary.md
                echo "" >> drift-summary.md
              fi
              
              # Check for compliance issues
              if [ -f "${{ env.DRIFT_REPORT_DIR }}/drift-reports-${ENV}-${{ needs.prepare.outputs.timestamp }}/${{ env.DRIFT_REPORT_DIR }}/${ENV}-compliance.json" ]; then
                HIGH_SEVERITY_COUNT=$(jq '.results | map(select(.severity == "HIGH" or .severity == "CRITICAL")) | length' "${{ env.DRIFT_REPORT_DIR }}/drift-reports-${ENV}-${{ needs.prepare.outputs.timestamp }}/${{ env.DRIFT_REPORT_DIR }}/${ENV}-compliance.json" || echo "0")
                
                if [ "$HIGH_SEVERITY_COUNT" -gt 0 ]; then
                  COMPLIANCE_ISSUES=$((COMPLIANCE_ISSUES + 1))
                  echo "**Compliance Issues:** $HIGH_SEVERITY_COUNT high/critical severity findings" >> drift-summary.md
                  echo "" >> drift-summary.md
                fi
              fi
            else
              echo "### ${ENV} - ✅ NO DRIFT DETECTED" >> drift-summary.md
              echo "" >> drift-summary.md
            fi
          done
          
          # Add summary statistics
          echo "## Summary Statistics" > drift-summary-stats.md
          echo "" >> drift-summary-stats.md
          echo "- Total environments checked: $TOTAL_ENVIRONMENTS" >> drift-summary-stats.md
          echo "- Environments with drift: $DRIFTED_ENVIRONMENTS" >> drift-summary-stats.md
          echo "- Environments with critical changes: $CRITICAL_ENVIRONMENTS" >> drift-summary-stats.md
          echo "- Environments with compliance issues: $COMPLIANCE_ISSUES" >> drift-summary-stats.md
          echo "" >> drift-summary-stats.md
          
          # Insert stats at the top of the summary
          cat drift-summary.md >> drift-summary-stats.md
          mv drift-summary-stats.md drift-summary.md
          
          # Set outputs for next steps
          echo "drifted_environments=$DRIFTED_ENVIRONMENTS" >> $GITHUB_OUTPUT
          echo "critical_environments=$CRITICAL_ENVIRONMENTS" >> $GITHUB_OUTPUT
          echo "compliance_issues=$COMPLIANCE_ISSUES" >> $GITHUB_OUTPUT
      
      - name: Upload summary report
        uses: actions/upload-artifact@v3
        with:
          name: drift-summary-${{ needs.prepare.outputs.timestamp }}
          path: drift-summary.md
          retention-days: 90
      
      - name: Send summary notification
        if: steps.summary.outputs.drifted_environments != '0'
        uses: ./.github/actions/notification
        with:
          template: drift-summary
          severity: ${{ steps.summary.outputs.critical_environments != '0' && 'critical' || 'warning' }}
          title: "Infrastructure Drift Summary Report"
          message: |
            Infrastructure drift detection completed.
            
            - Environments with drift: ${{ steps.summary.outputs.drifted_environments }}
            - Environments with critical changes: ${{ steps.summary.outputs.critical_environments }}
            - Environments with compliance issues: ${{ steps.summary.outputs.compliance_issues }}
            
            See the attached summary report for details.
          channels: email,slack,webhook
          recipients: infrastructure-team,security-team${{ steps.summary.outputs.critical_environments != '0' && ',management' || '' }}
          attachment: drift-summary.md

  # Remediate drift if auto-remediation is enabled
  remediate:
    name: Remediate Drift - ${{ matrix.environment }}
    needs: [prepare, detect-drift, summarize]
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.auto_remediate == 'true' && 
      needs.detect-drift.outputs.drift_detected == 'true' && 
      needs.detect-drift.outputs.critical_changes != 'true'
    strategy:
      matrix:
        environment: ${{ fromJson(needs.prepare.outputs.environments) }}
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      
      - name: Load environment configuration
        uses: ./.github/actions/load-env-config
        with:
          environment: ${{ matrix.environment }}
      
      - name: Download drift plan
        uses: actions/download-artifact@v3
        with:
          name: drift-reports-${{ matrix.environment }}-${{ needs.prepare.outputs.timestamp }}
          path: ${{ env.DRIFT_REPORT_DIR }}
      
      - name: Initialize Terraform
        run: |
          cd infrastructure/terraform/environments/${{ matrix.environment }}
          terraform init -input=false
      
      - name: Apply Terraform changes to remediate drift
        id: apply
        run: |
          cd infrastructure/terraform/environments/${{ matrix.environment }}
          
          # Apply the changes to remediate drift
          terraform apply -input=false -auto-approve
          
          # Run another plan to verify drift is resolved
          terraform plan -input=false -detailed-exitcode
          VERIFICATION_EXIT_CODE=$?
          
          if [ $VERIFICATION_EXIT_CODE -eq 0 ]; then
            echo "Drift successfully remediated in ${{ matrix.environment }} environment"
            echo "remediation_successful=true" >> $GITHUB_OUTPUT
          else
            echo "Drift remediation failed or incomplete in ${{ matrix.environment }} environment"
            echo "remediation_successful=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Send remediation notification
        uses: ./.github/actions/notification
        with:
          template: drift-remediation
          environment: ${{ matrix.environment }}
          severity: info
          title: "Infrastructure Drift Remediated in ${{ matrix.environment }}"
          message: |
            Infrastructure drift has been automatically remediated in the ${{ matrix.environment }} environment.
            
            Remediation status: ${{ steps.apply.outputs.remediation_successful == 'true' && '✅ Successful' || '❌ Failed' }}
          channels: email,slack,webhook
          recipients: infrastructure-team