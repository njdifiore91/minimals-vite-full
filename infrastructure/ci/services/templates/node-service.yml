# Node.js Microservice CI/CD Template
# Used for Email Service and Notification Service
# Requires Node.js v22.x (LTS)
#
# This template defines a standardized CI/CD workflow for Node.js microservices with the following features:
# - Support for both npm and yarn package managers with automatic detection
# - Code quality checks with ESLint and TypeScript
# - Unit testing with Jest and coverage reporting
# - Vulnerability scanning for dependencies and container images
# - Multi-stage Docker builds to minimize image size
# - Kubernetes deployment with Helm charts
# - Post-deployment health checks with service-specific validations

name: Node.js Service CI/CD Pipeline

on:
  push:
    branches: [ main, development ]
    paths:
      - 'email-service/**'
      - 'notification-service/**'
      - 'infrastructure/ci/services/templates/node-service.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'email-service/**'
      - 'notification-service/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - email-service
          - notification-service

# Global environment variables
env:
  NODE_VERSION: '22.x'
  NPM_VERSION: '10.2.4'
  YARN_VERSION: '4.1.0'
  REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
  TRIVY_SEVERITY: 'HIGH,CRITICAL'
  # Default to npm, but allow services to use yarn if they have a yarn.lock file
  PACKAGE_MANAGER: 'npm'

jobs:
  # Determine which service directory has changed
  changes:
    name: Detect Service Changes
    runs-on: ubuntu-latest
    outputs:
      email_service: ${{ steps.filter.outputs.email_service }}
      notification_service: ${{ steps.filter.outputs.notification_service }}
      service_name: ${{ steps.set-service.outputs.service_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Filter for service changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            email_service:
              - 'email-service/**'
            notification_service:
              - 'notification-service/**'

      - name: Set service name from changes
        id: set-service
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "service_name=${{ github.event.inputs.service }}" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.filter.outputs.email_service }}" == "true" ]]; then
            echo "service_name=email-service" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.filter.outputs.notification_service }}" == "true" ]]; then
            echo "service_name=notification-service" >> $GITHUB_OUTPUT
          else
            echo "No service changes detected"
            exit 1
          fi

  # Code quality and testing
  quality:
    name: Code Quality & Testing
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(format('["%s"]', needs.changes.outputs.service_name)) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Determine package manager
        id: pkg-manager
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f "yarn.lock" ]; then
            echo "Using Yarn package manager"
            echo "manager=yarn" >> $GITHUB_OUTPUT
          else
            echo "Using NPM package manager"
            echo "manager=npm" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies with npm
        if: steps.pkg-manager.outputs.manager == 'npm'
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Install dependencies with yarn
        if: steps.pkg-manager.outputs.manager == 'yarn'
        working-directory: ${{ matrix.service }}
        run: |
          corepack enable
          yarn install --immutable

      - name: Lint with ESLint
        working-directory: ${{ matrix.service }}
        run: |
          if [ "${{ steps.pkg-manager.outputs.manager }}" == "yarn" ]; then
            yarn lint
          else
            npm run lint
          fi
        env:
          NODE_OPTIONS: --max-old-space-size=4096 # Increase memory for TypeScript linting

      - name: Type check with TypeScript
        working-directory: ${{ matrix.service }}
        run: |
          if [ "${{ steps.pkg-manager.outputs.manager }}" == "yarn" ]; then
            yarn type-check
          else
            npm run type-check
          fi
        env:
          NODE_OPTIONS: --max-old-space-size=4096 # Increase memory for TypeScript checking

      - name: Test with Jest
        working-directory: ${{ matrix.service }}
        run: |
          if [ "${{ steps.pkg-manager.outputs.manager }}" == "yarn" ]; then
            yarn test --coverage
          else
            npm test -- --coverage
          fi
        env:
          NODE_ENV: test
          # Add any environment variables needed for testing

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ${{ matrix.service }}/coverage/lcov.info
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage

      - name: Check for npm vulnerabilities
        if: steps.pkg-manager.outputs.manager == 'npm'
        working-directory: ${{ matrix.service }}
        run: npm audit --production --audit-level=high
        continue-on-error: true # Don't fail the build, but report vulnerabilities

      - name: Check for yarn vulnerabilities
        if: steps.pkg-manager.outputs.manager == 'yarn'
        working-directory: ${{ matrix.service }}
        run: yarn npm audit --environment production --level high
        continue-on-error: true # Don't fail the build, but report vulnerabilities

  # Build and package
  build:
    name: Build and Package
    needs: [changes, quality]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(format('["%s"]', needs.changes.outputs.service_name)) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Determine package manager
        id: pkg-manager
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f "yarn.lock" ]; then
            echo "Using Yarn package manager"
            echo "manager=yarn" >> $GITHUB_OUTPUT
          else
            echo "Using NPM package manager"
            echo "manager=npm" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies with npm
        if: steps.pkg-manager.outputs.manager == 'npm'
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Install dependencies with yarn
        if: steps.pkg-manager.outputs.manager == 'yarn'
        working-directory: ${{ matrix.service }}
        run: |
          corepack enable
          yarn install --immutable

      - name: Build application
        working-directory: ${{ matrix.service }}
        run: |
          if [ "${{ steps.pkg-manager.outputs.manager }}" == "yarn" ]; then
            yarn build
          else
            npm run build
          fi
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.service }}-build
          path: ${{ matrix.service }}/dist
          retention-days: 7

      # Set up Docker Buildx for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Extract version from package.json
      - name: Extract version
        id: version
        working-directory: ${{ matrix.service }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}-${COMMIT_SHA}" >> $GITHUB_OUTPUT

      # Build and push Docker image with multi-stage build
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ steps.version.outputs.version }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            NODE_ENV=production
            PACKAGE_MANAGER=${{ steps.pkg-manager.outputs.manager }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.service }}:buildcache,mode=max

      # Scan container image for vulnerabilities
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ steps.version.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ env.TRIVY_SEVERITY }}

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Deploy to Kubernetes
  deploy:
    name: Deploy to Kubernetes
    needs: [changes, build]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'staging' || 'development') }}
    strategy:
      matrix:
        service: ${{ fromJson(format('["%s"]', needs.changes.outputs.service_name)) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Extract version from previous job
      - name: Set environment variables
        run: |
          echo "ENVIRONMENT=${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'staging' || 'development') }}" >> $GITHUB_ENV

      # Configure kubectl
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      # Install Helm
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.3'

      # Deploy with Helm
      - name: Deploy to Kubernetes with Helm
        run: |
          # Get the image tag from the build job
          IMAGE_TAG=$(git rev-parse --short HEAD)
          SERVICE_VERSION=$(node -p "require('./${{ matrix.service }}/package.json').version")
          
          # Deploy using Helm
          helm upgrade --install ${{ matrix.service }}-${{ env.ENVIRONMENT }} \
            ./infrastructure/kubernetes/charts/${{ matrix.service }} \
            --namespace ${{ env.ENVIRONMENT }} \
            --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ matrix.service }} \
            --set image.tag=${SERVICE_VERSION}-${IMAGE_TAG} \
            --set environment=${{ env.ENVIRONMENT }} \
            --values ./infrastructure/kubernetes/charts/${{ matrix.service }}/values-${{ env.ENVIRONMENT }}.yaml

      # Verify deployment
      - name: Verify deployment
        run: |
          # Wait for deployment to be ready
          kubectl rollout status deployment/${{ matrix.service }}-${{ env.ENVIRONMENT }} -n ${{ env.ENVIRONMENT }} --timeout=300s
          
          # Wait for service to stabilize
          sleep 15
          
          # Check if service is healthy with Node.js specific health check
          kubectl exec deploy/${{ matrix.service }}-${{ env.ENVIRONMENT }} -n ${{ env.ENVIRONMENT }} -- curl -s http://localhost:8000/health | grep -q '"status":"UP"'
          
          # Check for specific service health indicators
          if [[ "${{ matrix.service }}" == "email-service" ]]; then
            # Verify email service can connect to IMAP
            kubectl exec deploy/${{ matrix.service }}-${{ env.ENVIRONMENT }} -n ${{ env.ENVIRONMENT }} -- curl -s http://localhost:8000/health/imap | grep -q '"status":"connected"'
          elif [[ "${{ matrix.service }}" == "notification-service" ]]; then
            # Verify notification service can connect to RabbitMQ
            kubectl exec deploy/${{ matrix.service }}-${{ env.ENVIRONMENT }} -n ${{ env.ENVIRONMENT }} -- curl -s http://localhost:8000/health/rabbitmq | grep -q '"status":"connected"'
          fi
          
          echo "Deployment of ${{ matrix.service }} to ${{ env.ENVIRONMENT }} completed successfully"