# Document Service Deployment Workflow
# This workflow deploys the Document Service to Kubernetes environments
# It supports development, staging, and production deployments with appropriate approvals and validations

name: Deploy Document Service

on:
  # Triggered when the build workflow completes successfully
  workflow_run:
    workflows: ["Build Document Service"]
    types:
      - completed
    branches:
      - development
      - main
      - 'v*.*.*'
  
  # Manual trigger with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      version:
        description: 'Container Image Version (leave empty for latest)'
        required: false
        type: string

# Environment variables used across jobs
env:
  SERVICE_NAME: document-service
  CHART_PATH: infrastructure/kubernetes/charts/document-service
  REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
  DEFAULT_TIMEOUT: 300s

# Concurrency group to ensure only one deployment per environment
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Determine the deployment environment based on branch or manual input
  determine-environment:
    name: Determine Deployment Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/development ]]; then
            echo "environment=development" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" =~ refs/tags/v.* ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

      - name: Set Version
        id: set-version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ ! -z "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" =~ refs/tags/v.* ]]; then
            # Extract version from tag
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          else
            # Use latest commit hash as version
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "version=${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

  # Deploy to the selected environment
  deploy:
    name: Deploy to ${{ needs.determine-environment.outputs.environment }}
    runs-on: ubuntu-latest
    needs: determine-environment
    environment: ${{ needs.determine-environment.outputs.environment }}
    
    # Production deployments require approval
    permissions:
      contents: read
      id-token: write # For OIDC authentication with cloud providers

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
          context: ${{ needs.determine-environment.outputs.environment }}

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set Image Version
        id: image-version
        run: |
          VERSION=${{ needs.determine-environment.outputs.version }}
          echo "Using image version: ${VERSION}"
          echo "IMAGE_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Deploy with Helm
        id: helm-deploy
        run: |
          NAMESPACE=${{ needs.determine-environment.outputs.environment }}
          
          # Get values file for environment
          VALUES_FILE="${CHART_PATH}/values-${NAMESPACE}.yaml"
          if [ ! -f "$VALUES_FILE" ]; then
            VALUES_FILE="${CHART_PATH}/values.yaml"
          fi
          
          # Deploy with Helm
          helm upgrade --install ${SERVICE_NAME} ${CHART_PATH} 
            --namespace ${NAMESPACE} 
            --create-namespace 
            --values ${VALUES_FILE} 
            --set image.tag=${IMAGE_VERSION} 
            --set environment=${NAMESPACE} 
            --timeout ${DEFAULT_TIMEOUT} 
            --atomic 
            --wait

      - name: Verify Deployment
        id: verify
        run: |
          NAMESPACE=${{ needs.determine-environment.outputs.environment }}
          
          echo "Waiting for deployment to be ready..."
          kubectl rollout status deployment/${SERVICE_NAME} -n ${NAMESPACE} --timeout=${DEFAULT_TIMEOUT}
          
          echo "Checking pod status..."
          kubectl get pods -l app.kubernetes.io/name=${SERVICE_NAME} -n ${NAMESPACE}
          
          echo "Checking service endpoints..."
          kubectl get endpoints ${SERVICE_NAME} -n ${NAMESPACE}
          
          echo "Checking application health..."
          # Get the pod name
          POD_NAME=$(kubectl get pods -l app.kubernetes.io/name=${SERVICE_NAME} -n ${NAMESPACE} -o jsonpath="{.items[0].metadata.name}")
          
          # Check health endpoint
          kubectl exec ${POD_NAME} -n ${NAMESPACE} -- curl -s http://localhost:5000/health | grep -q '"status":"ok"'
          
          if [ $? -eq 0 ]; then
            echo "Health check passed!"
          else
            echo "Health check failed!"
            exit 1
          fi

  # Send deployment notifications
  notify:
    name: Send Deployment Notifications
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Notification Status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ Document Service deployed successfully to ${{ needs.determine-environment.outputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Document Service deployment to ${{ needs.determine-environment.outputs.environment }} failed" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "${{ steps.status.outputs.message }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.status.outputs.message }}\n*Environment:* ${{ needs.determine-environment.outputs.environment }}\n*Version:* ${{ needs.determine-environment.outputs.version }}\n*Triggered by:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Send Email Notification
        if: needs.determine-environment.outputs.environment == 'production'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[${{ steps.status.outputs.status }}] Document Service Deployment to Production"
          body: |
            Document Service Deployment Status: ${{ steps.status.outputs.status }}
            
            Environment: ${{ needs.determine-environment.outputs.environment }}
            Version: ${{ needs.determine-environment.outputs.version }}
            Triggered by: ${{ github.actor }}
            
            View the workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: CI/CD Pipeline <${{ secrets.SMTP_USERNAME }}>

      - name: Send Webhook Notification
        uses: distributhor/workflow-webhook@v3
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          data: '{"service": "document-service", "environment": "${{ needs.determine-environment.outputs.environment }}", "version": "${{ needs.determine-environment.outputs.version }}", "status": "${{ steps.status.outputs.status }}", "triggered_by": "${{ github.actor }}", "workflow_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'