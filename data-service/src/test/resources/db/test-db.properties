# Test Database Configuration for Data Service Microservice

# H2 Database Configuration
# Using in-memory mode for fast test execution without external dependencies
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Console for debugging during test development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate Configuration
# Automatically create and drop the schema for each test execution
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization
# Always execute schema.sql and data.sql for consistent test data
spring.sql.init.mode=always
spring.sql.init.platform=h2

# Disable Flyway for test execution to prevent conflicts with SQL scripts
spring.flyway.enabled=false

# Logging Configuration for SQL statements during testing
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Connection Pool Configuration for Tests
# Minimal pool size for tests to improve performance
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=TestHikariPool

# Transaction Configuration
# Use default isolation level for tests
spring.transaction.default-timeout=30s