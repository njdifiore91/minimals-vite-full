# Encryption Configuration for MCA Application
# IMPORTANT: These values should be stored securely and not committed to version control

# Primary encryption keys
# In production, these should be set via environment variables ENCRYPTION_SECRET and ENCRYPTION_SALT
# The values below are examples only and should be replaced with secure random values
encryption.secret=ENC_SECRET_PLACEHOLDER
encryption.salt=ENC_SALT_PLACEHOLDER

# Key rotation configuration
# Enable this when rotating encryption keys to maintain access to previously encrypted data
encryption.key-rotation.enabled=false
encryption.key-rotation.previous-secret=PREV_SECRET_PLACEHOLDER
encryption.key-rotation.previous-salt=PREV_SALT_PLACEHOLDER

# Multi-tenant encryption configuration
# Enable this if different tenants need separate encryption keys
encryption.multi-tenant.enabled=false

# Example tenant-specific keys
# encryption.tenant.tenant1.secret=TENANT1_SECRET_PLACEHOLDER
# encryption.tenant.tenant1.salt=TENANT1_SALT_PLACEHOLDER
# encryption.tenant.tenant2.secret=TENANT2_SECRET_PLACEHOLDER
# encryption.tenant.tenant2.salt=TENANT2_SALT_PLACEHOLDER