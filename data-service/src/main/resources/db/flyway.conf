# Flyway Configuration for MCA Data Service
# This file configures the Flyway database migration tool for the MCA application

# Database Connection
flyway.url=jdbc:postgresql://${FLYWAY_HOST:localhost}:${FLYWAY_PORT:5432}/${FLYWAY_DATABASE:mca_db}
flyway.user=${FLYWAY_USER:postgres}
flyway.password=${FLYWAY_PASSWORD:postgres}
flyway.driver=org.postgresql.Driver

# Migration Scripts Location
# Points to the SQL migration scripts in the migrations subfolder
flyway.locations=filesystem:src/main/resources/db/migrations

# Schema Management
flyway.schemas=public
flyway.defaultSchema=public
flyway.createSchemas=true

# Migration Table
# Configures the name of the schema history table that tracks applied migrations
flyway.table=flyway_schema_history

# Baseline Configuration
# Allows Flyway to work with existing databases by establishing a baseline version
flyway.baselineOnMigrate=true
flyway.baselineVersion=0

# Validation
# Validates migration scripts before applying them
flyway.validateOnMigrate=true
flyway.validateMigrationNaming=true

# Transaction Behavior
# Ensures all migrations run within a single transaction for atomicity
flyway.group=true
flyway.outOfOrder=false
flyway.mixed=false

# Error Handling
flyway.ignoreMissingMigrations=false
flyway.ignoreIgnoredMigrations=false
flyway.ignoreFutureMigrations=false
flyway.cleanDisabled=true

# Placeholders for environment-specific values
# These can be replaced at runtime with actual values
flyway.placeholders.environment=${ENVIRONMENT:development}
flyway.placeholders.maxPoolSize=${MAX_POOL_SIZE:10}
flyway.placeholders.minIdle=${MIN_IDLE:5}

# Logging
flyway.loggers=slf4j

# Connection Pool Settings
# Configures the connection pool used by Flyway
flyway.connectRetries=3
flyway.connectRetriesInterval=10
flyway.initSql=SET statement_timeout = 300000; -- 5 minutes timeout for migrations

# Read Replica Configuration
# These settings are used when working with read replicas
flyway.placeholders.readReplicasEnabled=${READ_REPLICAS_ENABLED:false}
flyway.placeholders.replicaUrls=${REPLICA_URLS:}

# PostgreSQL-specific settings
flyway.postgresql.transactional.lock=true