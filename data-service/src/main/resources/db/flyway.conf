# Flyway Configuration for MCA Data Service
# This file configures the Flyway database migration tool for PostgreSQL 14

# Database Connection
# These values will be replaced by environment-specific values at runtime
flyway.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
flyway.user=${POSTGRES_USER}
flyway.password=${POSTGRES_PASSWORD}

# PostgreSQL 14 specific settings
flyway.driver=org.postgresql.Driver

# Migration Scripts Location
# Points to the migrations subfolder where SQL scripts are stored
flyway.locations=classpath:db/migrations

# Schema Management
# The schema where Flyway will manage migrations
flyway.schemas=public

# Migration Table
# Table used by Flyway to track migration history
flyway.table=flyway_schema_history

# Baseline Configuration
# Used when applying Flyway to an existing database
flyway.baselineOnMigrate=false
flyway.baselineVersion=0

# Transaction Support
# Ensures all migrations run within a transaction for atomicity
flyway.group=true
flyway.outOfOrder=false
flyway.validateOnMigrate=true

# Error Handling
# Controls behavior when migration failures occur
flyway.cleanDisabled=true  # Prevents accidental database cleanup in production
flyway.ignoreMissingMigrations=false
flyway.ignoreIgnoredMigrations=true
flyway.ignoreFutureMigrations=false

# Placeholders
# Can be used in SQL scripts for environment-specific values
flyway.placeholders.environment=${ENVIRONMENT:development}
flyway.placeholderReplacement=true
flyway.placeholderPrefix=${
flyway.placeholderSuffix=}

# SQL Migration Prefix and Suffix
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql

# Execution
# Controls how migrations are executed
flyway.connectRetries=3
flyway.lockRetryCount=10
flyway.encoding=UTF-8